aid: infocert

name: InfoCert

description: InfoCert (legal entity Tinexta Infocert S.p.A., Rome, part of the Tinexta Group) is a European Digital Trust provider and qualified
  trust service provider. It offers SPID digital identity, qualified digital signatures and e-sealing (GoSign, InfoCert Sign), Legalmail certified
  email (PEC/REM), LegalInvoice e-invoicing, LegalDoc digital preservation, timestamps, signature validation and remote identification, with APIs
  documented on its InfoCert Developers Portal.

