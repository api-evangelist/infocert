      birthDate:
        type: string
        format: date
      gender:
        type: string
      taxID:
        type: string
      vatID:
        type: string
      telephone:
        type: string
      email:
        type: string
      digitalAddress:
        type: string
      address:
        $ref: '#/definitions/PostalAddress'
      electronicId:
        $ref: '#/definitions/ElectronicID'
      physicalId:
        $ref: '#/definitions/PhysicalID'
