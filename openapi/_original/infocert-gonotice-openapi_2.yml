  /single/{dispatchExternalID}/events:
    post:
      tags:
        - Single Dispatch
      summary: Report to gonotice backend the delivery or interaction events for a communication
      description: >
        This endpoint is used by external systems (e.g., email, SMS, or WhatsApp providers) to notify the backend about a specific event that occurred for a communication notification. Typical events include when the notification is sent, delivered, opened, or when an error occurs.

      operationId: reportCommunicationEvent
      parameters:
        - $ref: "#/components/parameters/dispatchExternalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - timestamp
              properties:
                event:
                  type: string
                  description: >
                    The type of event received from the external provider.

                  enum:
                    - notification_sent
                    - notification_delivered
                    - notification_opened
                    - notification_error
                message:
                  type: string
                  description: >
                    Optional free-text description providing more details about the event, such as error notification or provider-specific information.

                eventTimestamp:
                  type: string
                  format: date-time
                  description: >
                    ISO 8601 timestamp representing when the event occurred, for example `"2025-11-03T15:42:10Z"`.

            examples:
              messageSent:
                summary: Notification successfully sent
                value:
                  event: notification_sent
                  message: "Notification accepted for delivery by provider"
                  eventTimestamp: "2025-11-03T10:12:34Z"
              messageDelivered:
                summary: Notification delivered to recipient
                value:
                  event: notification_delivered
                  message: "Notification delivered to device"
                  eventTimestamp: "2025-11-03T10:13:21Z"
              messageOpened:
                summary: Recipient opened the notification
                value:
                  event: notification_opened
                  message: "Recipient viewed the notification content"
                  eventTimestamp: "2025-11-03T10:15:02Z"
              messageError:
                summary: Provider reported an error
                value:
                  event: notification_error
                  message: "Delivery failed: invalid recipient address"
                  eventTimestamp: "2025-11-03T10:16:45Z"
      responses:
        "200":
          $ref: "#/components/responses/200"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
