    SingleDispatchCommunicationToken:
      title: SingleDispatchCommunicationLink
      type: object
      description: 'Represents a direct access link to a single communication.   The full URL can be reconstructed as: `{basePath}/{communicationPath}/{communicationToken}`

'
      properties:
        basePath:
          type: string
          description: 'Base domain or environment-specific root URL.   Typically represents the public endpoint for recipients.

'
          example: https://recipient.gonotice.digital
        communicationPath:
          type: string
          description: 'Path segment used for accessing a single communication. It can vary by environment or routing convention.

'
          example: cm
        communicationToken:
          type: string
          description: 'Unique token identifying the specific communication to be accessed.

'
          example: 9db97b625cbb401d9c50c6bddc6fd09f4401bfdab00443dda1f22e4587124196
      required:
        - basePath
        - communicationPath
        - communicationToken
      example:
        basePath: https://recipient.gonotice.digital
        communicationPath: cm
        communicationToken: 9db97b625cbb401d9c50c6bddc6fd09f4401bfdab00443dda1f22e4587124196
    MassiveAttachment:
      title: Attachment
      type: object
      properties:
        name:
          description: Descriptive name of the attachment. Can be shown to the users and recipients.
          type: string
        filename:
          description: Filename with extension but without path
          type: string
        size:
          description: File size in KB
          type: number
          format: int32
          minimum: 0
        mimeType:
          type: string
        url:
          description: Path to zip
          type: string
        massiveUpload:
          description: It's set to true if the attachment is inside a zip
          type: boolean
        template:
          description: It's set to true if the attachment a template
          type: boolean
          example: false
        placeholders:
          description: List of placeholders
          type: array
          items:
            type: string
          default: []
      required:
        - name
        - filename
        - mimeType
      example:
        - name: Document to be approved
          filename: document.pdf
          size: 30
          mimeType: application/pdf
          url: uploads/dispatch////document.pdf
          massiveUpload: false
        - name: Document to be approved
          filename: document_in_zip.pdf
          size: 89
          mimeType: application/zip
          url: uploads/dispatch////filezip.zip
          massiveUpload: true
        - name: Document to be approved
          filename: another_document_in_zip.pdf
          size: 89
          mimeType: application/zip
          url: uploads/dispatch////filezip.zip
          massiveUpload: true
        - name: Template name
          template: true
          filename: template_name.docx
          size: 121
          mimeType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
          url: uploads/dispatch////template_name.docx
          placeholders:
            - ${recipient.details.role}
            - ${recipient.firstName}
            - ${recipient.details.azienda}
