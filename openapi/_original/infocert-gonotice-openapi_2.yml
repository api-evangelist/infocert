          minimum: 0
        pageSize:
          description: Page size
          type: integer
          minimum: 1
        prevPageToken:
          description: Token to be used to retrieve the previous page
          type: string
        nextPageToken:
          description: Token to be used to retrieve the next page
          type: string
        pageIndex:
          description: Page index
          type: integer
          minimum: 0
    Sorting:
      type: object
      description: Sorting object
      properties:
        propertyName:
          description: Property to sort on
          type: string
        direction:
          description: Sorting direction (asc/desc)
          $ref: '#/components/schemas/SortingDirection'
    SortingDirection:
      type: string
      description: Sorting direction
      enum:
        - asc
        - desc
    SendingPolicy:
      title: SendingPolicy
      type: object
      description: Controls retry scheduling. If numberOfRetries is greater than 1, frequency must be > 0.
      properties:
        numberOfRetries:
          type: integer
          minimum: 1
          maximum: 5
          description: Number of attempts (including first try)
        frequency:
          type: integer
          minimum: 0
          description: Delay between retries (unit defined by backend; 0 allowed only when numberOfRetries=1)
        timeout:
          type: integer
          minimum: 1
          description: Overall timeout before the dispatch expires (unit defined by backend)
      required:
        - numberOfRetries
        - frequency
        - timeout
      additionalProperties: false
      allOf:
        - if:
            properties:
              numberOfRetries:
                minimum: 2
            required:
              - numberOfRetries
          then:
            properties:
              frequency:
                minimum: 1
      example:
        numberOfRetries: 1
        frequency: 0
        timeout: 10
    Attachment:
      title: Attachment
      type: object
      properties:
        name:
          description: Descriptive name of the attachment. Can be shown to the users and recipients.
          type: string
