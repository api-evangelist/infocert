  '/':
    post:
      summary: Receive Dispatch Status Update
      tags:
        - Callback
      operationId: callback
      description: |
        Endpoint for receiving a POST request containing the latest status update (fact) for a specific dispatch.
        The system receiving this callback should respond with an **HTTP 200 OK** upon successful processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchUpdate'
            example:
              tenantId: aaaaaaaa-1111-2222-3333-bbbbbbbbbbbb
              ptId: cccccccc-4444-5555-6666-dddddddddddd
              campaign:
                cc: default
                id: eeeeeeee-7777-8888-9999-ffffffffffff
                name: Example Template - Campaign
              sd:
                recipient:
                  mn: ''
                  ln: Doe
                  tz: Europe/Rome
                  fn: John
                  details:
                    id: 11111111-aaaa-bbbb-cccc-222222222222
                  title: Mr.
                  lang: eng
                  authLvl: None
                  email: recipient.name@example.com
                id: 33333333-dddd-eeee-ffff-444444444444
              cdId: 55555555-0000-1111-2222-666666666666
              newFact:
                id: 77777777-3333-4444-5555-888888888888
                factType: accepted_by_remote
                timestamp: '1761124380' # Example timestamp in the future
                fromState: sending
                toState: completed
                deliveryInfo:
                  mail:
                    timestamp: '2025-10-22T09:12:59.070Z'
                    source: "Source Organization <noreply@source.digital>"
                    sourceArn: "arn:aws:ses:eu-west-1:000000000000:identity/noreply@source.digital"
                    sourceIp: "1.2.3.4"
                    callerIdentity: "source-service-execution"
                    sendingAccountId: "000000000000"
                    messageId: "0102019a0b3169be-cb49f6bd-ed1f-4e44-817a-dcd0d1305610-000000"
                    destination:
                      - "John Doe <recipient.name@example.com>"
                  delivery:
                    timestamp: '2025-10-22T09:12:59.914Z'
                    processingTimeMillis: 844
                    recipients:
                      - recipient.name@example.com
                    smtpResponse: "250 2.0.0 OK (success message) - gsmtp"
                    remoteMtaIp: "5.6.7.8"
                    reportingMTA: "mta.amazon.com"
      responses:
        '200':
          description: Update successfully received and processed.
        '400':
          description: Invalid request payload.
        '500':
          description: Internal server error on the callback receiver side.
components:
  securitySchemes:
    openID:
      $ref: "#/components/securitySchemes/openID"
      description: "OpenID connection"
      type: openIdConnect
      openIdConnectUrl: https://idp.infocert.digital/auth/realms/edelivery/.well-known/openid-configuration
    oAuth2:
      $ref: "#/components/securitySchemes/oAuth2"
      type: oauth2
      description: "Oauth2 information"
      flows:
        authorizationCode:
          description: "Authorization code"
          authorizationUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/auth
          tokenUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/token
          refreshUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/token
          scopes:
            edelivery: This scope is required
        password:
          description: "Password"
          tokenUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/token
          refreshUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/token
          scopes:
            edelivery: This scope is required
  schemas:
    DispatchUpdate:
      type: object
      description: The root object containing the dispatch update information.
      properties:
        tenantId:
          type: string
          format: uuid
          description: Unique identifier for the tenant/customer.
        ptId:
          type: string
          format: uuid
          description: Internal project or template identifier.
        campaign:
          $ref: '#/components/schemas/Campaign'
        sd:
          $ref: '#/components/schemas/SD'
        cdId:
          type: string
          format: uuid
          description: Unique identifier for the communication dispatch.
        newFact:
          $ref: '#/components/schemas/NewFact'
      required:
        - tenantId
        - ptId
        - campaign
        - sd
        - cdId
        - newFact
    CertifiedDispatchFound:
      title: CertifiedDispatchFound
      description: "A Certified Dispatch found"
      type: object
      properties:
        id:
          type: string
          description: "Dispatch id"
        status:
          description: "Certified dispatch status"
          $ref: "#/components/schemas/CertifiedDispatchStatus"
    NewFact:
      type: object
      description: The new status update (fact) for the dispatch.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this specific fact/update.
        factType:
          type: string
          description: The type of update event, e.g., 'accepted_by_remote'. This is the key status change.
        timestamp:
          type: string
          description: Unix timestamp (seconds) when the fact occurred.
        fromState:
          type: string
          description: The state the dispatch was in *before* this update, e.g., 'sending'.
        toState:
          type: string
          description: The new state of the dispatch, e.g., 'completed'.
        deliveryInfo:
          $ref: '#/components/schemas/DeliveryInfo'
      required:
        - id
        - factType
        - timestamp
        - fromState
        - toState
    DeliveryInfo:
      type: object
      description: Detailed information about the delivery attempt.
      properties:
        mail:
          $ref: '#/components/schemas/MailDetails'
        delivery:
          $ref: '#/components/schemas/DeliveryDetails'
    MailDetails:
      type: object
      description: Details about the message as sent from the mail provider.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Mail sending timestamp (ISO 8601).
        source:
          type: string
        sourceArn:
          type: string
        sourceIp:
          type: string
          format: ipv4
        callerIdentity:
          type: string
        sendingAccountId:
          type: string
        messageId:
          type: string
        destination:
          type: array
          items:
            type: string
    DeliveryDetails:
      type: object
      description: Specific details about the successful delivery to the remote server.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Mail delivery timestamp (ISO 8601).
        processingTimeMillis:
          type: integer
          description: Time taken to process the delivery.
        recipients:
          type: array
          items:
            type: string
            format: email
        smtpResponse:
          type: string
          description: Full SMTP response from the remote server.
        remoteMtaIp:
          type: string
          format: ipv4
          description: IP address of the remote Mail Transfer Agent (MTA).
        reportingMTA:
          type: string
          description: The MTA that reported this delivery status.
    Campaign:
      type: object
      description: Campaign details associated with the dispatch.
      properties:
        cc:
          type: string
          description: Campaign code.
        id:
          type: string
          format: uuid
          description: Unique identifier of the campaign.
        name:
          type: string
          description: Human-readable name of the campaign.
      required:
        - id
        - name
    SD:
      type: object
      description: Service Dispatch (SD) details.
      properties:
        recipient:
          $ref: '#/components/schemas/Recipient'
        id:
          type: string
          format: uuid
          description: Unique identifier for the specific service dispatch instance.
      required:
        - id
        - recipient
    GetCertifiedDispatch:
      title: GetCertifiedDispatch
      type: object
      properties:
        id:
          type: string
          description: "Dispatch id"
        processTypeExternalID:
          type: string
          description: "Process type external id"
        campaignName:
          type: string
          description: "Campaign name"
        costCenter:
          type: string
          description: "Cost Center"
        timedout:
          type: boolean
          description: "true if C.D. was not completed within a timeout"
        status:
          description: "Certified dispatch status"
          $ref: "#/components/schemas/CertifiedDispatchStatus"
        recipient:
          description: "Recipient"
          $ref: "#/components/schemas/Recipient"
        facts:
          description: "Array of facts"
          type: array
          items:
            $ref: "#/components/schemas/DispatchFact"
          example:
            - factType: scheduled
              fromState: scheduled
              toState: scheduled
              deliveryInfo:
                approximate_scheduling_time: "2023-11-27T10:00Z"
                raw_unix_start_time: 1701083580.0
                raw_unix_end_time: 1701948600.0
              timestamp: "1701083286"
            - factType: scheduled
              fromState: scheduled
              toState: sending
              deliveryInfo: {}
              timestamp: "1701083440"
    Recipient:
      title: Recipient
      type: object
      properties:
        fullName:
          description: "Full name"
          type: string
        title:
          description: "Title"
          type: string
          example: Mr.
        email:
          description: "Required when sending mail communications"
          type: string
          example: mario.rossi@example.com
        mobileNumber:
          description: "Required when sending SMS communications"
          type: string
          example: "+393331234567"
        firstName:
          type: string
          description: First Name
          example: Mario
        lastName:
          type: string
          description: Last Name
          example: Rossi
        language:
          type: string
          description: Language in ISO 639-2 Code (alpha-3) format, like 'ita', 'eng'
          example: eng
        timezone:
          type: string
          description: Timezone following the IANA Time Zone Database format (Europe/Berlin, Etc/UCT, etc.)
          example: Europe/Rome
        identificationProperties:
          description: key -> value map of additional properties used to identify the recipient
          type: object
          additionalProperties:
            type: string
          example:
            taxID: "RSSMRA80A01H501U"
        details:
          description: key -> value map of additional properties useful to customize the subject or the body of the communications
          type: object
          additionalProperties:
            type: string
          example:
            company: ACME Corporation
            org_unit: Marketing
            org_role: Manager
        attachments:
          description: Zero or more attachments for this recipient
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
        authenticationLevel:
          type: string
          description: Authentication level
          enum:
            - None
            - OtpSms
            - OtpEmail
            - CertifiedUserIdentification
          example: CertifiedUserIdentification
      required:
        - fullName
    DispatchFact:
      title: DispatchFact
      description: "Dispatch Fact"
      type: object
      properties:
        timeStamp:
          description: "Timestamp"
          type: string
          format: date-time
        factType:
          description: "Fact type"
          type: string
          enum:
            - scheduled
            - sent_ok
            - sent_error
            - rescheduled
            - accepted_by_remote
            - email_opened
            - attach_opened
            - explicit_acceptance
            - explicit_rejection
            - timed_out
        fromState:
          description: "From state"
          $ref: "#/components/schemas/CertifiedDispatchStatus"
        toState:
          description: "To state"
          $ref: "#/components/schemas/CertifiedDispatchStatus"
        details:
          description: "Details as an object"
          type: object
    DispatchReport:
      title: DispatchReport
      type: object
      properties:
        name:
          description: "Report name"
          type: string
          example: "Delivery report of John Smith"
        filename:
          description: "Filename with extension but without path"
          type: string
          example: "report.pdf"
        mimeType:
          description: "Standard internet mime-type"
          type: string
          example: "application/pdf"
        url:
          description: "Link to the bytes of the attachment. Available schemas: multipart, https"
          type: string
          example: "multipart:multipart_id"
      required:
        - name
        - filename
        - mimeType
    ProcessType:
      title: processType
      type: object
      properties:
        processTypeName:
          type: string
          description: Process type name
        sendingPolicy:
          description: Sending policy
          $ref: '#/components/schemas/SendingPolicy'
        certificationLevels:
          description: Certification levels
          $ref: '#/components/schemas/ProcessTypeCertificationLevels'
        smsChannel:
          description: SMS channel
          $ref: '#/components/schemas/smsChannel'
        emailChannel:
          $ref: '#/components/schemas/emailChannel'
          description: Email Channel
        whatsappChannel:
          $ref: '#/components/schemas/whatsappChannel'
          description: WhatsApp Channel
        externalChannel:
          $ref: '#/components/schemas/externalChannel'
          description: External Channel
        reminderConfiguration:
          $ref: '#/components/schemas/ReminderConfiguration'
          description: Optional reminder configuration
        failoverChannels:
          description: List of failover channels
          type: array
          items:
            type: object
            properties:
              channelName:
                type: string
                description: Channel failover name
                enum:
                  - emailChannel
                  - smsChannel
                  - whatsappChannel
              channelPriority:
                type: integer
                description: channel priority for next hop
              channelDetails:
                oneOf:
                  - $ref: '#/components/schemas/emailChannel'
                  - $ref: '#/components/schemas/smsChannel'
                  - $ref: '#/components/schemas/whatsappChannel'
        attachments:
          description: Zero or more common attachments
          type: object
          properties:
            content:
              type: array
              description: Array of attachments
              items:
                $ref: '#/components/schemas/Attachment'
              example:
                - name: Document to be approved
                  filename: document.pdf
                  size: 30
                  mimeType: application/pdf
                  url: uploads/pt////document.pdf
                - name: Template name
                  template: true
                  filename: template_name.docx
                  size: 121
                  mimeType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
                  url: uploads/pt////template_name.docx
                  placeholders:
                    - ${recipient.details.role}
                    - ${recipient.firstName}
                    - ${recipient.details.azienda}
            certificationLevel:
              description: Certification level for attachment opening
              type: string
              enum:
                - AttachmentOpened
            additionalAttachmentCount:
              type: integer
              minimum: 0
              maximum: 9
              description: Zero or more attachments to be added in the single dispatches
        externalID:
          type: string
          description: External ID
        status:
          description: Process type status
          $ref: '#/components/schemas/ProcessTypeStatus'
        rejectReasons:
          description: Reject reasons
          $ref: '#/components/schemas/RejectReason'
    CreateProcessType:
      title: CreateProcessType
      description: Creation of a Process Type.
      type: object
      properties:
        externalID:
          type: string
          description: Optional external identifier provided by the caller
        processTypeName:
          type: string
          description: Process type name
        sendingPolicy:
          description: Sending policy (validated based on selected channel)
        certificationLevels:
          $ref: '#/components/schemas/ProcessTypeCertificationLevels'
          description: Certification levels to generate
        smsChannel:
          $ref: '#/components/schemas/smsChannel'
          description: SMS Channel
        emailChannel:
          $ref: '#/components/schemas/emailChannel'
          description: Email Channel
        whatsappChannel:
          $ref: '#/components/schemas/whatsappChannel'
          description: WhatsApp Channel
        externalChannel:
          $ref: '#/components/schemas/externalChannel'
          description: External Channel
        attachments:
          description: Zero or more common attachments
          type: object
          properties:
            content:
              description: Array of attachments
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            certificationLevel:
              description: Certification level
              type: string
              enum:
                - None
                - AttachmentOpened
            additionalAttachmentCount:
              type: integer
              minimum: 0
              maximum: 9
              description: Zero or more attachments to be added in the single dispatches
        rejectReasons:
          type: array
          items:
            $ref: '#/components/schemas/RejectReason'
          description: Reject reasons
          default: []
        failoverChannels:
          type: array
          items:
            $ref: '#/components/schemas/FailoverChannel'
          description: Failover channels
          default: []
        reminderConfiguration:
          $ref: '#/components/schemas/ReminderConfiguration'
          description: Optional reminder configuration
      oneOf:
        - required:
            - processTypeName
            - smsChannel
        - required:
            - processTypeName
            - emailChannel
        - required:
            - processTypeName
            - whatsappChannel
        - required:
            - processTypeName
            - externalChannel
      allOf:
        - if:
            properties:
              externalChannel:
                type: object
            required:
              - externalChannel
          then:
            properties:
              sendingPolicy:
                $ref: '#/components/schemas/ExternalChannelSendingPolicy'
            required:
              - sendingPolicy
          else:
            properties:
              sendingPolicy:
                $ref: '#/components/schemas/SendingPolicy'
            required:
              - sendingPolicy
      additionalProperties: false
    RejectReason:
      title: rejectReason
      type: object
      description: Reject reason
      properties:
        defaultReason:
          type: string
          description: Default reason
      additionalProperties:
        description: 'Key-value pairs for reason localization: keys are languages in ISO 639-2 Code (alpha-3) format, like ''ita'', ''eng'''
        type: string
      example:
        defaultReason: I'm not interested
        ita: Non mi interessa
        fra: Je ne suis pas intéressé
      required:
        - defaultReason
    smsChannel:
      title: smsChannel
      type: object
      properties:
        body:
          type: string
          description: Message body
      required:
        - body
      additionalProperties: false
    whatsappChannel:
      title: whatsappChannel
      type: object
      properties:
        body:
          type: string
          description: Message body
      required:
        - body
      additionalProperties: false
    externalChannel:
      title: externalChannel
      type: object
      properties:
        subject:
          type: string
          maxLength: 200
          description: Message subject
        body:
          type: string
          description: Message body (HTML supported for email/external)
      required:
        - subject
        - body
      additionalProperties: false
    emailChannel:
      title: emailChannel
      type: object
      properties:
        subject:
          type: string
          maxLength: 200
          description: Message subject
        body:
          type: string
          description: Message body (HTML supported for email/external)
      required:
        - subject
        - body
      additionalProperties: false
    OperationOutcome:
