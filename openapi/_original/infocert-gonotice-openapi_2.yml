    get:
      tags:
        - Certified Dispatches
      summary: "Get Certified Dispatch History of events"
      operationId: getCertifiedDispatchHistory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recipientFullName:
                    type: string
                  attempts:
                    type: integer
                  facts:
                    type: array
                    items:
                      type: object
                      properties:
                        factType:
                          type: string
                        details:
                          type: object
                          additionalProperties:
                            type: string
                          example:
                            "detail": "recipientaddress@email.com"
                        timestamp:
                          type: integer
              examples:
                failover:
                  value:
                    recipientFullName: "Mario Rossi"
                    attempts: 1 # Total attempts
                    facts:
                      - factType: "scheduled"
                        details:
                          "detail": "1686900700" # Approximated scheduling time
                        timestamp: 1686900500
                      - factType: "sending"
                        details:
                          "detail": "1" # Current attempt
                        timestamp: 1686900700
                      - factType: "accepted_by_remote"
                        details:
                          "detail": "mariorossi@email.com" # Destination
                        timestamp: 1686900700
                      - factType: "sent_error"
                        details:
                          "detail": "NotExistMailPermanentBounce" # Error code
                        timestamp: 1686900800
                      - factType: "failover"
                        details:
                          "from_channel": "email"
                          "to_channel": "sms"
                          "from_destination": "mariorossi@email.com"
                          "to_destination": "+391111111111"
                        timestamp: 1686900019
        "400":
