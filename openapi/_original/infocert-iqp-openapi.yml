openapi: 3.0.1
info:
  title: IQP API
  description: Identity Qualification Platform API
  version: '1.0.1'
servers:
  - url: 'https://apitest.infocert.digital/identification/iqp/v1/'
    description: 'environment: Test'
  - url: 'https://apistage.infocert.digital/identification/iqp/v1/'
    description: 'environment: Staging/UAT'
  - url: 'https://api.infocert.digital/identification/iqp/v1/'
    description: 'environment: Production'
tags:
  - name: Auth
    description:
  - name: Dossier
    description:
  - name: Meeting
    description:
  - name: Process
    description:
  - name: Queue
    description:

paths:
  /auth/token:
    post:
      tags:
        - Auth
      summary: Provide a new token with openid connect
      operationId: getOpenIdConnectTokenUsingPOST
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
                - client_id
                - grant_type
              properties:
                client_id:
                  type: string
                  description: client_id
                client_secret:
                  type: string
                  description: client_secret
                grant_type:
                  type: string
                  description: grant_type
                scope:
                  type: string
                  description: scope
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '302':
          description: Redirect
          content: {}
        '404':
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        '500':
          description: Service Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: true
  /dossier/{dossierId}/evidence/{evidenceId}/content:
    get:
      tags:
        - Dossier
      summary: return the content of an existing Evidence for the dossier specified by Id
      security:
        - Authentication:
            - identification-iqp
      operationId: getEvidenceContentUsingGET
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
        - name: evidenceId
          in: path
          description: evidenceId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        201:
          description: Successfully created
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        204:
          description: No Content
          content:
            application/octet-stream:
              schema:
                type: object
        404:
          description: resource could not be found.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /dossier/{dossierId}/evidence/{evidenceId}:
    get:
      tags:
        - Dossier
      summary: get an existing Evidence for the dossier specified by Id
      security:
        - Authentication:
            - identification-iqp
      operationId: getEvidenceUsingGET
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
        - name: evidenceId
          in: path
          description: evidenceId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        204:
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
    put:
      tags:
        - Dossier
      summary: update an existing Evidence for the dossier specified by Id
      security:
        - Authentication:
            - identification-iqp
      operationId: updateEvidenceMetadataUsingPUT
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
        - name: evidenceId
          in: path
          description: evidenceId
          required: true
          schema:
            type: string
      requestBody:
        description: evidenceMetadataRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceMetadataRequest'
        required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        204:
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
      x-codegen-request-body-name: evidenceMetadataRequest
  /dossier/{dossierId}/evidence:
    post:
      tags:
        - Dossier
      summary: Create a new Evidence for the dossier specified by Id
      security:
        - Authentication:
            - identification-iqp
      operationId: createEvidenceUsingPOST
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
      requestBody:
        description: evidenceRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceRequest'
        required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        204:
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
      x-codegen-request-body-name: evidenceRequest
  /dossier/{dossierId}/evidences:
    get:
      tags:
        - Dossier
      summary: get all existing Evidences for the dossier specified by Id
      security:
        - Authentication:
            - identification-iqp
      operationId: getAllEvidencesUsingGET
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceModel'
        204:
          description: No Content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /dossier/{dossierId}/person:
    get:
      tags:
        - Dossier
      summary: 'Retrieve the Person for the dossier specified by Id and scope '
      security:
        - Authentication:
            - identification-iqp
      operationId: getPersonUsingGET
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
        - name: scope
          in: query
          description: scope
          schema:
            type: string
            enum:
              - ORIGINAL
              - IDENTITY
              - OCR
              - NFC
              - BEST_VALUES
              - MRZ
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /dossier/{dossierId}/report/{reportId}/content:
    get:
      tags:
        - Dossier
      summary: get the binary content of the report specified by Id (with contentType specification)
      security:
        - Authentication:
            - identification-iqp
      operationId: getReportContentUsingGET
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          description: reportId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ReportModel'
        201:
          description: Successfully created
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ReportModel'
        204:
          description: No Content
          content:
            application/octet-stream:
              schema:
                type: string
                format: byte
        404:
          description: resource could not be found.
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /dossier/{dossierId}/report/{reportId}:
    get:
      tags:
        - Dossier
      summary: get a Report for the dossier specified by Id
      security:
        - Authentication:
            - identification-iqp
      operationId: getReportUsingGET
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
        - name: reportId
          in: path
          description: reportId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportModel'
        204:
          description: No Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /dossier/{dossierId}/reports:
    get:
      tags:
        - Dossier
      summary: get all existing Reports for the dossier specified by Id
      security:
        - Authentication:
            - identification-iqp
      operationId: getAllReportsUsingGET
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportModel'
        204:
          description: No Content
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /dossier/{dossierId}:
    get:
      tags:
        - Dossier
      summary: 'Return the dossier from its Id '
      security:
        - Authentication:
            - identification-iqp
      operationId: getDossierUsingGET
      parameters:
        - name: dossierId
          in: path
          description: dossierId
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: version
          schema:
            type: string
            enum:
              - FULL
              - SUMMARY
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /dossier:
    post:
      tags:
        - Dossier
      summary: Create a new  dossier. A Dossier is a container of Person, Comment, Evidence, Report, ScreenRecord
      security:
        - Authentication:
            - identification-iqp
      operationId: createDossierUsingPOST
      requestBody:
        description: dossierRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierRequest'
        required: true
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DossierModel'
        404:
          description: resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
      x-codegen-request-body-name: dossierRequest
  /meeting/{instanceId}/recordings:
    get:
      tags:
        - Meeting
      summary: downloadRecords
      security:
        - Authentication:
            - identification-iqp
      operationId: downloadRecordsUsingGET
      parameters:
        - name: instanceId
          in: path
          description: instanceId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/RecordModel'
        201:
          description: Successfully created
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/RecordModel'
        404:
          description: resource could not be found.
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        409:
          description: resource already exists.
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/zip:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /process/instance/action:
    get:
      tags:
        - Process
      summary: get the data model for a specific action
      security:
        - Authentication:
            - identification-iqp
      operationId: getActionModelUsingGET
      parameters:
        - name: actionInstanceId
          in: query
          description: actionInstanceId
          schema:
            type: string
        - name: allParams
          in: query
          description: allParams
          required: true
          schema: {}
        - name: processInstanceId
          in: query
          description: processInstanceId
          required: true
          schema:
            type: string
        - name: routingKey
          in: query
          description: routingKey
          schema:
            type: string
        - name: runnableId
          in: query
          description: runnableId
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionModel'
        404:
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
    put:
      tags:
        - Process
      summary: request the execution of a specific action
      security:
        - Authentication:
            - identification-iqp
      operationId: performActionUsingPUT
      parameters:
        - name: scheduler-attempt
          in: header
          description: scheduler-attempt
          schema:
            type: integer
            format: int32
        - name: scheduler-max-attempts
          in: header
          description: scheduler-max-attempts
          schema:
            type: integer
            format: int32
      requestBody:
        description: request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformActionByInstance_ActionRequest_'
        required: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        404:
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
      x-codegen-request-body-name: request
  /process/instance/availableActions:
    get:
      tags:
        - Process
      summary: obtain available actions (in ready state) for a specific process instance
      security:
        - Authentication:
            - identification-iqp
      operationId: getAvailableActionsUsingGET
      parameters:
        - name: actionType
          in: query
          description: actionType
          schema:
            type: string
            enum:
              - SYSTEM
              - REMOTE
              - LOCAL
        - name: includeAutoAction
          in: query
          description: includeAutoAction
          required: true
          schema:
            type: boolean
        - name: processInstanceId
          in: query
          description: processInstanceId
          required: true
          schema:
            type: string
        - name: tags
          in: query
          description: tags
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessActions'
        404:
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /process/instance/dataStorages:
    get:
      tags:
        - Process
      summary: obtain the datastorages
      security:
        - Authentication:
            - identification-iqp
      operationId: getDataStoragesUsingGET
      parameters:
        - name: dataStorageType
          in: query
          description: dataStorageType
          schema:
            type: string
        - name: processInstanceId
          in: query
          description: processInstanceId
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataStorage'
        404:
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /process/instance/status:
    get:
      tags:
        - Process
      summary: returns the process status, available actions can be retrieved with a specific parameter
      security:
        - Authentication:
            - identification-iqp
      operationId: getProcessStatusUsingGET
      parameters:
        - name: availableActions
          in: query
          description: availableActions
          schema:
            type: boolean
            default: false
        - name: processInstanceId
          in: query
          description: processInstanceId
          required: true
          schema:
            type: string
        - name: progress
          in: query
          description: progress
          schema:
            type: boolean
            default: false
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptorProcessInstance'
        404:
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
  /process/instance:
    get:
      tags:
        - Process
      summary: obtain the process instance
      security:
        - Authentication:
            - identification-iqp
      operationId: getProcessInstanceUsingGET
      parameters:
        - name: processInstanceId
          in: query
          description: processInstanceId
          required: true
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstance'
        404:
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
    post:
      tags:
        - Process
      summary: start new instance of desired process
      security:
        - Authentication:
            - identification-iqp
      operationId: startProcessUsingPOST
      requestBody:
        description: startProcessRequest
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProcessServiceRequest'
        required: true
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartProcessServiceResponse'
        404:
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
      x-codegen-request-body-name: startProcessRequest
  /queue/item/{itemId}/position:
    get:
      tags:
        - Queue
      summary: 'Return the Item position from its Id '
      security:
        - Authentication:
            - identification-iqp
      operationId: getQueuePositionUsingGET
      parameters:
        - name: itemId
          in: path
          description: itemId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItemModel'
        201:
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueItemModel'
        404:
          description: Some resource could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
        500:
          description: Service Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestApiErrorResponse'
      deprecated: false
components:
  schemas:
    ActionDefinition:
      title: ActionDefinition
      type: object
      properties:
        configuration:
          type: object
          additionalProperties:
            type: object
            properties: {}
        id:
          type: integer
          format: int64
        name:
          type: string
        runnableId:
          type: string
        tags:
          type: array
          items:
            type: string
    ActionErrorBanner:
      title: ActionErrorBanner
