      x-amazon-apigateway-request-validator: "Validate body, query string parameters,\
        \ and headers"
      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies/{companyId}"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.path.companyId: "method.request.path.companyId"
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
        passthroughBehavior: "when_no_match"
        httpMethod: "GET"
        type: "http_proxy"
    delete:
      summary: Delete an existing company.
      tags:
        - company
      parameters:
        - $ref: '#/parameters/companyId'
      responses:
        '204':
          $ref: '#/responses/204NoContent'
        '403':
          $ref: '#/responses/403ForbiddenError'
      x-amazon-apigateway-request-validator: "Validate body, query string parameters,\
        \ and headers"
      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies/{companyId}"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.path.companyId: "method.request.path.companyId"
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
        passthroughBehavior: "when_no_match"
        httpMethod: "DELETE"
        type: "http_proxy"
  '/companies/byCode/{vatOrVies}':
    get:
      tags:
        - company
      summary: |
        The details of a company given its VAT number or VIES.
      parameters:
        - name: vatOrVies
          in: path
          description: The VAT or VIES identification number.
          required: true
          type: string
        - $ref: "#/parameters/companyGroupCode"
        - $ref: "#/parameters/idPaese"
      responses:
        '200':
          description: |
            The company has been correctly retrieved.
          schema:
            $ref: '#/definitions/company'
        '403':
          $ref: '#/responses/403ForbiddenError'
        '404':
          $ref: '#/responses/404NotFoundError'
      x-amazon-apigateway-request-validator: "Validate body, query string parameters,\
        \ and headers"
      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies/byCode/{vatOrVies}"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.path.vatOrVies: "method.request.path.vatOrVies"
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
        passthroughBehavior: "when_no_match"
        httpMethod: "GET"
        type: "http_proxy"
  '/companies/byCode/{vatOrVies}/revoca':
    post:
      summary: Revoke every product associated with the vatOrVies.
      tags:
        - company
      parameters:
        - name: vatOrVies
          in: path
          description: The VAT or VIES identification number.
          required: true
          type: string
        - $ref: "#/parameters/revocationType"
        - $ref: "#/parameters/idPaese"
      responses:
        '200':
          description: |
            The list of productId correctly revoked.
          schema:
            type: array
            items:
             $ref: '#/definitions/productId'
        '400':
          $ref: '#/responses/400BadRequestError'
        '401':
          $ref: '#/responses/403ForbiddenError'
        '403':
          $ref: '#/responses/403ForbiddenError'
      x-amazon-apigateway-request-validator: "Validate body, query string parameters,\
        \ and headers"
      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies/byCode/{vatOrVies}/revoca"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.path.vatOrVies: "method.request.path.vatOrVies"
          integration.request.querystring.revocationType: "method.request.querystring.revocationType"
          integration.request.querystring.idPaese: "method.request.querystring.idPaese"
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        type: "http_proxy"
  '/companies/{companyId}/provisioning':
    get:
      summary: |
        Get the whole provisioning of a company.
      tags:
        - provisioning
      parameters:
