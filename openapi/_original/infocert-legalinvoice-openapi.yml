      tags:
        - provisioning
      parameters:
        - $ref: '#/parameters/companyId'
        - in: body
          name: body
          description: An object describing the outbound pec mailbox. An empty object ('{}') will remove the current configuration.
          schema:
            $ref: '#/definitions/provisioningPecOutbound'
      responses:
        '200':
          description: >
            The resource has been successfully and correctly created.
        '400':
