        description: This attribute is required when 'tipoDocumento' is equal to 'fattura'.
        type: string
        example: Consorzio s.r.l.
      denominazione:
        description: This attribute is required when 'tipoDocumento' is equal to 'fattura'.
        type: string
        example: Azienda s.r.l.
