      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies/{companyId}/provisioning/pec/inbound"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.path.companyId: "method.request.path.companyId"
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
        passthroughBehavior: "when_no_match"
        httpMethod: "GET"
        type: "http_proxy"
    post:
      summary: >
        Create (the first time) or override all the PEC (Posta Elettronica Certificata) mailboxs for the company
        with the given companyId.
      tags:
        - provisioning
      parameters:
        - $ref: '#/parameters/companyId'
        - in: body
          name: body
          description: A list describing all the inbound pec mailboxs. An empty array will remove all the configured provisioning-pec-inbound mailboxs.
          schema:
            type: array
            items:
             $ref: '#/definitions/provisioningPecInbound'
      responses:
        '200':
          description: >
            The resource has been successfully and correctly created.
        '400':
          description: |
            The request is malformed.
          schema:
            $ref: '#/definitions/error'
        '403':
          $ref: '#/responses/403ForbiddenError'
        '422':
          description: |
            The PEC cannot be created.
          schema:
            $ref: '#/definitions/error'
      x-amazon-apigateway-request-validator: "Validate body, query string parameters,\
        \ and headers"
      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies/{companyId}/provisioning/pec/inbound"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.path.companyId: "method.request.path.companyId"
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
