responses:
  202Accepted:
    description: >
      The request has been acknowledged and accepted for processing,  but the
      processing has not been completed.
       
      The processing might or might not eventually be executed,  as it might be
      disallowed at a later stage, when it will actually take place.

      Please, note that there is no facility in HTTP for re-sending a status
      code from an asynchronous operation. So, the 202 response is intentionally
      noncommittal. 
  204NoContent:
    description: |
      The operation completed successfully.
  207Multistatus:
    description: >
      A [207 multistatus](https://httpstatuses.com/207) response which body is
      loosely based on
      [RFC4918](https://tools.ietf.org/html/rfc4918#section-13) 
    schema:
      type: array
      description: An array containing a status information for each submitted resource.
      items:
        type: object
        properties:
          partitaIva:
            type: string
            description: >
              The piva of the resource.
          documentId:
            type: string
            description: >
              The companyId of the resource. Optionally present, for
              instance when the resource has been created.
          status:
            type: string
            description: The HTTP status for this resource
          error:
            type: string
            description: The HTTP error description for this resource
  400BadRequestError:
    description: |
      The request is malformed, cannot be understood.
    schema:
      $ref: '#/definitions/error'
  401UnauthorizedError:
    description: |
      The request has not been applied because it lacks valid authentication credentials for the target resource.
  403ForbiddenError:
    description: |
      The authentication credentials are insufficient or incorrect to grant access.
  404NotFoundError:
    description: >
      It was impossible to find any resource matching the specified search
      criteria.      
  422UnprocessableEntityError:
    description: |
      The provided object cannot be created.
    schema:
      $ref: '#/definitions/error'
