swagger: '2.0'
info:
  version: 1.0.4
  title: Legal Invoice API
  description: >
    # Legal Invoice API

    Infocert Legal Invoice
    [OpenAPI](https://github.com/OAI/OpenAPI-Specification/blob/master/versions/3.0.1.md)
    Specification

    ## Notes

    Where possible, best practices outlined in the following documents are
    followed:
      
    * [Microsoft REST API
    Guidelines](https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md)
    * [Microsoft REST API
    Guidelines](https://docs.microsoft.com/en-us/azure/architecture/best-practices/api-design)
    * [Pragmatinc Restful
    API](http://www.vinaysahni.com/best-practices-for-a-pragmatic-restful-api)
     
  license:
    name: Infocert
host: api.infocert.digital
basePath: /einvoicing/sdigate/v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /companies/bulk:
    post:
      summary: Add a bulk of companies.
      tags:
        - company
        - bulk
      parameters:
        - in: body
          name: body
          description: A list of companies to create.
          schema:
            type: array
            items:
              $ref: '#/definitions/requestCompany'
      responses:
        '207':
          $ref: '#/responses/207Multistatus'
        '403':
          $ref: '#/responses/403ForbiddenError'
      x-amazon-apigateway-request-validator: "Validate body, query string parameters,\
        \ and headers"
      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies/bulk"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        type: "http_proxy"
  /companies:
    post:
      summary: Create a new company.
      tags:
        - company
      parameters:
        - in: body
          name: body
          description: An object describing a company.
          schema:
            $ref: '#/definitions/requestCompany'
      responses:
        '201':
          schema:
            $ref: '#/definitions/companyId'
          description: >
            The resource has been successfully and correctly created.
        '400':
          $ref: '#/responses/400BadRequestError'
        '403':
          $ref: '#/responses/403ForbiddenError'
        '422':
          $ref: '#/responses/422UnprocessableEntityError'
      x-amazon-apigateway-request-validator: "Validate body, query string parameters,\
        \ and headers"
      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
        passthroughBehavior: "when_no_match"
        httpMethod: "POST"
        type: "http_proxy"
    get:
      summary: |
        Get all companies.
      tags:
        - company
        - paginated
      parameters:
        - $ref: '#/parameters/companyGroupCode'
        - name: creata_dopo
          in: query
          description: >
            Limit the results to the companies which creation date is not 
            before the one provided.

            `creata_dopo` should be before `creata_prima` when the latter is
            also provided.
          required: false
          type: string
          format: date-time
        - name: creata_prima
          in: query
          description: >
            Limit the result to the companies which creation date is not later
            than the one provided.

            `creata_prima` should be bigger that `creata_dopo` when the latter
            is also provided.
          type: string
          format: date-time
          required: false
        - $ref: '#/parameters/paginationIndex'
        - $ref: '#/parameters/paginationItemsPerPage'
      responses:
        '200':
          description: |
            A list containing the selected companies.
          schema:
            $ref: '#/definitions/paginatedCompanies'
        '403':
          $ref: '#/responses/403ForbiddenError'
      x-amazon-apigateway-request-validator: "Validate body, query string parameters,\
        \ and headers"
      x-amazon-apigateway-integration:
        uri: "https://lbhublicoll.infocert.it/lbhublint/rest/companies"
        responses:
          default:
            statusCode: "200"
        requestParameters:
          integration.request.querystring.company_group_code: "method.request.querystring.company_group_code"
          integration.request.querystring.creata_dopo: "method.request.querystring.creata_dopo"
          integration.request.querystring.creata_prima: "method.request.querystring.creata_prima"
          integration.request.querystring.indice_pagina: "method.request.querystring.indice_pagina"
          integration.request.querystring.oggetti_per_pagina: "method.request.querystring.oggetti_per_pagina"
          integration.request.header.Authorization: "'Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='"
        passthroughBehavior: "when_no_match"
        httpMethod: "GET"
        type: "http_proxy"
  '/companies/{companyId}':
    get:
      tags:
        - company
      summary: |
        The details of a company given its identification.
      parameters:
        - $ref: '#/parameters/companyId'
      responses:
        '200':
          description: |
            The company has been correctly retrieved.
          schema:
            $ref: '#/definitions/company'
        '403':
          $ref: '#/responses/403ForbiddenError'
        '404':
