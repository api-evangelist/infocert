        type: string
        example: 01234567892 
      partitaIva:
        type: string
        example: 01234567891
      dataDocumento:
        description: > 
          The date format must be one of the following: yyyy-MM-ddTHH:mm:ssZ; yyyy-MM-ddTHH:mm:ss; dd-MM-yyyy; dd/MM/yyyy
        type: string
        example: 03/01/2019
      annoFiscale:
