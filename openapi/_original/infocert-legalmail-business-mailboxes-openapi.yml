  /{mailboxId}/send:
    post:
      deprecated: true
      tags:
        - "Message Sending"
        - REM-ready
      summary: "sendMessage"
      description: |
        *WARNING:* This operation is deprecated. Please, refer to "createSubmission" instead.
        
        Send a message from a JSON representation.
        
        ### Type of consignment receipt
        The type of consignment receipt is controlled via the `contentConsignment` attribute.
        - With `NoOriginalMessage` the consignment receipt(s) will not contain the sent message. This is equivalent
          to the PEC's `x-TipoRicevuta: sintetica`.
        - With `ReturnOriginalMessage` the consignment receipt(s) will contain the original sent
          message. Please consider that this option replicates the original sent message in
          every consignment receipt, one for each recipient. This is the equivalent to the PEC's
          `x-TipoRicevuta: completa`.
        - The third option is to use `NoOriginalMessage` and add yourself (the sender address) to the recipients in
          carbon copy. This option saves space and provides a (single) copy of the sent message.
        
        ### Concurrent send requests
        There is no need to wait for the completion of a send request, before initiating the next one: multiple send 
        requests can be initiated concurrently, even when sending from the same mailbox. In case you exceed the 
        maximum send throughput for your mailbox, a 429 response will be returned.
        
        ### Mailbox rate limiting when sending messages
        
        When sending messages, a mailbox specific rate limit applies, in addition to the API rate limit mentioned in the
        introduction. Every mailbox comes with its peculiar _send_ rate limit. When hitting such send rate limit, the
        response 429 `TooMuchTrafficFromThisSenderException` will be returned.
        
        
        ### Saving a copy of the sent message
        To save a copy of the sent message, you can add yourself (the sender address) to carbon copy (cc) recipients.
        
        ### Message size limit
        The maximum allowed size for a MIME message (message, headers and attachments) is limited to 100MB.
        When sending a message with attachments, keep in mind that a file encoded in Base64 is approximately 35% bigger
        than its original size. As an example, an email with an 80MB attachment will result in a MIME message of about
        108MB and the message will be rejected.  
        When this limit is reached, a 422 response will be returned and the request will be rejected.
        If the limit is greatly exceeded, the message won't be processed by the system (HTTP 413).
        
        ### Recover from HTTP timeout 
        In case of timeout, you can verify if your request was actually accepted by the presence of the corresponding 
        acceptance receipt in the inbox. 
        Please, consider that this could take up to 24 hours.

      operationId: "sendMessage"
      parameters:
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/correlationId'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/MessageToSend'
      responses:
        '200':
          description: "Send request acknowledged"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentMessage'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '402':
          $ref: '#/components/responses/CreditsExhaustedForThisSenderException'
        '422':
          description: 'Unprocessable entity'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                InvalidRecipientAddressException:
                  $ref: '#/components/examples/InvalidRecipientAddressException'
                InvalidSenderAddressException:
                  $ref: '#/components/examples/InvalidSenderAddressException'
                SenderNotAllowedForThisMailboxException:
                  $ref: '#/components/examples/SenderNotAllowedForThisMailboxException'
                EmptyHtmlAndTextBodyException:
                  $ref: '#/components/examples/EmptyHtmlAndTextBodyException'
                MultilineSubjectException:
                  $ref: '#/components/examples/MultilineSubjectException'
                MissingUAMessageIdentifierException:
                  $ref: '#/components/examples/MissingUAMessageIdentifierException'
                AmbiguousUAMessageIdentifierException:
                  $ref: '#/components/examples/AmbiguousUAMessageIdentifierException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/submissions:
    get:
      tags:
        - Riconciliazione
        - "Message Sending"
        - REM-ready
      summary: searchSubmissions
      description: |
        Search for email submission(s).
        
        Access to this endpoint requires the "busapiv2-mailboxes:riconciliazione" token scope.

        ### 24-hour window
        
        Please, consider that, for a submission to be listed, the first event (accepted/not-accepted)
        needs to happen. While this usually takes only a couple of minutes, it can take up to 24 hours,
        as defined by the PEC/REM protocol.
        
        ### 7-day retention
        
        Data on submissions older than 7 days are deleted. Please, keep a copy of relevant data, in case you
        need longer retention.

      operationId: searchSubmissions
      security:
        - busapiv2_mailboxes_oauth2:
            - 'busapiv2-mailboxes:riconciliazione'
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: senderAddress
          required: true
          schema:
            type: string
            format: email
            minLength: 1
            maxLength: 255
            example: "certified.sender@legalmail.it"
          in: query
          x-extra-annotation: '@jakarta.validation.constraints.Email'
        - name: UAMessageIdentifier
          description: |
            The User Application (UA) message identifier, as defined when the message to send was submitted.
          required: false
          schema:
            $ref: '#/components/schemas/UAMessageIdentifier'
          in: query
      responses:
        200:
          description: The (paged) list of submissionId that match the search criteria.
          headers:
            X-Correlation-ID:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSubmissionIdResult'
        '422':
          description: The sender address doesn't belong to the selected mailbox.
          content:
            'application/problem+json':
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ForbiddenSenderException:
                  $ref: '#/components/examples/ForbiddenSenderException'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - "Message Sending"
        - REM-ready
      summary: "createSubmission, send a new registered message"
      description: |
        Submit a new registered message to send.
        
        To certify the acceptance of your submission by the PEC/REM infrastructure and its consignment to every 
        recipient, please find the corresponding acceptance and consignment receipts in your inbox. Please, keep in mind
        that such receipts could take up to 24 hours to be delivered to your inbox, as defined by the PEC/REM protocol.
        
        ### SendMessage operation
        
        This operation is semantically equivalent to the now deprecated sendMessage, yet is uses a more clear and coherent naming. With
        respect to sendMessage, the createSubmission operation takes exactly the same input and has minor changes to the
        output response body.
        
        
        ### Type of consignment receipt
        The type of consignment receipt is controlled via the `contentConsignment` attribute.
        - With `NoOriginalMessage` the consignment receipt(s) will not contain the sent message. This is equivalent
          to the PEC's `x-TipoRicevuta: sintetica`.
        - With `ReturnOriginalMessage` the consignment receipt(s) will contain the original sent
          message as the message/rfc822 attachment named "original-message.eml". Please consider that this option 
          replicates the original sent message in every consignment receipt, one for each recipient. This is the 
          equivalent to the PEC's `x-TipoRicevuta: completa`.
        - The third option is to use `NoOriginalMessage` and add yourself (the sender address) to the recipients in
          carbon copy. This option saves space and provides a (single) copy of the sent message.
        
        ### Concurrent create submissions requests
        There is no need to wait for the completion of a create submission request, before initiating the next one: multiple 
        requests can be initiated concurrently, even when sending from the same mailbox.
        
        ### Mailbox rate limiting when sending messages
        
        When sending messages, a mailbox specific rate limit applies, in addition to the API rate limit mentioned in the
        introduction. Every mailbox comes with its peculiar _send_ rate limit. When hitting such send rate limit, the
        response 429 `TooMuchTrafficFromThisSenderException` will be returned.
        
        ### Saving a copy of the sent message
        To save a copy of the sent message, you can set the provideMimeRepresentation query parameter to true.
        A URL will be provided in the mimeRepresentationUrl field of the response, that can be used to retrieve the 
        MIME representation of the message sent.
        The MIME message can now be uploaded, using the [addMessageMIME](#/Organise%20Messages/addMessageMIME) method, in a folder of your choice.
        
        These URLs are very short lived, so download the MIME message promptly if you need it. 
        
        ### Message size limit
        The maximum allowed size for a MIME message (message, headers and attachments) is limited to 100MB.
        When sending a message with attachments, keep in mind that a file encoded in Base64 is approximately 35% bigger
        than its original size. As an example, an email with an 80MB attachment will result in a MIME message of about
        108MB and the message will be rejected.  
        When this limit is reached, a 422 response will be returned and the request will be rejected.
        If the limit is greatly exceeded, the message won't be processed by the system (HTTP 413).
        
        ### Recover from HTTP timeout 
        In case of timeout, you can verify if your submission has actually been accepted by the presence of the corresponding 
        acceptance receipt in the inbox. 
        Please, consider that this could take up to 24 hours.

      operationId: "createSubmission"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/provideMimeRepresentation'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/Submission'
      responses:
        '200':
          description: |
            Submission created.
            
            This does not confirm that your message has been sent.
            
            To certify the acceptance of your submission by the PEC/REM infrastructure and its consignment to 
            every recipient, please find the corresponding  acceptance and consignment receipts in your inbox. Please, 
            keep in mind that such receipts could take up to 24 hours to be delivered to your inbox, as defined by the 
            PEC/REM protocol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionAcknowledgement'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '402':
          $ref: '#/components/responses/CreditsExhaustedForThisSenderException'
        '422':
          description: "Unprocessable entity"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                InvalidRecipientAddressException:
                  $ref: '#/components/examples/InvalidRecipientAddressException'
                InvalidSenderAddressException:
                  $ref: '#/components/examples/InvalidSenderAddressException'
                SenderNotAllowedForThisMailboxException:
                  $ref: '#/components/examples/SenderNotAllowedForThisMailboxException'
                EmptyHtmlAndTextBodyException:
                  $ref: '#/components/examples/EmptyHtmlAndTextBodyException'
                MultilineSubjectException:
                  $ref: '#/components/examples/MultilineSubjectException'
                MissingUAMessageIdentifierException:
                  $ref: '#/components/examples/MissingUAMessageIdentifierException'
                AmbiguousUAMessageIdentifierException:
                  $ref: '#/components/examples/AmbiguousUAMessageIdentifierException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        '521':
          $ref: '#/components/responses/CannotProvideMimeRepresentation'
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/submissions/{submissionId}/status:
    get:
      tags:
        - REM-ready
        - "Message Sending"
        - Riconciliazione
      operationId: getSubmissionStatus
      security:
        - busapiv2_mailboxes_oauth2:
            - 'busapiv2-mailboxes:riconciliazione'
      summary: getSubmissionStatus, know the acceptance and consignment of a given submission
      description: |
        Get the reconciliation status (accepted/consigned) of the submission.
        
        By using the searchReceiptsIn parameter, one can directly search for the receipts in a specific folder. Receipts 
        are usually delivered to INBOX. For faster response, searching can be disabled by setting the searchReceiptsIn 
        to empty or blank value.
        
        Receipts can also be searched by using the messageIdentifierEquals parameter of listMessages.
        
        Access to this endpoint requires the "busapiv2-mailboxes:riconciliazione" token scope.
        
        
        ### 7-day retention
        
        Data on submissions older than 7 days are deleted. Please, keep a copy of relevant data, in case you
        need longer retention.

      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
        - name: submissionId
          required: true
          schema:
            $ref: '#/components/schemas/SubmissionId'
          example: "<1767717417.88695.1675094838099.JavaMail.jboss@ip1pvliaslmw013>"
          in: path
        - name: searchReceiptsIn
          description: |
            The folderId in which to search for receipts. The results are shown in receiptPositions.
            
            Empty or blank value disables the search, for faster response.
            
            In case the folderId does not exist, receiptPositions will be empty.
          required: false
          schema:
            type: string
            maxLength: 255
            default: ""
            example: "INBOX"
          in: query
      responses:
        '200':
          description: The status of the submission.
          headers:
            X-Correlation-ID:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatus'
        '404':
          description: "Resource not found"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
        '422':
          description: The sender of this submission doesn't belong to the selected mailbox.
          content:
            'application/problem+json':
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                ForbiddenSenderException:
                  $ref: '#/components/examples/ForbiddenSenderException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/send/mime:
    post:
      deprecated: true
      tags:
        - "Message Sending"
        - MIME
      summary: "sendMessageMIME"
      description: |
        Send a message from MIME content.
        
        ### Concurrent send requests
        There is no need to wait for the completion of a send request, before initiating the next one: multiple send 
        requests can be initiated concurrently, even when sending from the same mailbox. In case you exceed the 
        maximum send throughput for your mailbox, a 429 response will be returned.
        
        ### Saving a copy of the sent message
        To save a copy of the sent message, you can add yourself (the sender address) to carbon copy (cc) recipients.
        
        ### Message size limit
        The maximum allowed size for a MIME message (message, headers and attachments) is limited to 100MB.
        When sending a message with attachments, keep in mind that a file encoded in Base64 is approximately 35% bigger
        than its original size. As an example, an email with an 80MB attachment will result in a MIME message of about
        108MB and the message will be rejected.  
        When this limit is reached, a 422 response will be returned and the request will be rejected.
        If the limit is greatly exceeded, the message won't be processed by the system (HTTP 413).
        
        ### Recover from HTTP timeout 
        In case of timeout, you can verify if your request was actually accepted by the presence of the corresponding 
        acceptance receipt in the inbox. 
        Please, consider that this could take up to 24 hours.
      operationId: "sendMessageMIME"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
      requestBody:
        required: true
        content:
          'message/rfc822':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: "Send request acknowledged"
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/SentMessage'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '402':
          $ref: '#/components/responses/CreditsExhaustedForThisSenderException'
        '422':
          description: 'Unprocessable entity'
          content:
            'application/problem+json':
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                EmptyAddressException:
                  $ref: '#/components/examples/EmptyAddressException'
                InvalidRecipientAddressException:
                  $ref: '#/components/examples/InvalidRecipientAddressException'
                InvalidSenderAddressException:
                  $ref: '#/components/examples/InvalidSenderAddressException'
                SenderNotAllowedForThisMailboxException:
                  $ref: '#/components/examples/SenderNotAllowedForThisMailboxException'
                EmptyMessageIdentifierException:
                  $ref: '#/components/examples/EmptyMessageIdentifierException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    busapiv2_mailboxes_oauth2:
      type: oauth2
      description: This API uses OAuth 2 with the [Client Credentials Flow](https://auth0.com/docs/get-started/authentication-and-authorization-flow/client-credentials-flow).
      flows:
        clientCredentials:
          tokenUrl: /api/v2/token
          scopes:
            'busapiv2-mailboxes:org-msg': "Operations to organise messages"
            'busapiv2-mailboxes:riconciliazione': "Operations to retrieve the status of submissions"
  schemas:
    # Copied from https://opensource.zalando.com/restful-api-guidelines/models/problem-1.0.1.yaml
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          description: >
            A URI reference that uniquely identifies the problem type only in the
            context of the provided API.
          default: 'about:blank'
          example: '/error/InternalServerError'
        title:
          type: string
          description: >
            A short summary of the problem type. Written in English and readable
            for engineers, usually not suited for non technical stakeholders and
            not localized.
          example: 'Internal Server Error'
        status:
          type: integer
          format: int32
          description: >
            The HTTP status code generated by the origin server for this occurrence
            of the problem.
          minimum: 100
          maximum: 600
          exclusiveMaximum: true
          example: 500
        detail:
          type: string
          description: >
            A human readable explanation specific to this occurrence of the
            problem that is helpful to locate the problem and give advice on how
            to proceed. Written in English and readable for engineers, usually not
            suited for non technical stakeholders and not localized.
          example: 'about:blank'
        instance:
          type: string
          format: uri-reference
          description: >
            A URI reference that identifies the specific occurrence of the problem,
            e.g. by adding a fragment identifier or sub-path to the problem type.
            May be used to locate the root of this problem in the source code.
          example: '/api/v2/mailboxes'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      properties:
        field:
          type: string
          example: "sendMessage.messageToSend.from.address"
        message:
          type: string
          example: "must not be blank"
      description: >
        A human readable explanation of the parameters that failed the validation.
        If a parameter fails more than one check (i.e.: must be not empty and must 
        respect a specific format), the parameter is presented twice in two separate 
        violations.
    PagedResult:
      properties:
        size:
          description: "Size of this page; less or equal to page size."
          type: integer
        totalSize:
          description: "Total size of the result set."
          type: integer
        pageSize:
          description: "Page size."
          type: integer
          minimum: 1
          maximum: 1000
        page:
          description: "Page number."
          type: integer
          minimum: 1
      required:
        - size
        - totalSize
        - pageSize
        - page
    Mailbox:
      properties:
        id:
          type: string
          description: "The identifier of the mailbox in this API."
        addresses:
          type: array
          items:
            type: string
            format: email
      required:
        - id
        - addresses
    MailboxQuota:
      properties:
        mailboxId:
          $ref: '#/components/schemas/MailboxId'
        kBUsage:
          type: integer
          format: int64
          minimum: 0
          description: "The usage of the mailbox, in kilobytes."
        kBLimit:
          type: integer
          format: int64
          minimum: 0
          description: "The limite for the mailbox, in kilobytes."
      required:
        - mailboxId
        - kBUsage
        - kBLimit
    Folder:
      properties:
        mailboxId:
          $ref: '#/components/schemas/MailboxId'
        id:
          type: string
          example: INBOX
          description: "The identifier of the folder in this API."
        name:
          type: string
          example: INBOX
        messageUIdValidity:
          $ref: "#/components/schemas/MessageUIdValidity"
        parentId:
          type: string
          example: ""
        childIds:
          type: array
          items:
            type: string
          example: [ "INBOX/Draft", "INBOX/Sent" ]
      required:
        - mailboxId
        - id
        - name
        - messageUIdValidity
        - parentId
        - childIds
    NewFolder:
      properties:
        name:
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
          type: string
          minLength: 1
          maxLength: 63
          example: INBOX
        parentId:
          minLength: 0
          maxLength: 254
          type: string
          example: ""
      required:
        - name
        - parentId
    FolderListItem:
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'
        name:
          type: string
          example: INBOX
        messageUIdValidity:
          $ref: "#/components/schemas/MessageUIdValidity"
        parentId:
          type: string
          example: ""
      required:
        - id
        - name
        - messageUIdValidity
        - parentId
    Address:
      properties:
        address:
          $ref: '#/components/schemas/EmailAddress'
        displayName:
          type: string
          maxLength: 160
          nullable: true
          example: "Mario Rossi"
      required:
        - address
    EmailAddress:
      x-extra-annotation: "@jakarta.validation.constraints.Email @jakarta.validation.constraints.NotBlank"
      type: string
      minLength: 1
      maxLength: 160
      format: email
      example: "mario.rossi@infocert.it"
    Attachment:
      x-class-extra-annotation: '@com.fasterxml.jackson.databind.annotation.JsonSerialize(using = it.infocert.legalmail.api.json.AttachmentSerializer.class) @com.fasterxml.jackson.databind.annotation.JsonDeserialize(using = it.infocert.legalmail.api.json.AttachmentDeserializer.class)'
      properties:
        filename:
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
          type: string
          description: "The filename of the attachment."
          example: "contract.pdf"
        size:
          type: integer
          minimum: 0
          format: int64
          description: "The size of the Base64 encoding of the attachment, in bytes."
        contentType:
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
          type: string
          format: content-type
          example: "application/pdf"
        contentTransferEncoding:
          type: string
          enum: [ base64, Binary ]
        contentId:
          type: string
          description: "The id of the attachment for further reference."
        data:
          type: string
          format: byte
          description: "The content of the attachment."
      required:
        - size
        - contentType
        - contentTransferEncoding
        - contentId
        - data
    MessageListItem:
      properties:
        messageUId:
          type: integer
          format: int64
        itemType:
          type: string
          enum: [ ERDSReceipt, ERDSDispatch, OtherMessage ]
        messageIdentifier:
          $ref: '#/components/schemas/MessageIdentifier'
        UAMessageIdentifier:
          $ref: '#/components/schemas/UAMessageIdentifier'
        ERDSEventId:
          $ref: '#/components/schemas/ERDSEventId'
        ERDSType:
          $ref: '#/components/schemas/ERDSType'
        approximateByteSize:
          type: integer
          minimum: 0
        seen:
          type: boolean
        receivedOn:
          $ref: '#/components/schemas/ISO8601Date'
      required:
        - messageUId
        - itemType
        - messageIdentifier
        - UAMessageIdentifier
        - ERDSEventId
        - approximateByteSize
        - seen
    MessageListItemMIME:
      properties:
        messageUId:
          type: integer
          format: int64
        messageIdentifier:
          $ref: '#/components/schemas/MessageIdentifier'
        subject:
          type: string
        from:
          type: string
          format: email
        xRiferimentoMessageId:
          type: string
          format: message-id
          example: "<1767717417.88695.1675094838099.JavaMail.jboss@ip1pvliaslmw013>"
          nullable: true
          description: "Applies to PEC items only."
        xRicevuta:
          type: string
          example: "accettazione"
          nullable: true
          description: "Applies to PEC receipts only."
        xTipoRicevuta:
          type: string
          format: message-id
          example: "sintetica"
          nullable: true
          description: "Applies to PEC consigned messages only."
        xTrasporto:
          type: string
          format: message-id
          example: "posta-certificata"
          nullable: true
          description: "Applies to PEC consigned messages only."
        approximateByteSize:
          type: integer
          minimum: 0
        seen:
          type: boolean
        receivedOn:
          $ref: '#/components/schemas/ISO8601Date'
      required:
        - messageUId
        - itemType
        - messageIdentifier
        - UAMessageIdentifier
        - ERDSEventId
        - approximateByteSize
        - seen
    ERDSType:
      type: string
      enum:
        - PEC
        - REM
    PECTipoRicevutaConsegna:
      type: string
      enum: [ sintetica, completa, breve ]
      description: "Applies to PEC's 'ricevuta di consegna' only. This field is not REM-ready."
      nullable: true
    PECErroreEsteso:
      type: string
      description: "Applies to PEC's receipts only, in case of acceptance rejection or consignment error. This field is not REM-ready."
      nullable: true
      example: "5.4.1 - InfoCert S.p.A. - il messaggio non e' stato consegnato nelle ventiquattro ore successive al suo invio. Si ritiene che la spedizione debba considerarsi non andata a buon fine"
    ERDSEventId:
      type: string
      enum:
        - "http://uri.etsi.org/19522/Event/SubmissionAcceptance"
        - "http://uri.etsi.org/19522/Event/SubmissionRejection"
        - "http://uri.etsi.org/19522/Event/RelayFailure"
        - "http://uri.etsi.org/19522/Event/ContentConsignment"
        - "http://uri.etsi.org/19522/Event/ContentConsignmentFailure"
        - "http://uri.etsi.org/19522/Event/RelayToNonERDS"
        - "http://uri.etsi.org/19522/Event/RelayToNonERDSFailure"
        - "http://uri.etsi.org/19522/Event/ReceivedFromNonERDS"
        # - "http://uri.etsi.org/19522/Event/RelayAcceptance" should never be found in the mailbox
      x-enum-varnames:
        - SUBMISSION_ACCEPTANCE
        - SUBMISSION_REJECTION
        - RELAY_FAILURE
        - CONTENT_CONSIGNMENT
        - CONTENT_CONSIGNMENT_FAILURE
        - RELAY_TO_NON_ERDS
        - RELAY_TO_NON_ERDS_FAILURE
        - RECEIVED_FROM_NON_ERDS
    MessageIdentifier:
      type: string
      minLength: 1
      maxLength: 320
      format: message-id
      description: The value of the Message-ID header.
      example: "<3F916854.00F1DBDB.03702AE8.1F0AD183.posta-certificata@legalmail.it>"
    DispatchMessageIdentifier:
      deprecated: true
      type: string
      format: message-id
      description: >
        For receipts, this is the value of the Message-ID header of the dispatch, 
        as given by the REM's infrastructure. This is equivalent to submissionId.
      example: "<3F916854.00F1DBDA.03702AE4.1F0AD183.posta-certificata@legalmail.it>"
    UAMessageIdentifier:
      type: string
      minLength: 1
      maxLength: 320
      format: message-id
      description: >
        For receipts and dispatches, this is the value of the Message-ID header of the
        sent message, as defined by the user application
      example: "<1767717417.88695.1675094838099.JavaMail.jboss@ip1pvliaslmw013>"
    EvidenceRefersToRecipient:
      type: string
      format: email
      description: "For consignment receipts, this is the recipient to which the receipt refers."
      example: "certified.recipient@legalmail.it"
    Body:
      type: object
      properties:
        text:
          type: string
          nullable: true
          description: "The body's plain text content."
        html:
          type: string
          nullable: true
          description: "The body's html content."
    REMReadyMessageRepresentation:
      type: object
      properties:
        mailboxId:
          $ref: '#/components/schemas/MailboxId'
        folderId:
          $ref: '#/components/schemas/FolderId'
        messageUIdValidity:
          $ref: "#/components/schemas/MessageUIdValidity"
        uId:
          type: integer
          format: int64
          description: "The unique identifier of the message in this API"
        seen:
          type: boolean
        item:
          oneOf:
            - $ref: '#/components/schemas/ERDSReceipt'
            - $ref: '#/components/schemas/ERDSDispatch'
            - $ref: '#/components/schemas/OtherMessage'
          discriminator:
            propertyName: itemType
      required:
        - mailboxId
        - folderId
        - messageUIdValidity
        - uId
        - seen
        - item
    ERDSMessageType:
      enum:
        - 'http://uri.etsi.org/19522/v1#/ERDMessageType/dispatch'
        - 'http://uri.etsi.org/19522/v1#/ERDMessageType/receipt'
      x-enum-varnames:
        - DISPATCH
        - RECEIPT
    REMReadyItem:
      properties:
        itemType:
          type: string
          example: ERDSDispatch
        hasAttachments:
          type: boolean
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        classifAI:
          oneOf:
            - $ref: '#/components/schemas/ClassifAISuccess'
            - $ref: '#/components/schemas/ClassifAIError'
      required:
        - itemType
        - hasAttachments
        - attachments
    ClassifAISuccess:
      properties:
        crn:
          type: string
          example: smd::titolario_v1::12332-3a2d2-12332-3a2d2-12332
        result:
          type: string
          example: titolo1::classe::sottoclasse
        timestamp:
          $ref: '#/components/schemas/ISO8601Date'
      required:
        - crn
        - result
        - timestamp
    ClassifAIError:
      properties:
        crn:
          type: string
          example: smd::titolario_v1::12332-3a2d2-12332-3a2d2-12332
        error:
          type: string
          example: ModelUnavailable
      required:
        - error
    ERDSDispatch:
      allOf:
        - $ref: '#/components/schemas/REMReadyItem'
        - type: object
          properties:
            ERDSMessageType:
              $ref: "#/components/schemas/ERDSMessageType"
            ERDSEventId:
              $ref: '#/components/schemas/ERDSEventId'
            ERDSType:
              $ref: '#/components/schemas/ERDSType'
            from:
              $ref: '#/components/schemas/Address'
            to:
              type: array
              items:
                $ref: '#/components/schemas/Address'
            cc:
              type: array
              items:
                $ref: '#/components/schemas/Address'
            messageIdentifier:
              type: string
              minLength: 1
              maxLength: 320
              format: message-id
              description: The value of the Message-ID header. This is also the identifier of the submission given by the PEC/REM infrastructure, the submissionId.
              example: "<3F916854.00F1DBDB.03702AE8.1F0AD183.posta-certificata@legalmail.it>"
            inReplyTo:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 320
                format: message-id
                example: "<3F916854.00F1DBDB.03702AE8.1F0AD183.posta-certificata@legalmail.it>"
              description: The value of the In-Reply-To header.
            references:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 320
                format: message-id
                example: "<3F916854.00F1DBDB.03702AE8.1F0AD183.posta-certificata@legalmail.it>"
              description: The value of the References header.
            submissionId:
              type: string
              minLength: 1
              maxLength: 320
              format: message-id
              description: >
                The identifier given by the PEC/REM infrastructure to the submission; this is the same as messageIdentifier.
              example: "<3F916854.00F1DBDA.03702AE4.1F0AD183.posta-certificata@legalmail.it>"
            UAMessageIdentifier:
              $ref: '#/components/schemas/UAMessageIdentifier'
            date:
              $ref: '#/components/schemas/ISO8601Date'
            subject:
              type: string
              description: "WARNING: parsing the value of this field is not REM-Ready."
            body:
              $ref: '#/components/schemas/Body'
          required:
            - ERDSMessageType
            - ERDSEventId
            - ERDSType
            - from
            - to
            - cc
            - messageIdentifier
            - submissionId
            - UAMessageIdentifier
            - date
            - subject
            - body
    ERDSReceipt:
      allOf:
        - $ref: '#/components/schemas/REMReadyItem'
        - type: object
          properties:
            ERDSMessageType:
              $ref: "#/components/schemas/ERDSMessageType"
            ERDSEventId:
              $ref: '#/components/schemas/ERDSEventId'
            ERDSType:
              $ref: '#/components/schemas/ERDSType'
            PECTipoRicevutaConsegna:
              $ref: '#/components/schemas/PECTipoRicevutaConsegna'
            PECErroreEsteso:
              $ref: '#/components/schemas/PECErroreEsteso'
            from:
              $ref: '#/components/schemas/Address'
            to:
              type: array
              items:
                $ref: '#/components/schemas/Address'
            messageIdentifier:
              $ref: '#/components/schemas/MessageIdentifier'
            dispatchMessageIdentifier:
              $ref: '#/components/schemas/DispatchMessageIdentifier'
            submissionId:
              type: string
              minLength: 1
              maxLength: 320
              format: message-id
              description: >
                The identifier given by the PEC/REM infrastructure to the submission.
              example: "<3F916854.00F1DBDA.03702AE4.1F0AD183.posta-certificata@legalmail.it>"
            UAMessageIdentifier:
              $ref: '#/components/schemas/UAMessageIdentifier'
            evidenceRefersToRecipient:
              $ref: '#/components/schemas/EvidenceRefersToRecipient'
            date:
              $ref: '#/components/schemas/ISO8601Date'
            subject:
              type: string
              description: >
                The subject of the original sent message, as defined by the user application.
          required:
            - ERDSMessageType
            - ERDSEventId
            - ERDSType
            - PECTipoRicevutaConsegna
            - PECErroreEsteso
            - from
            - to
            - messageIdentifier
            - dispatchMessageIdentifier
            - submissionId
            - UAMessageIdentifier
            - evidenceRefersToRecipient
            - date
            - subject
    OtherMessage:
      allOf:
        - $ref: '#/components/schemas/REMReadyItem'
        - type: object
          properties:
            from:
              $ref: '#/components/schemas/Address'
            to:
              type: array
              items:
                $ref: '#/components/schemas/Address'
            cc:
              type: array
              items:
                $ref: '#/components/schemas/Address'
            messageIdentifier:
              $ref: '#/components/schemas/MessageIdentifier'
            date:
              $ref: '#/components/schemas/ISO8601Date'
            subject:
              type: string
            body:
              $ref: '#/components/schemas/Body'
          required:
            - from
            - to
            - cc
            - messageIdentifier
            - date
            - subject
            - body
    Submission:
      properties:
        from:
          $ref: '#/components/schemas/Address'
        to:
          x-extra-annotation: "@it.infocert.legalmail.api.json.EachNotNull"
          title: "Recipient(s) of the message"
          type: array
          items:
            $ref: '#/components/schemas/Address'
          minItems: 1
          maxItems: 1000
        cc:
          x-extra-annotation: "@it.infocert.legalmail.api.json.EachNotNull"
          title: "Recipient(s) of the message in carbon copy"
          type: array
          items:
            $ref: '#/components/schemas/Address'
        subject:
          title: "The subject line of the message"
          description: "Cannot be multiline."
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
          type: string
          maxLength: 3500
        body:
          $ref: '#/components/schemas/Body'
        UAMessageIdentifier:
          nullable: true
          type: string
          minLength: 1
          maxLength: 320
          format: message-id
          description: >
            The identifier of the message (User Application Message Identifier)
            
            Use this identifier to match the message to send with its acceptance and consignment receipts.
            
            This value SHOULD be unique in the user application's realm, as it is the main method for
            messages' reconciliation; the caller is in charge of its uniqueness.
        messageIdentifier:
          deprecated: true
          nullable: true
          x-extra-annotation: "@Deprecated"
          x-setter-extra-annotation: "@Deprecated"
          type: string
          minLength: 1
          maxLength: 320
          format: message-id
          description: >
            The identifier of the message, also known as UAMessageIdentifier (User Application Message Identifier)
            
            Use this identifier to match the message to send with its acceptance and consignment receipts.
            
            This value SHOULD be unique in the user application's realm, as it is the main method for
            messages' reconciliation; the caller is in charge of its uniqueness.
        contentConsignment:
          type: string
          description: >
            Sets the behaviour of the content consignment receipt.
            
            - NoOriginalMessage: the consignment receipt(s) will not contain the sent message.
            - ReturnOriginalMessage: the consignment receipt(s) will contain the original sent message. The original
              sent message will be provided as the message/rfc822 attachment "original-message.eml".
          enum:
            - "NoOriginalMessage"
            - "ReturnOriginalMessage"
        attachments:
          x-extra-annotation: "@it.infocert.legalmail.api.json.EachNotNull"
          type: array
          items:
            $ref: '#/components/schemas/AttachmentToSend'
        inReplyTo:
          x-extra-annotation: "@it.infocert.legalmail.api.json.EachNotNull"
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 320
            format: message-id
          description: The value of the In-Reply-To header.
          nullable: true
        references:
          x-extra-annotation: "@it.infocert.legalmail.api.json.EachNotNull"
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 320
            format: message-id
          description: The value of the References header.
          nullable: true
      required:
        - from
        - to
        - cc
        - subject
        - body
        - contentConsignment
        - attachments
    MessageToSend:
      allOf:
        - $ref: '#/components/schemas/Submission'
    AttachmentToSend:
      properties:
        filename:
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
          type: string
          minLength: 1
          maxLength: 255
          description: "The filename of the attachment."
          example: "contract.pdf"
        contentType:
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank @it.infocert.legalmail.api.json.ContentType"
          type: string
          minLength: 1
          maxLength: 255
          format: contenttype
          example: "application/pdf"
        contentTransferEncoding:
          type: string
          enum: [ base64 ]
        contentId:
          type: string
          description: "Optional ID for the attachment. If non-empty, it will be set in `Content-ID` part header."
        data:
          x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
          type: string
          format: base64
          description: "The actual content of the file"
      required:
        - filename
        - contentType
        - contentTransferEncoding
        - data
    SentMessage:
      type: object
      properties:
        messageIdentifier:
          $ref: '#/components/schemas/MessageIdentifier'
        warnings:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              description:
                type: string
            required:
              - code
              - description
      required:
        - messageIdentifier
        - warnings
    SubmissionAcknowledgement:
      type: object
      properties:
        UAMessageIdentifier:
          $ref: '#/components/schemas/UAMessageIdentifier'
        mailboxId:
          $ref: '#/components/schemas/MailboxId'
        sender:
          $ref: '#/components/schemas/EmailAddress'
        mimeRepresentationUrl:
          type: string
          format: uri
          nullable: true
          description: "The URL at which the MIME content of the sent message can be retrieved, if the parameter provideMimeMessage was set to true."
      required:
        - UAMessageIdentifier
        - mailboxId
        - sender
        - mimeRepresentationUrl
    ISO8601Date:
      type: string
      format: date-time
      example: "2022-12-16T12:49:49+01:00"
      description: "ISO 8601 full-time format."
    MailboxId:
      type: string
      minLength: 1
      example: "U45897"
    FolderId:
      type: string
      x-extra-annotation: "@jakarta.validation.constraints.NotBlank"
      maxLength: 254
      example: "INBOX"
    MessageUIdValidity:
      type: integer
      format: int64
      minimum: 0
      example: 35488987
    PagedMailboxResult:
      allOf:
        - $ref: '#/components/schemas/PagedResult'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Mailbox'
          required:
            - items
    PagedSubmissionIdResult:
      allOf:
        - $ref: '#/components/schemas/PagedResult'
        - type: object
          properties:
            items:
              type: array
              uniqueItems: true
              items:
                $ref: '#/components/schemas/SubmissionId'
          required:
            - items
    SubmissionId:
      format: message-id
      description: The unique identifier given to the submission by the PEC infrastructure of Infocert.
      maxLength: 450
      minLength: 1
      type: string
      example: <3F916854.00F1DBDB.03702AE8.1F0AD183.posta-certificata@legalmail.it>
      nullable: false
    SubmissionStatus:
      type: object
      properties:
        submissionId:
          $ref: '#/components/schemas/SubmissionId'
        UAMessageIdentifier:
          $ref: '#/components/schemas/UAMessageIdentifier'
        sender:
          type: string
          format: email
          maxLength: 255
          minLength: 1
          example: "certified.sender@legalmail.it"
        acceptance:
          $ref: '#/components/schemas/AcceptanceStatus'
        consignments:
          type: array
          uniqueItems: true
          nullable: false
          description: "One consignment status for each registered or ordinary recipient"
          items:
            $ref: '#/components/schemas/ConsignmentStatus'
      required:
        - submissionId
        - UAMessageIdentifier
        - sender
        - acceptance
        - consignments
    AcceptanceStatus:
      type: object
      properties:
        status:
          description: |
            - ACCEPTED: the message has been accepted; please refer the consignments for details
            - NOT_ACCEPTED: the message has not been accepted; please send it again; this could happen, for example, if the submission contains a virus
          type: string
          enum: [ ACCEPTED, NOT_ACCEPTED ]
        eventReasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AcceptanceEventReason'
        receiptMessageIdentifier:
          $ref: '#/components/schemas/MessageIdentifier'
        recordedAt:
          $ref: '#/components/schemas/ISO8601Date'
        receiptPositions:
          type: array
          minItems: 0
          description: |
            The position(s) of the acceptance receipt in this mailbox.
            
            It is empty, if no acceptance receipt is available, or it was not found in the given folder.
            
            If not empty, it usually has one item, when the acceptance receipt is available and it was found in the
            given folder.
            
            Very rarely, it could have more than one item. In such case every item is relevant for acceptance.
          items:
            $ref: '#/components/schemas/MessagePosition'
      required:
        - UAMessageIdentifier
        - status
        - sender
        - receiptPositions
    AcceptanceEventReason:
      type: object
      properties:
        eventReasonCode:
          $ref: '#/components/schemas/AcceptanceEventReasonCode'
        detail:
          type: string
          nullable: true
          maxLength: 2000
      required:
        - eventReasonCode
    AcceptanceEventReasonCode:
      type: string
      enum:
        - "http://uri.etsi.org/19522/EventReason/MessageAccepted"
        - "http://uri.etsi.org/19522/EventReason/InvalidMessageFormat"
        - "http://uri.etsi.org/19522/EventReason/MalwareFound"
        - "http://uri.etsi.org/19522/EventReason/S_ERDS_PolicyViolation"
        - "unknown"
    ConsignmentStatus:
      type: object
      properties:
        recipient:
          type: string
          format: email
          example: "certified.recipient@legalmail.it"
        status:
          description: |
            - CONSIGNED: the submission has reached the recipient mailbox
            - PENDING: the submission has been sent to the destination, but it has not been consigned yet
            - CONSIGNMENT_ERROR: the submission was not consigned to this recipient; please send it again; this could happen, for example, if the recipient mailbox is full, or the recipient address does not exist
            - NOT_ACCEPTED: the message was not accepted, and therefore not consigned neither; please send it again
            - ORDINARY_RECIPIENT: the recipient is ordinary, i.e. not a PEC/REM address: no consignment information is available for such recipients
          type: string
          enum: [ CONSIGNED, PENDING, CONSIGNMENT_ERROR, NOT_ACCEPTED, ORDINARY_RECIPIENT ]
        eventReasons:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConsignmentEventReason'
        receiptMessageIdentifier:
          $ref: '#/components/schemas/MessageIdentifier'
        recordedAt:
          $ref: '#/components/schemas/ISO8601Date'
        receiptPositions:
          type: array
          minItems: 0
          description: |
            The position(s) of the consignment receipt in this mailbox.
            
            It is empty, if no consignment receipt is available for this recipient, or it was not found in the given
            folder.
            
            If not empty, it usually has one item, when the consignment receipt for this recipient is available and it 
            was found in the given folder.
            
            Very rarely, it could have more than one item. In such case every item is relevant for consignment.
          items:
            $ref: '#/components/schemas/MessagePosition'
      required:
        - recipient
        - status
        - receiptPositions
    ConsignmentEventReason:
      type: object
      properties:
        eventReasonCode:
          $ref: '#/components/schemas/ConsignmentEventReasonCode'
        detail:
          type: string
          nullable: true
          maxLength: 2000
      required:
        - eventReasonCode
    ConsignmentEventReasonCode:
      type: string
      enum:
        - "http://uri.etsi.org/19522/EventReason/MessageConsignedToRecipient"
        - "http://uri.etsi.org/19522/EventReason/S_ERDSP_ReceivedNoDeliveryInfoFromR_ERDSP"
        - "http://uri.etsi.org/19522/EventReason/MessageNotConsignedForQuota"
        - "http://uri.etsi.org/19522/EventReason/MessageNotConsignedForMalfunction"
        - "http://uri.etsi.org/19522/EventReason/MessageNotConsignedForUnallowedType"
        - "http://uri.etsi.org/19522/EventReason/MessageNotConsignedForUnregisteredRecipient"
        - "unknown"
    PagedFolderResult:
      allOf:
        - $ref: '#/components/schemas/PagedResult'
        - type: object
          properties:
            mailboxId:
              $ref: '#/components/schemas/MailboxId'
            items:
              type: array
              items:
                $ref: '#/components/schemas/FolderListItem'
          required:
            - items
    PagedMessageResult:
      allOf:
        - $ref: '#/components/schemas/PagedResult'
        - type: object
          properties:
            mailboxId:
              $ref: '#/components/schemas/MailboxId'
            folderId:
              $ref: '#/components/schemas/FolderId'
            messageUIdValidity:
              $ref: "#/components/schemas/MessageUIdValidity"
            items:
              type: array
              items:
                $ref: '#/components/schemas/MessageListItem'
          required:
            - mailboxId
            - folderId
            - messageUIdValidity
            - items
    PagedMessageResultMIME:
      allOf:
        - $ref: '#/components/schemas/PagedResult'
        - type: object
          properties:
            mailboxId:
              $ref: '#/components/schemas/MailboxId'
            folderId:
              $ref: '#/components/schemas/FolderId'
            messageUIdValidity:
              $ref: "#/components/schemas/MessageUIdValidity"
            items:
              type: array
              items:
                $ref: '#/components/schemas/MessageListItemMIME'
          required:
            - mailboxId
            - folderId
            - messageUIdValidity
            - items
    MessagePosition:
      type: object
      properties:
        mailboxId:
          type: string
          minLength: 1
          description: "The identifier of a mailbox in this API."
        folderId:
          type: string
          minLength: 1
          description: "The identifier of a folder in this API."
        messageUIDValidity:
          type: integer
          format: int64
          minimum: 1
          example: 35488987
        messageUID:
          type: integer
          format: int64
          minimum: 1
          description: "The identifier of a message in this API, given a certain messageUIdValidity."
      required:
        - mailboxId
        - folderId
        - messageUIDValidity
        - messageUID
    LocationToAdd:
      type: object
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'
      required:
        - folderId
  parameters:
    correlationId:
      name: X-Correlation-ID
      in: header
      schema:
        type: string
        description: "Optional field to track your requests. If omitted, one will be created for you and returned in the response."
    mailboxId:
      name: mailboxId
      example: "U45897"
      in: path
      schema:
        type: string
        minLength: 1
        maxLength: 20
        description: "The identifier of a mailbox in this API."
        pattern: "^[a-zA-Z0-9-]+$"
      required: true
    folderId:
      name: folderId
      in: path
      example: "INBOX"
      schema:
        type: string
        minLength: 1
        description: "The identifier of a folder in this API."
      required: true
    messageUIdValidity:
      name: messageUIdValidity
      in: path
      example: 123456
      schema:
        type: integer
        format: int64
        minimum: 0
      required: true
    messageUId:
      name: messageUId
      in: path
      example: 123456
      schema:
        type: integer
        format: int64
        minimum: 0
        description: "The identifier of a message in this API, given a certain messageUIdValidity."
      required: true
    pageSize:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
      description: "The page size of the result set."
    page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: "The requested page of the result set. The first page is 1."
    messageIdentifierEquals:
      in: query
      name: messageIdentifierEquals
      schema:
        type: string
        minLength: 1
        maxLength: 980
      required: false
      description: "List messages with the specified message identifier (Message-ID)."
    provideMimeRepresentation:
      name: provideMimeRepresentation
      in: query
      schema:
        type: boolean
        default: false
        description: "If true, includes a URL to the sent message’s MIME content in the response (`mimeRepresentationUrl` field)."
      required: false
    uaMessageIdentifierEquals:
      in: query
      name: uaMessageIdentifierEquals
      schema:
        type: string
        minLength: 1
        maxLength: 980
      required: false
      description: "List messages with the specified original message identifier (X-Riferimento-Message-ID for PEC messages)."
  responses:
    MailboxNotFound:
      description: "Mailbox not found"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            MailboxNotFoundException:
              $ref: '#/components/examples/MailboxNotFoundException'
      headers:
        X-Correlation-ID:
          schema:
            type: string
          required: true
    TooManyRequestsException:
      description: 'TooManyRequests'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            TooManyRequestsException:
              $ref: '#/components/examples/TooManyRequests'
            TooMuchTrafficFromThisSenderException:
              $ref: '#/components/examples/TooMuchTrafficFromThisSenderException'
      headers:
        X-Correlation-ID:
          schema:
            type: string
          required: true
    MailboxQuotaExceeded:
      description: 'Mailbox quota exceeded'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            MailboxQuotaExceeded:
              $ref: '#/components/examples/MailboxQuotaExceeded'
      headers:
        X-Correlation-ID:
          schema:
            type: string
          required: true
    CreditsExhaustedForThisSenderException:
      description: "Submission credit exhausted for this mailbox. To place new submissions, please purchase more credit. This response only happens for 'prepaid mailboxes' (caselle prepagate), i.e. mailboxes for which submissions are purchased in advance and then consumed. Standard mailboxes never experience this response."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            CreditsExhaustedForThisSenderException:
              $ref: '#/components/examples/CreditsExhaustedForThisSenderException'
      headers:
        X-Correlation-ID:
          schema:
            type: string
          required: true
    MessageRemovedWhileListingException:
      description: "A concurrent operation altered the content of the folder, please resubmit your request."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "/error/MessageRemovedWhileListingException"
            title: "The content of the folder was changed while listing"
            status: 470
            detail: "A concurrent operation altered the content of the folder, please resubmit your request."
            instance: "/VIS12345/folders/INBOX/messages/67890"
      headers:
        X-Correlation-ID:
          schema:
            type: string
          required: true
    ParsingException:
      description: "An error occurred while providing the REM Ready representation. Please, use the getMessageMIME endpoint to read the message."
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "/error/ParsingException"
            title: "Parsing exception"
            detail: "An error occurred while parsing the message. Please, use the getMessageMIME endpoint to read the message."
            status: 520
      headers:
        X-Correlation-ID:
          schema:
            type: string
          required: true
    CannotProvideMimeRepresentation:
      description: 'Cannot provide the requested MIME representation of the submission.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: "/error/CannotUploadMessageOnStorage"
            title: "Cannot provide MIME representation"
            detail: "Please, try again later or create the submission using provideMimeRepresentation=false"
            status: 521
      headers:
        X-Correlation-ID:
          schema:
            type: string
          required: true
    Error:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        X-Correlation-ID:
          schema:
            type: string
          required: true
  examples:
    TooManyRequests:
      value:
        type: "/error/TooManyRequests"
        title: "Too many requests"
        status: 429
        detail: "You exceeded the maximum rate for reading, listing, updating or deleting messages. Please, slow down, or upgrade your mailbox to a higher rate."
        instance: "/VIS06565/folders/"
    InvalidRecipientAddressException:
      value:
        type: "/error/InvalidRecipientAddressException"
        title: "Invalid recipient address"
        detail: "Please, check the 'to' and 'cc' fields of your request."
        status: 422
    EmptyAddressException:
      value:
        type: "/error/EmptyAddressException"
        title: "Empty address"
        detail: "Please, check the 'from', 'to' and 'cc' fields of your request."
        status: 422
    InvalidSenderAddressException:
      value:
        type: "/error/InvalidSenderAddressException"
        title: "Invalid sender address"
        detail: "Please, check the 'from' field of your request."
        status: 422
    SenderNotAllowedForThisMailboxException:
      value:
        type: "/error/SenderNotAllowedForThisMailboxException"
        title: "Sender not allow for this mailbox"
        detail: "Sender address does not match any of the addresses of your mailbox. Please, check the 'from' field of your request. Use the listMailboxes endpoint, to get the available addresses for the mailbox."
        status: 422
    CreditsExhaustedForThisSenderException:
      value:
        type: "/error/CreditsExhaustedForThisSenderException"
        title: "Submission credit exhausted"
        status: 402
        detail: "Submission credit exhausted for this mailbox. To place new submissions, please purchase more credit. This response only happens for 'prepaid mailboxes' (caselle prepagate), i.e. mailboxes for which submissions are purchased in advance and then consumed. Standard mailboxes never experience this response."
        instance: "/VIS12345/send"
    TooMuchTrafficFromThisSenderException:
      value:
        type: "/error/TooMuchTrafficFromThisSenderException"
        title: "Too Much Traffic From This Sender"
        status: 429
        detail: "You exceeded the maximum send rate for this mailbox. Please, slow down, or upgrade your mailbox to a higher send rate."
        instance: "/VIS12345/createSubmission"
    MailboxQuotaExceeded:
      value:
        type: "/error/MailboxQuotaExceededException"
        title: "Mailbox quota exceeded"
        status: 480
        detail: "Please, delete some messages and try again."
        instance: "/VIS12345/folders/INBOX/messages/mime"
    EmptyMessageIdentifierException:
      value:
        type: "/error/EmptyMessageIdentifierException"
        title: "MessageIdentifier should not be empty"
        detail: "Recipient MessageIdentifier is invalid. Please, check your request."
        status: 422
    EmptyHtmlAndTextBodyException:
      value:
        type: "/error/EmptyHtmlAndTextBodyException"
        title: "Empty HTML and text body exception"
        detail: "Please, define at least body.html or body.text."
        status: 422
    MultilineSubjectException:
      value:
        type: "/error/MultilineSubjectException"
        title: "Multiline subject is not allowed"
        detail: "Subject must be on a single line, newline characters are not allowed."
        status: 422
    MissingUAMessageIdentifierException:
      value:
        type: "/error/MissingUAMessageIdentifierException"
        title: "Missing UAMessageIdentifier"
        detail: "Please, define at least UAMessageIdentifier."
        status: 422
    AmbiguousUAMessageIdentifierException:
      value:
        type: "/error/AmbiguousUAMessageIdentifierException"
        title: "Ambiguous UAMessageIdentifier"
        detail: "Please, define only one between UAMessageIdentifier and messageIdentifier. If possible, use UAMessageIdentifier, as messageIdentifier is deprecated."
        status: 422
    MessageUIDValidityNotFoundException:
      value:
        type: "/error/MessageUIDValidityNotFoundException"
        title: "MessageUIdValidity not found"
        detail: "The folder changed since you last visit and the UId of the messages could have changed. Please, get the folder again, to notice the updated MessageUIdValidity, and list the messages again, to notice their possibly updated UIds."
        status: 404
    MessageNotFoundException:
      value:
        type: "/error/MessageNotFoundException"
        title: "Message not found"
        detail: "Please, list the messages again."
        status: 404
    MailboxNotFoundException:
      value:
        type: "/error/MailboxNotFoundException"
        title: "Mailbox not found"
        detail: "Please, list the mailboxes again."
        status: 404
    FolderNotFoundException:
      value:
        type: "/error/FolderNotFoundException"
        title: "Folder not found"
        detail: "Please, list the folders again."
        status: 404
    SourceFolderNotFoundException:
      value:
        type: "/error/SourceFolderNotFoundException"
        title: "Source folder not found"
        detail: "Please, list the folders again."
        status: 404
    DestinationFolderNotFoundException:
      value:
        type: "/error/DestinationFolderNotFoundException"
        title: "Destination folder not found"
        detail: "Please, list the folders again."
        status: 404
    FolderNameShouldNotContainSeparatorException:
      value:
        type: "/error/FolderNameShouldNotContainSeparatorException"
        title: "Folder name should not contain / separator"
        detail: "Please use a folder name that does not contain / separator."
        status: 422
    ParentFolderNotFoundException:
      value:
        type: "/error/ParentFolderNotFoundException"
        title: "Parent folder not found"
        detail: "Please, list the folders again."
        status: 404
    RenamingToAnExistingFolderException:
      value:
        type: "/error/RenamingToAnExistingFolderException"
        title: "Renaming to an existing folder"
        detail: "Folder name used already exist. Please use a different folder name."
        status: 409
    FolderCannotBeCreatedException:
      value:
        type: "/error/FolderCannotBeCreatedException"
        title: "Folder cannot be created"
        detail: "It is not possible to create the specified folder as it might be a reserved or special folder."
        status: 422
    FolderCannotBeDeletedException:
      value:
        type: "/error/FolderCannotBeDeletedException"
        title: "Folder cannot be deleted"
        detail: "It is not possible to delete the specified folder as it might be a reserved or special folder."
        status: 422
    FolderCannotBeRenamedException:
      value:
        type: "/error/FolderCannotBeRenamedException"
        title: "Folder cannot be renamed"
        detail: "It is not possible to rename the specified folder as it might be a reserved or special folder."
        status: 422
    ForbiddenSenderException:
      value:
        type: "/error/ForbiddenSenderException"
        title: "Forbidden sender address"
        detail: "You cannot access submissions from this sender. Use the listMailboxes endpoint, to get the available addresses for the mailbox."
        status: 422
security:
  - busapiv2_mailboxes_oauth2: [ ]
externalDocs:
  description: "Find out more about LegaMail in the InfoCert Digital website"
  url: 'https://infocert.digital'
