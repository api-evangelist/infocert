openapi: 3.0.0
# Please have a look at https://opensource.zalando.com/restful-api-guidelines/
info:
  contact:
    name: "Team Legalmail"
    email: "team.legalmail@infocert.it"
  description: >
    Send, list, read and delete certified email messages.
    
    
    ### REM-ready
    
    
    REM-ready endpoints are future-proof: Your application code won't need any change when the REM,
    the European certified email service, will be available to the public.



    Indeed, REM-ready endpoints parse the messages to provide high-level representations that are compliant with REM 
    concepts and names.
    
    
    ### Reconciliation of messages and receipts

    Each message sent via certified email generates at least two messages, that are sent back to the sender: (1) an 
    acceptance receipt, that certifies that the specific message has been accepted by the sender's provider, and (2) a
    consignment receipt, that certifies that the message has reached the recipient's provider and has been dispatched to
    the designated mailbox. Other type of receipts or system generated messages are possible: please, refer to the full 
    specification for details.


    Matching acceptance and consignment receipts with the original sent message is named "reconciliation".  


    You can perform a reconciliation in two different ways: (1) automatically, by the
    reconciliation (Riconciliazione) endpoints; (2) manually, by looking for receipts in
    your inbox.


    #### Automatic reconciliation by Riconciliazione endpoints

    This is the easy way for reconciliation. Please, refer to searchSubmissions and getSubmissionStatus
    for further details.

    #### Manual reconciliation by looking for receipts in the inbox

    One can also perform manual reconciliation by looking for receipts in the inbox.


    Using REM-ready endpoints:
      1. Set the MessageIdentifier attribute to a unique value when creating a new submission;
      2. Look for the same value in the UAMessageIdentifier attribute of receipts (and dispatches).


    Using MIME endpoints:
      1. Set the Message-ID header to a unique value, when sending the message;
      2. Look for the same value in the X-Riferimento-Message-ID header of receipts (and dispatches).


    ##### Manual reconciliation of single-recipient messages


    In case the submission has *a single recipient*, reconciliation can be achieved by just listing messages.  
    Indeed, the listMessages endpoint provides all the relevant information, since there's no ambiguity in the 
    consignment receipt(s).


    In case of *multiple recipients*, the information provided by the listMessage endpoint is not enough, and the caller
    is required to examine the single consignment receipt by the getMessage endpoint. Indeed, given that, in general,
    one ore more consignment receipts can be generated for the same recipient, the field evidenceRefersToRecipient
    becomes essential for reconciliation.


    ### Authentication schema
    
    
    LegalMail Business API uses OAuth 2 with the 
    [Client Credentials Flow](https://auth0.com/docs/get-started/authentication-and-authorization-flow/client-credentials-flow)
    for authentication.
    
    
    ### Track your requests
    
    
    Use the X-Correlation-ID header to track your requests. By assigning a unique to this header value when calling the 
    APIs, the corresponding reply from the server will contain the same header, allowing you to track multiple requests 
    easily. If this parameter is not provided, a unique value will be generated for you and reported in the response.


    ### Rate limiting
    
    
    This service is provided with different classes, that limit the maximum number of requests one can place. When the
    limit is reached, the service responds with 429 status code.
    
    
    Please, keep in mind that 429 responses count towards such limit: one should wait for a duration at least 
    equal the value of the "Retry-After" header in the 429 response, before placing another request.
    
    
    The HTTP responses are decorated with rate limit headers. The "RateLimit-*" and "Retry-After" headers are 
    based on the Internet-Draft
    ["RateLimit header fields for HTTP"](https://www.ietf.org/archive/id/draft-ietf-httpapi-ratelimit-headers-07.txt).
    
    
    The "X-RateLimit-*" headers provide estensive information on the day and minute time quotas and current usage,
    as in the following example:
    
    - `X-RateLimit-Limit-Day: 2000`
    
    - `X-RateLimit-Limit-Minute: 15`
    
    - `X-RateLimit-Remaining-Day: 1999`
    
    - `X-RateLimit-Remaining-Minute: 14`
    
    
    In this example 1 out of 15 calls requests allowed per minute was used. A daily limit is present as well. Please,
    consider that "minute" and "day" mean sliding windows of 60 seconds and 24 hours, respectively.
    
    #### Pseudocode example for rate-limiting
    
    While `X-RateLimit-*` headers can be used in advanced algorithms, the easiest code to manage the rate-limiting 
    when placing a set of operations follows: it only uses the `Retry-After` header of the 429 responses.
    
    ```
      foreach (operation) {
          done_with_operation = false;
  
          while (!done_with_operation) {
              response_code = send_request(operation);
  
              switch(response_code) {
                  case 200, 204:
                      done_with_operation = true;
                      break;
                  case 429:
                      // rate limit reached; wait before re-placing the request
                      wait for "Retry-After" header seconds
                      break;
                  case 400, 422:
                      // error in the request: do not repeat as it is
                      done_with_operation = true
                      break;
                  ...
          }
      }
    ```

  version: "2.18.0"
  title: "LegalMail Business API - Mailboxes"
tags:
  - name: "REM-ready"
    description: >
      These endpoints are designed to be ready for the transition to REM, with no 
      change to the client code.
  - name: "MIME"
    description: >
      These endpoints are designed for low-level message handling in MIME format.
      Clients that use these endpoints will be affected by the transition to REM.
  - name: "Mailbox"
  - name: "Folder"
  - name: "Message Reading"
  - name: "Message Sending"
  - name: "Organise Messages"
    description: >
      These endpoints let the messages be organised in folders and subfolders. They require a premium subscription
      to be accessed. Access to these endpoints requires the "busapiv2-mailboxes:org-msg" token scope.
  - name: "Riconciliazione"
    description: >
      These endpoints provide operations to reconcile receipts with their submissions and know
      their status of acceptance and consignment. These endpoints require a premium subscription to be accessed.
      Access to these endpoints requires the "busapiv2-mailboxes:riconciliazione" token scope.
  - name: "Welcome"
  - name: "ClassifAI"
servers:
  - url: https://mtlsapi.infocert.digital/api/v2/mailboxes
    description: "Production"
  - url: https://mtlsapitest.infocert.digital/api/v2/mailboxes
    description: "Development"
  - url: https://mtlsapistage.infocert.digital/api/v2/mailboxes
    description: "Staging"
paths:
  /welcome:
    get:
      tags:
        - Welcome
        - REM-ready
      summary: "Welcome"
      description: "General info on this API."
      operationId: "welcome"
      parameters:
        - $ref: '#/components/parameters/correlationId'
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
          content:
            text/plain:
              schema:
                type: string
                example: "This is the LegalMail Business API - Mailboxes, version 0.3.4 build f1598ae3"
        default:
          $ref: '#/components/responses/Error'
  /:
    get:
      tags:
        - Mailbox
        - REM-ready
      summary: "listMailboxes"
      description: "List all the mailboxes that the caller can access."
      operationId: "listMailboxes"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMailboxResult'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}:
    get:
      tags:
        - Mailbox
        - REM-ready
      summary: "getMailbox"
      description: "Show the details of the mailbox."
      operationId: "getMailbox"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mailbox'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          $ref: '#/components/responses/MailboxNotFound'
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/quota:
    get:
      tags:
        - Mailbox
        - REM-ready
      summary: "getMailboxQuota"
      description: "Get the quota for the mailbox."
      operationId: "getMailboxQuota"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxQuota'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          $ref: '#/components/responses/MailboxNotFound'
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/folders:
    get:
      tags:
        - Folder
        - REM-ready
      summary: "listFolders"
      description: |
        List folders in a given mailbox.
        
        ### Concurrent requests
        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,
        requests are queued. The mailbox is indeed locked, when another operation is in progress.
        
        Concurrent requests are beneficial, when they refer to distinct mailboxes.
      operationId: "listFolders"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/mailboxId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFolderResult'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          $ref: '#/components/responses/MailboxNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Folder
        - "Organise Messages"
        - REM-ready
      summary: "createFolder"
      description: |
        Create a new folder.
        
        Access to this endpoint requires the "busapiv2-mailboxes:org-msg" token scope.
        
        
        ### Concurrent requests
        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,
        requests are queued. The mailbox is indeed locked, when another operation is in progress.
        
        Concurrent requests are beneficial, when they refer to distinct mailboxes.
      operationId: "createFolder"
      security:
        - busapiv2_mailboxes_oauth2:
            - 'busapiv2-mailboxes:org-msg'
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/NewFolder'
      responses:
        '200':
          description: "Folder created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '422':
          description: "Invalid input"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FolderNameShouldNotContainSeparatorException:
                  $ref: '#/components/examples/FolderNameShouldNotContainSeparatorException'
                FolderCannotBeCreatedException:
                  $ref: '#/components/examples/FolderCannotBeCreatedException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: "Resource not found"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                ParentFolderNotFoundException:
                  $ref: '#/components/examples/ParentFolderNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/folders/{folderId}:
    get:
      tags:
        - Folder
        - REM-ready
      summary: "getFolder"
      description: |
        Show the details of the folder.
        
        ### Concurrent requests
        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,
        requests are queued. The mailbox is indeed locked, when another operation is in progress.
        
        Concurrent requests are beneficial, when they refer to distinct mailboxes.
      operationId: "getFolder"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/folderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: "Resource not found"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Folder
        - "Organise Messages"
        - REM-ready
      summary: "deleteFolder"
      description: |
        Delete the folder, with any message and subfolder in it.
        
        Access to this endpoint requires the "busapiv2-mailboxes:org-msg" token scope.
        
        
        ### Concurrent requests
        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,
        requests are queued. The mailbox is indeed locked, when another operation is in progress.
        
        Concurrent requests are beneficial, when they refer to distinct mailboxes.
      operationId: "deleteFolder"
      security:
        - busapiv2_mailboxes_oauth2:
            - 'busapiv2-mailboxes:org-msg'
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/folderId'
      responses:
        '204':
          description: "Folder deleted."
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: "Resource not found"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '422':
          description: "Invalid input"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FolderCannotBeDeletedException:
                  $ref: '#/components/examples/FolderCannotBeDeletedException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
        - Folder
        - "Organise Messages"
        - REM-ready
      summary: "renameFolder, rename or move the folder"
      description: |
        Rename or move the folder.
        
        Access to this endpoint requires the "busapiv2-mailboxes:org-msg" token scope.
        
        
        ### Concurrent requests
        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,
        requests are queued. The mailbox is indeed locked, when another operation is in progress.
        
        Concurrent requests are beneficial, when they refer to distinct mailboxes.
      operationId: "renameFolder"
      security:
        - busapiv2_mailboxes_oauth2:
            - 'busapiv2-mailboxes:org-msg'
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/folderId'
      requestBody:
        required: true
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/NewFolder'
      responses:
        '200':
          description: "Folder renamed or moved."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: "Resource not found"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                ParentFolderNotFoundException:
                  $ref: '#/components/examples/ParentFolderNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '409':
          description: "Renaming to an existing folder"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RenamingToAnExistingFolderException:
                  $ref: '#/components/examples/RenamingToAnExistingFolderException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '422':
          description: "Invalid input"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FolderNameShouldNotContainSeparatorException:
                  $ref: '#/components/examples/FolderNameShouldNotContainSeparatorException'
                FolderCannotBeRenamedException:
                  $ref: '#/components/examples/FolderCannotBeRenamedException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/folders/{folderId}/messages/{messageUIdValidity}:
    get:
      tags:
        - Folder
        - "Message Reading"
        - REM-ready
      summary: "listMessages"
      description: |
        List messages in a given folder, with REM-ready data.
        
        You can filter the result to include only messages newer than a specific message by using the fromMessageUId parameter.
        
        Messages are listed in ascending order, starting from the oldest.
        
        ### Efficient reconciliation of single-recipient messages

        In case a message is sent *to a single recipient*, reconciliation can be achieved by just listing messages.  
        The listMessages endpoint provides all the relevant information, since there's no ambiguity between the sent message
        and the associated receipts.
        
        
        In case of multiple recipients, the number of receipts grows, as, in general, more than one consignment receipt can be
        generated for every recipient. In case of two consignment receipts listed for the same sent message, it is not possible
        to identify the original recipient that originated the receipt by the listMessages endpoint. The caller must then examine
        the single receipts by the getMessage endpoint, to obtain this information.
        
        
        ### Concurrent requests
        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,
        requests are queued. The mailbox is indeed locked, when another operation is in progress.
        
        Concurrent requests are beneficial, when they refer to distinct mailboxes.

      operationId: "listMessages"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/messageIdentifierEquals'
        - $ref: '#/components/parameters/uaMessageIdentifierEquals'
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/folderId'
        - $ref: '#/components/parameters/messageUIdValidity'
        - in: query
          name: fromMessageUId
          schema:
            type: integer
            format: int64
            default: 0
            minimum: 0
          required: false
          description: "List messages starting from this uId, excluded."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessageResult'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: "Resource not found"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
                MessageUIDValidityNotFoundException:
                  $ref: '#/components/examples/MessageUIDValidityNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        '470':
          $ref: '#/components/responses/MessageRemovedWhileListingException'
        '520':
          $ref: '#/components/responses/ParsingException'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Folder
        - "Message Reading"
        - REM-ready
      summary: "deleteMessages"
      description: |
        Delete multiple messages.
        
        There are two modes of operation, mutually exclusive:
        - LIST mode, that uses messageUIdList: delete messages by listing their uId;
        - RANGE mode, that uses fromMessageUId and toMessageUId: delete messages in the range 
          [fromMessageUId, toMessageUId], both included.
        
        
        ### Concurrent requests
        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,
        requests are queued. The mailbox is indeed locked, when another operation is in progress.
        
        Concurrent requests are beneficial, when they refer to distinct mailboxes.

      operationId: "deleteMessages"
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/folderId'
        - $ref: '#/components/parameters/messageUIdValidity'
        - in: query
          name: mode
          description: The mode of operation
          schema:
            type: string
            enum: [LIST, RANGE]
          required: true
        - in: query
          name: messageUIdList
          schema:
            type: string
            example: "1001,1002,1003"
            maxLength: 1000
          required: false
          description: "messageUIds to delete, comma-separated."
        - in: query
          name: fromMessageUId
          schema:
            type: integer
            format: int64
            minimum: 1
          required: false
          description: "Delete messages starting from this UId, included."
        - in: query
          name: toMessageUId
          schema:
            type: integer
            format: int64
            minimum: 1
          required: false
          description: "Delete messages up to this UId, included."
      responses:
        '204':
          description: OK
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: "Resource not found"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
                MessageUIDValidityNotFoundException:
                  $ref: '#/components/examples/MessageUIDValidityNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/folders/{folderId}/messages/mime:
    post:
      tags:
        - "Organise Messages"
        - "Message Reading"
        - MIME
      summary: "addMessageMIME"
      description: |
        Add the MIME message to the folder.
        
        Access to this endpoint requires the "busapiv2-mailboxes:org-msg" token scope.
      operationId: "addMessageMIME"
      security:
        - busapiv2_mailboxes_oauth2:
            - 'busapiv2-mailboxes:org-msg'
      parameters:
        - $ref: '#/components/parameters/correlationId'
        - $ref: '#/components/parameters/mailboxId'
        - $ref: '#/components/parameters/folderId'
      requestBody:
        required: true
        content:
          'message/rfc822':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: "Message added successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePosition'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: "Resource not found"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '480':
          $ref: '#/components/responses/MailboxQuotaExceeded'
        default:
          $ref: '#/components/responses/Error'
  /{mailboxId}/folders/{folderId}/messages/{messageUIdValidity}/mime:
    get:
      tags:
        - Folder
        - "Message Reading"
        - MIME
      summary: "listMessagesMIME"
      description: |
        List messages in a given folder, with MIME data.
        
        You can filter the result to include only messages newer than a specific message by using the fromMessageUId parameter.
        
        Messages are listed in ascending order, starting from the oldest.
        
        ### Efficient reconciliation of single-recipient messages

        In case a message is sent *to a single recipient*, reconciliation can be achieved by just listing messages.  
        The listMessagesMIME endpoint provides all the relevant information, since there's no ambiguity between the sent message
        and the associated receipts.
        
        
        In case of multiple recipients, the number of receipts grows, as, in general, more than one consignment receipt can be
        generated for every recipient. In case of two consignment receipts listed for the same sent message, it is not possible
        to identify the original recipient that originated the receipt by the listMessagesMIME endpoint. The caller must then examine
        the single receipts by the getMessageMIME endpoint, to obtain this information.
        
        
        ### Concurrent requests
        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,
        requests are queued. The mailbox is indeed locked, when another operation is in progress.
        
        Concurrent requests are beneficial, when they refer to distinct mailboxes.

