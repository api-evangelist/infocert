  /safelta/core/v1/search/advanced:
    post:
      tags:
        - Enduser/Auditor Activities - Archive Searching
      summary: Search Archive AIPs
      description: Perform advanced search operations on the indexed AIPs.
      operationId: searchArchiveAips
      parameters:
        - name: company_group_title
          in: query
          schema:
            type: string
            example: ''
          description: >-
            Company Group title. If provided, the search will be restricted only
            to documents from this Company Group.
        - name: company_title
          in: query
          schema:
            type: string
            example: ''
          description: >-
            Company title. If provided, the search will be restricted only to
            documents from this Company.
        - name: document_class_title
          in: query
          schema:
            type: string
            example: ''
          description: >-
            Document Class title. If provided, the search will be restricted
            only to documents from this Document Class.
        - name: removeMetadataSuffixes
          in: query
          schema:
            type: string
            example: 'true'
          description: Remove suffixes from metadata field names?
        - name: from
          in: query
          schema:
            type: string
            example: '0'
          description: Index of the first element to return.
        - name: size
          in: query
          schema:
            type: string
            example: '25'
          description: Maximum number of elements to return.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                searchClauses:
                  type: array
                  items:
                    type: object
                    properties:
                      fieldName:
                        type: string
                        example: custom_attribute_0
                      fromDate:
                        type: string
                        example: '2024-04-01'
                      toDate:
                        type: string
                        example: '2024-05-30'
                      type:
                        type: string
                        example: MatchClause
                      value:
                        type: string
                        example: my personal note
                  example:
                    - fieldName: custom_attribute_0
                      type: MatchClause
                      value: my personal note
                    - fieldName: createdOn
                      fromDate: '2024-04-01'
                      toDate: '2024-05-30'
                      type: DateRangeClause
                sortClauses:
                  type: array
                  items:
                    type: object
                    properties:
                      fieldName:
                        type: string
                        example: createdOn
                      sortOrder:
                        type: string
                        example: DESC
                  example:
                    - fieldName: createdOn
                      sortOrder: DESC
            examples:
              Search Archive AIPs:
                value:
                  searchClauses:
                    - fieldName: custom_attribute_0
                      type: MatchClause
                      value: my personal note
                    - fieldName: createdOn
                      fromDate: '2024-04-01'
                      toDate: '2024-05-30'
                      type: DateRangeClause
                  sortClauses:
                    - fieldName: createdOn
                      sortOrder: DESC
      responses:
        '200':
          description: ''
      security:
        - {}
