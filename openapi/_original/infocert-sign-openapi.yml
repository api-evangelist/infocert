        sac:
          type: string
        sacSchema:
          type: string
        transactionId:
          type: string
        otp:
          type: string
        authorizedSignatures:
          type: integer
          format: int32
        signerId:
          type: string
      required:
        - signerId
    MultiSignPadesSignature:
      type: object
      title: MultiSignPadesSignature
      description: Parameters to be used for multisign PADES Signature
      properties:
        signatureFields:
          type: array
          items:
            $ref: '#/components/schemas/MultiSignSignatureField'
        isVisible:
          type: boolean
