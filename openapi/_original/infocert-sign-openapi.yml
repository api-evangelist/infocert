        certificateIds:
          type: array
          description: certificateId to sign
          items:
            type: string
      required:
        - certificateIds
      allOf:
        - $ref: '#/components/schemas/Signature'
    MultiSignSignatureField:
      type: object
      title: MultiSignSignatureField
      properties:
        certificateId:
          type: string
      required:
        - certificateId
      allOf:
        - $ref: '#/components/schemas/SignatureField'
    Info:
      type: object
      title: Info
      description: Info
      properties:
        build:
          $ref: '#/components/schemas/BuildInfo'
    BuildInfo:
      type: object
      title: BuildInfo
      description: Build Info
      properties:
        artifact:
          type: string
        name:
          type: string
        time:
          type: string
          format: date-time
        version:
          type: string
        group:
          type: string
