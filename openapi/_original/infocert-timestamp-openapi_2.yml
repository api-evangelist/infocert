# x-archived-from: infocert-timestamp-openapi.yml
# x-archived-on: 2026-10-18
openapi: 3.0.2
info:
  title: "Public Key Infrastructure Timestamp"
  version: "1.0"
  description: "Public Key Infrastructure (PKI) Time-Stamp Protocol (TSP)"
servers:
- url: https://apitest.infocert.digital/
  description: Test server
- url: https://apistage.infocert.digital/
  description: Staging/UAT server
- url: https://api.infocert.digital/
  description: Production server
tags:
  - name: rfc3161
    description: apply a timestamp using protocol https://tools.ietf.org/html/rfc3161
  - name: misc
    description: misc methods

paths:
  /timestamp/v1/apply:
    post:
      tags:
      - rfc3161
      summary: Apply timestamp to the current .tsq
      description: to create a .tsq 'openssl ts -query -data <original file> -no_nonce -sha512 -cert -out <request>.tsq'
      requestBody:
        content:
          application/timestamp-query:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: a .tsr file to verify the file 'openssl ts -verify -in <response>.tsr -queryfile <request>.tsq'
          content:
            application/timestamp-reply:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://idpstage.infocert.digital/auth/realms/delivery/protocol/openid-connect/token
          scopes:
            timestamp: timestamp scope
            signature: signature scope to perform both signature and timestamp

security:
  - oauth2: []