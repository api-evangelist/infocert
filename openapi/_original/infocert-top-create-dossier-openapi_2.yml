openapi: 3.0.0
info:
  description: 'Create Dossier'
  version: 1.0.0
  title: TOP - Create Dossier process
servers:
  - url: https://top-stage.infocert.it
    description: Internal staging server for testing
  - url: http://ip1pvliascct001.print.infocert.it:9090
    description: Main (production) server
paths:
  /nomtom/top/services/OnboardingService:
    security:
      - basicAuth: []
    post:
      tags:
        - createDossier
      summary: Create Dossier process, that generates a dossierID. If the flow is "ex ante", the dossier id is generated by the CadesSign function, started before the CreateDossier one. The CreateDossier only uses the provided id to generate the dossier. If the flow is "ex post", the CreateDossier creates the dossier id number and uses it. 
      schema:
        $ref: '#/components/schemas/soapenv:EnvelopeResp'
      requestBody:
        description: For all the parameters' valid values, kindly refer to [signer data](https://kong.eu-west-1.tsaws.infocert.it/topcloud/portal-editor/content/top/technical-requirements/field-format/validation/validation.md).
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/soapenv:Envelope'
        required: true
      responses:
        '200':
          description: a CadesSign XML tag, containing a signedResponse, with a signed-content of mime type APPLICATION_PKC7
          content:
            application/xml:
              schema: 
              $ref: '#/components/schemas/soapenv:EnvelopeResp'
          security:
            process_auth             
        '404':
          description: Not Found
          content:
            application/xml:
              schema: 
              $ref: '#/components/schemas/response3Fields'
        '500':
          description: Server error. Probably the OTP was inserted in an incorrect way, or some parameters are wrong. Check if the email, dossier type and the mobile number are correct, just to name a few.  
          content:
            application/xml:
              schema: 
              $ref: '#/components/schemas/response4Fields'
