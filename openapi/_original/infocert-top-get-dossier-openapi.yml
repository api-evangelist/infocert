openapi: 3.0.0
info:
  description: 'Get Dossier'
  version: 1.0.0
  title: TOP - Get Dossier process

servers:
  - url: https://top-stage.infocert.it
    description: Internal staging server for testing
  - url: http://ip1pvliascct001.print.infocert.it:9090
    description: Main (production) server

produces:
  - application/json
paths:
  /nomtom/top/services/OnboardingService:
    post:
      summary: get dossier 
      tags:
        - process
      consumes: application/soap
      produces:
      - application/soap
      - a dossier id number
      parameters:
      - type: certificate
        name: certificate
        in: request body, cadessign
        required: true
      - type: string
        name: pin
        in: request body, cadessign
        required: true
      - type: xml
        name: data
        in: request body
        required: true
      - type: string
        name: signer data
        in: request body, create dossier
        required: true
      - type: string
        name: dossier id
        in: parameter list, generated in the previous phase
        required: true
      - type: file/pdf
        name: document to be signed
        in: request body, create dossier
        required: true
      responses:
        '200':
          description: a CadesSign XML tag, containing a at first a signedResponse, and then a dossierResponse 
          content:
            application/soap:
              schema: 
                type: string
                $ref: '#/components/schemas/getDossier'
        '404':
          description: Not Found
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/getDossierKO3par'
        '500':
          description: Server error. Probably the OTP was inserted in an incorrect way, or some parameters are wrong. Check if the email, dossier type and the mobile number are correct, just to name a few.  
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/getDossierKO3par' 
components:
  schemas:
    getDossier:
    soapenv:Envelope:
      type: object
      properties:         
        soapenv:Body:
          type: object
          properties:          
            ns3:getDossierResponse:
              type: object
              properties:
                dossier-info:
                  type: object
                  properties: 
                    business-id:
                      type: string
                      format: string
                    status:
                      type: string
                      format: string  
                    creation-date:
                      type: string
                      format: string   
                    last-activity-date:
                      type: string
                      format: string   
                    signers:
                      type: object
                      properties: 
                        signers:
                          type: object
                          properties: 
                            identified:
                              type: boolean
                              format: boolean
                            personal-data-updated:
                              type: boolean
                              format: boolean                                
                            address-updated:
                              type: boolean
                              format: boolean   
                            identity-document-info-updated:
                              type: boolean
                              format: boolean  
                            person:
                              type: object
                              properties:                            
                                legal-id:
                                  type: string
                                  format: string   
                                personal-data:
                                  type: object
                                  properties:   
                                    fiscal-code:
                                      type: string
                                      format: string  
                                    first-name:
                                      type: string
                                      format: string  
                                    last-name:
                                      type: string
                                      format: string  
                                    birth-date:
                                      type: string
                                      format: string  
                                    sex:
                                      type: string
                                      format: string  
                                    birth-place:
                                      type: string
                                      format: string  
                                    birth-province:
                                      type: string
                                      format: string  
                                    birth-country:
                                      type: string
                                      format: string  
                                    full-first-name:
                                      type: string
                                      format: string  
                                    full-last-name:
                                      type: string
                                      format: string  
                                contact-details:
                                  type: string
                                  format: string  
                                address:
                                  type: object
                                  properties: 
                                    street:
                                      type: string
                                      format: string                           
                                    number:
                                      type: string
                                      format: string                                                                   
                                    zip:
                                      type: string
                                      format: string      
                                    city:
                                      type: string
                                      format: string  
                                    province:
                                      type: string
                                      format: string      
                                    country:
                                      type: string
                                      format: string      
                                identity-document-info:
                                  type: object
                                  properties: 
                                    issuer:
                                      type: string
                                      format: string 
                                    issue-place:
                                      type: string
                                      format: string 
                                    issue-province:
                                      type: string
                                      format: string 
                                    issue-date:
                                      type: string
                                      format: string 
                                    expiration-date:
                                      type: string
                                      format: string 
                    documents:
                      type: object
                      properties: 
                        documents:
                          type: object
                          properties:                       
                            status:
                              type: string
                              format: string 
                            content:
                              type: object
                              properties:                           
                                mime-type:
                                  type: string
                                  format: string 
                                data:
                                  type: string
                                  format: string
    getDossierKO4par:
      type: object
      properties:
        httpStatus:
          type: string
          format: string                       
        errorKey:
          type: string
          format: string         
        errorMessage:
          type: string
          format: string 
        recoverable:
          type: boolean
          format: boolean 
    getDossierKO3par:
      type: object
