  schemas:
    sign:
      {
      "process": 
        {
          "processStatus": "COMPLETED"
        },
        "enrollment": 
        {
          "status": "COMPLETED",
          "documents": 
          [
            {
              "id": "DOC-4ba48a8d-1f05-4c8b-8fdb-1ece78547edb",
              "name": "FINDOMESTIC_CONTRACT_605565",
              "status": "SIGNED",
              "url": "content/733788?token=0af42d6c96cac7e0fbf779d6731b60e5c8c71aeb144ce96188d722cbb51c222ee4695eddd849ea46603ab24506b9080a41b15e3bdd9450090bfc104a51b4c61653373c4f5fa84306120ab48719e01697ee299c01d8e18e92581a44ee044c7d0f4c741d34530b2524cdeac8097c21bf84ba352adb67d0cfd7bf1f66eefa40b72a",
              "signatures": 
              [
                {
                  "id": "firma1",
                   "text": "Reason firma1"
                },
                {
