openapi: 3.0.0
info:
  description: 'One shot Issue and sign'
  version: 1.0.0
  title: TOP - One shot Issue and sign process

servers:
  - url: https://top-stage.infocert.it
    description: Internal staging server for testing
  - url: http://ip1pvliascct001.print.infocert.it:9090
    description: Main (production) server

produces:
  - application/json
paths:
  /top/rest10/{taskName}/{taskId}issueandsign:  
    post:
      summary: registers the correct OTP sent in  the previous step to the signer's mobile phone. 
      tags:
        - process
      consumes: application/soap
      produces:
      - application/soap
      - all the signed documents. the process is complete. 
      parameters:
      - type: string
        name: task name
        in: url
        required: true
      - type: string
        name: task id
        in: url
        required: true
      responses:
        '200':
          description: 
          content:
            application/json:
              schema: 
                type: string
                $ref: '#/components/schemas/sign'
        '401':
          description: Unauthorized
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/signKO4par'                
        '404':
          description: Not Found
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/signKO3par'
        '405':
          description:  Method Not Allowed.
          content: 
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/signKO3par' 
        '500':
          description: Server error. 
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/signKO3par' 
