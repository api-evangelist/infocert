# x-archived-from: infocert-top-oneshot-register-openapi.yml
# x-archived-on: 2026-10-18
openapi: 3.0.0
info:
  description: 'One shot Register'
  version: 1.0.0
  title: TOP - One shot Register process

servers:
  - url: https://top-stage.infocert.it
    description: Internal staging server for testing
  - url: http://ip1pvliascct001.print.infocert.it:9090
    description: Main (production) server

produces:
  - application/json
paths:
  /top/rest10/{taskName}/{taskId}/register:  
    post:
      summary: sends the signature clauses 
      tags:
        - process
      consumes: application/soap
      produces:
      - application/soap
      - a dossier id number
      parameters:
      - type: string
        name: task name
        in: url
        required: true
      - type: string
        name: task id
        in: url
        required: true
      - type: string
        name: OTP
        in: signer's mobile phone
        required: true
      responses:
        '200':
          description: 
          content:
            application/json:
              schema: 
                type: string
                $ref: '#/components/schemas/register'
        '401':
          description: Unauthorized
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/registerKO4par'                
        '404':
          description: Not Found
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/registerKO3par' 
        '405':
          description:  Method Not Allowed.
          content: 
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/registerKO3par' 
        '500':
          description: Server error. 
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/registerKO4par' 
components:
  schemas:
    register:
      type: object
      properties:
        documents:
          type: object
          properties:
            id:
              type: string
              format: string
            name:
              type: string
              format: string
            status:
              type: string
              format: string
            url:
              type: string
              format: string   
            signatures:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: string   
                  text:
                    type: string
                    format: string               
    registerKO4par:
      type: object
      properties:
        httpStatus:
          type: string
          format: string                       
        errorKey:
          type: string
          format: string         
        errorMessage:
          type: string
          format: string 
        recoverable:
          type: boolean
          format: boolean 
    registerKO3par:
      type: object
      properties:
        httpStatus:
          type: string
          format: string                       
        errorKey:
          type: string
          format: string         
        recoverable:
          type: boolean
          format: boolean           
