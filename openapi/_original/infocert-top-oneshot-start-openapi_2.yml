# x-archived-from: infocert-top-oneshot-start-openapi.yml
# x-archived-on: 2026-10-18
openapi: 3.0.0
info:
  description: 'One shot start'
  version: 1.0.0
  title: TOP - One shot start process

servers:  
  - url: https://top-stage.infocert.it
    description: Internal staging server for testing
  - url: http://ip1pvliascct001.print.infocert.it:9090
    description: Main (production) server

produces:
  - application/json
paths:
  /top/rest10/{taskName}/{taskId}/start:
    post:
      summary: triggers the one shot or other task with the given task id. the status will became "RUNNING PENDING REGISTRAZIONE" (running pending registration), all the person data in a json, and the clauses that must be accepted in order to sign the contract. Generates an OTP code that is sent to the signer's mobile phone. Task name example oneshot. Task id example 624424
      tags:
        - process
      consumes: application/json
      produces: application/json
      parameters:
      - type: string
        name: task name
        in: url
        required: true
      - type: string
        name: task id
        in: url
        required: true
      responses:
        '200':
          description: json with all the signer's data and an OTP.
          content:
            application/json:
              schema: 
                type: string
                $ref: '#/components/schemas/processStart'
        '401':
          description: Unauthorized
          content:
            application/html:
              schema: 
                type: string
                $ref: '#/components/schemas/processStart401'                                
        '404':
          description: Not Found
          content:
            application/json:
              schema: 
                type: string
                $ref: '#/components/schemas/processStartKO'
        '405':
          description:  Method Not Allowed. Check the URL.
          content: 
            application/json:
              schema: 
                type: string
                $ref: '#/components/schemas/processStartKO'
components:
  schemas:
    processStart:
      type: object
      properties:
        status:
