              format: string
            serialNumber:
              type: string
              format: string
            identified:
              type: boolean
              format: boolean
            personalData:
              type: object
              properties:
                fiscalCode:
                  type: string
                  format: string
                firstName:
                  type: string
                  format: string
                lastName:
                  type: string
                  format: string
                birthDate:
                  type: string
                  format: string
                sex:
                  type: string
                  format: string
                citizenship:
                  type: string
                  format: string
                birthPlace:
                  type: string
                  format: string
                birthProvince:
                  type: string
                  format: string
                birthCountry:
                  type: string
                  format: string
                fullFirstName:
                  type: string
                  format: string
                fullLastName:
                  type: string
                  format: string
            contactDetails:
              type: object
              properties:
                email:
                  type: string
                  format: string
                mobileNumber:
                  type: string
                  format: string
            address:
              type: object
              properties:
                street:
                  type: string
                  format: string
                number:
                  type: string
                  format: string
                zip:
                  type: string
                  format: string
                city:
                  type: string
                  format: string
                province:
                  type: string
                  format: string
                country:
                  type: string
                  format: string
            identityDocumentInfo:
              type: object
              properties:   
                type:
                  type: string
                  format: string
                number:
                  type: string
                  format: string
                issuer:
                  type: string
                  format: string
                issuePlace:
                  type: string
                  format: string
                issueProvince:
                  type: string
                  format: string
                issueDate:
                  type: string
                  format: string
                expirationDate:
                  type: string
                  format: string
        clauses:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: string   
              text:
                type: string
                format: string
              group:
                type: string
                format: string
              urls:
                type: array
                items:
                  type: object
                  properties:
                    url: 
                      type: string
                      format: string
                    name:
                      type: string
                      format: string
              mode:
                type: string
                format: string
    processStart401:
      type: object
      properties:
        httpStatus:
          type: string
          format: string                       
        errorKey:
          type: string
          format: string         
        errorMessage:
          type: string
          format: string 
        recoverable:
          type: boolean
          format: boolean 
    processStartKO:
      type: object
      properties:
        httpStatus:
          type: string
          format: string                       
        errorKey:
          type: string
