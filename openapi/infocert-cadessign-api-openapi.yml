openapi: 3.2.0
info:
  title: Infocert Cadessign API
  version: 1.0.0
  description: 'Operations tagged cadessign across 2 of this provider''s published API definitions: infocert-top-cades-sign-openapi.yml, infocert-top-cades-sign-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://top-stage.infocert.it
  description: Internal staging server for testing. Signing documents with CADES Protocol. Make sure that the Identity assertion is correct. you must encode in base64 all data, and take a special care in verifying the serial numbers and fiscal codes of the claimer and of the person. All the following xml must be edited, encoded and inserted in the <data></data> tag in the CadesSign process. A pin is required. It is a fixed pin, not to be changed.
- url: http://ip1pvliascct001.print.infocert.it:9090
  description: Main (production) server
basePath: /identification/afm/v1
security:
- basicAuth: []
tags:
- name: cadessign
paths:
  /nomtom/top/services/OnboardingService:
    post:
      security:
      - basicAuth: []
      tags:
      - cadessign
      summary: Cades signature.
      requestBody:
        description: Needs a preliminary authorization. Uses a Certificate and a, fixed, PIN. The response is the signed document. For all the parameters' valid values, kindly refer to [signer data](https://kong.eu-west-1.tsaws.infocert.it/topcloud/portal-editor/content/top/technical-requirements/field-format/validation/validation.md).
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/ns1_identity-assertion'
        required: true
      responses:
        '200':
          description: a CadesSign XML tag, containing a signedResponse, with a signed-content of mime type APPLICATION_PKC7
          content:
            application/xml:
              schema: null
              $ref: '#/components/schemas/soapenv_EnvelopeResp'
          security: process_auth
        '404':
          description: Not Found
          content:
            application/xml:
              schema: null
              $ref: '#/components/schemas/response3Fields'
        '500':
          description: Server error. Probably the OTP was inserted in an incorrect way, or some parameters are wrong. Check if the email, dossier type and the mobile number are correct, just to name a few.
          content:
            application/xml:
              schema: null
              $ref: '#/components/schemas/response4Fields'
      operationId: postNomtomTopServicesOnboardingService
      x-operation-id-source: derived
    servers:
    - url: https://top-stage.infocert.it
      description: Internal staging server for testing. Signing documents with CADES Protocol. Make sure that the Identity assertion is correct. you must encode in base64 all data, and take a special care in verifying the serial numbers and fiscal codes of the claimer and of the person. All the following xml must be edited, encoded and inserted in the <data></data> tag in the CadesSign process. A pin is required. It is a fixed pin, not to be changed.
    - url: http://ip1pvliascct001.print.infocert.it:9090
      description: Main (production) server
