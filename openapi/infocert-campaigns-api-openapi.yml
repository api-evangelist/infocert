openapi: 3.2.0
info:
  title: Infocert Campaigns API
  version: '1'
  contact:
    name: GoNotice API support
    url: https://www.infocert.it
    email: gonotice@infocert.it
  license:
    name: InfoCert
    url: https://www.infocert.it
  termsOfService: urn:tos
  description: 'Operations tagged Campaigns across 2 of this provider''s published API definitions: infocert-gonotice-openapi.yml, infocert-gonotice-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.infocert.digital/edelivery/v1
- url: https://{client-callback-endpoint}
  description: The URL configured by the client to receive the dispatch update callbacks.
basePath: /identification/afm/v1
security:
- oAuth2: []
tags:
- name: Campaigns
paths:
  /pt/{ptExternalID}/campaigns:
    parameters:
    - $ref: '#/components/parameters/ptExternalID'
    post:
      tags:
      - Campaigns
      summary: Creates a new Campaign linked to a process type
      operationId: createCampaign
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaign'
            examples:
              campaign:
                $ref: '#/components/examples/CreateCampaign'
              minimal_campaign:
                $ref: '#/components/examples/CreateCampaignMinimal'
      responses:
        '201':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://api.infocert.digital/edelivery/v1
    - url: https://{client-callback-endpoint}
      description: The URL configured by the client to receive the dispatch update callbacks.
components:
  responses:
    '401':
      description: Invalid access token or credentials
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/OperationOutcome'
            - $ref: '#/components/schemas/InvalidCredentials'
            - $ref: '#/components/schemas/UnauthorizedOutcome'
          examples:
            invalid_tokens:
              summary: Invalid access token
              value:
                code: INVALID_ACCESS_TOKEN
                sub_code: INVALID_JWT_TOKEN
                message: Invalid JWT token
                correlationID: 0a83cbc5-1f88-4166-9880-ae132adf8b54
                timestamp: '2021-12-18T17:07:24.192253Z'
            invalid_credentials:
              summary: Invalid client secret
              value:
                error: unauthorized_client
                error_description: Invalid client secret
            unauthorized_outcome:
              summary: Unauthorized
              value:
                message: Unauthorized
    '201':
      description: Resource created
      content:
        text/plain: {}
    '500':
      description: An unexpected server error has occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          example:
            code: UNEXPECTED
            message: Unexpected Server Error
            correlationID: 0a83cbc5-1f88-4166-9880-ae132adf8b54
            timestamp: '2021-12-18T17:07:24.192253Z'
    '400':
      description: Malformed parameters or bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          example:
            code: BAD_REQUEST
            sub_code: INVALID_COST_CENTER
            message: Bad request
            correlationID: 0a83cbc5-1f88-4166-9880-ae132adf8b54
            timestamp: '2021-12-18T17:07:24.192253Z'
    '422':
      description: One or more request field are wrong or illegal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          example:
            code: ILLEGAL_ARGUMENT
            message: Illegal or wrong request field
            correlationID: 0a83cbc5-1f88-4166-9880-ae132adf8b54
            timestamp: '2021-12-18T17:07:24.192253Z'
  parameters:
    ptExternalID:
      name: ptExternalID
      in: path
      description: Identifier of the process type known by the external system
      required: true
      schema:
        type: string
  schemas:
    ErrorResponseCode:
      readOnly: true
      type: string
      description: Error response code
      enum:
      - BAD_REQUEST
      - INVALID_ACCESS_TOKEN
      - RESOURCE_NOT_FOUND
      - UNMATCHED_MIME_TYPE
      - ILLEGAL_ARGUMENT
      - UNEXPECTED
    UnauthorizedOutcome:
      title: unauthorizedOutcome
      type: object
      properties:
        message:
          description: Message
          type: string
      required:
      - message
    OperationOutcome:
      title: operationOutcome
      type: object
      properties:
        code:
          description: Error response code
          $ref: '#/components/schemas/ErrorResponseCode'
        message:
          description: Outcome message
          type: string
        successful:
          description: Successful if true
          type: boolean
        url:
          description: Outcome URL
          type: string
          format: uri
        timestamp:
          description: Outcome timestamp
          type: string
          format: date-time
        correlationID:
          description: Correlation ID
          type: string
        details:
          description: Details information
          type: object
      required:
      - code
      - timestamp
      - correlationID
    CampaignSchedulingData:
      title: CampaignSchedulingData
      type: object
      properties:
        timeSlot:
          $ref: '#/components/schemas/TimeSlot'
        startDate:
          type: string
          format: date
          description: Start date of the campaign (YYYY-MM-DD format)
    InvalidCredentials:
      title: invalidCredentials
      description: Invalid credentials
      type: object
      properties:
        error:
          description: Error title
          type: string
        error_description:
          description: Error description
          type: string
    Attachment:
      title: Attachment
      type: object
      properties:
        name:
          description: Descriptive name of the attachment. Can be shown to the users and recipients.
          type: string
          example: Document to be approved
        filename:
          description: Filename with extension but without path
          type: string
          example: document.pdf
        size:
          description: File size in KB
          type: number
          format: int32
          minimum: 0
          example: 123
        mimeType:
          description: The only format supported is PDF, a validation error has to occur when using a different file type
          type: string
          example: application/pdf
        url:
          description: Path to attachment content
          type: string
          example: uploads/////filename
        template:
          description: If true the attachment is a template
          type: boolean
          example: false
        placeholders:
          description: List of placeholders
          type: array
          items:
            type: string
          default: []
      required:
      - name
      - filename
      - mimeType
    TimeSlot:
      title: TimeSlot
      type: object
      properties:
        startHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 8
          example: 9
        endHour:
          type: integer
          minimum: 0
          maximum: 23
          default: 20
          example: 18
    CreateCampaign:
      title: CreateCampaign
      description: Creation of a Campaign
      type: object
      properties:
        campaignExternalID:
          type: string
        campaignName:
          type: string
          description: Name of the campaign
        costCenter:
          type: string
          description: Cost center of the campaign
        author:
          type: string
          description: Author of the campaign
        timezone:
          type: string
          description: Like Europe/Rome, GMT+1
        schedulingData:
          $ref: '#/components/schemas/CampaignSchedulingData'
        commonAttachments:
          description: Zero or more common attachments
          type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            certificationLevel:
              type: string
              enum:
              - None
              - AttachmentOpened
          required:
          - content
          - certificationLevel
      required:
      - campaignName
      - timezone
      - costCenter
      - author
  examples:
    CreateCampaign:
      summary: Scheduled campaign with a common attachment
      value:
        author: FirstName LastName
        campaignName: Test campaign
        costCenter: Default
        timezone: Europe/Rome
        schedulingData:
          timeSlot:
            startHour: 9
            endHour: 18
          startDate: '2026-01-16'
        commonAttachments:
          content:
          - name: Document to be approved
            filename: document.pdf
            size: 123
            mimeType: application/pdf
            url: uploads/campaign/document.pdf
            template: false
            placeholders: []
          certificationLevel: None
    CreateCampaignMinimal:
      summary: Minimal campaign
      value:
        author: FirstName LastName
        campaignName: Test campaign
        costCenter: Marketing 2022 - Q2
        timezone: Europe/Rome
  securitySchemes:
    openID:
      $ref: '#/components/securitySchemes/openID'
      description: OpenID connection
      type: openIdConnect
      openIdConnectUrl: https://idp.infocert.digital/auth/realms/edelivery/.well-known/openid-configuration
    oAuth2:
      $ref: '#/components/securitySchemes/oAuth2'
      type: oauth2
      description: Oauth2 information
      flows:
        authorizationCode:
          description: Authorization code
          authorizationUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/auth
          tokenUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/token
          refreshUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/token
          scopes:
            edelivery: This scope is required
        password:
          description: Password
          tokenUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/token
          refreshUrl: https://idp.infocert.digital/auth/realms/edelivery/protocol/openid-connect/token
          scopes:
            edelivery: This scope is required
x-refined-from:
- infocert-gonotice-openapi.yml
- infocert-gonotice-openapi.yml
