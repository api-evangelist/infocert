openapi: 3.2.0
info:
  title: Infocert Certificate Management API
  version: '1.0'
  description: 'Operations tagged Certificate Management Api across 2 of this provider''s published API definitions: infocert-certificate-management-openapi.yml, infocert-certificate-management-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apistage.infocert.digital/certificate/v1
  description: Stage Environment  base url
- url: https://api.infocert.digital/certificate/v1
  description: Production Environment  base url
basePath: /identification/afm/v1
tags:
- name: Certificate Management Api
paths:
  /{certificateId}/status:
    put:
      parameters:
      - name: certificateId
        in: path
        description: The certificate Id
        required: true
        schema:
          type: string
      security:
      - bearerAuth: []
      tags:
      - Certificate Management Api
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: MIAGCSqGSIb3DQEHAqCAMIACAQExDTALBglghkgBZQMEAgEwgAYJKoZIhvcNAQcBoIAkgARSeyJyZWFzb24iOiJDRVJUSUZJQ0FURV9IT0xEIiwiZG5RdWFsaWZpZXIiOiJhNmZlMjc1ZC0yZjg2LTQwZjYtOWVhZS05YmYwNG...
      responses:
        '204':
          description: NO Content
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObjStatusBean400'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObjStatusBean404'
        '412':
          description: Precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObjStatusBean412'
        '500':
          description: System error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorObjStatusBean500'
      summary: Replace by certificate id status
      x-summary-source: derived
      operationId: putByCertificateIdStatus
      x-operation-id-source: derived
    servers:
    - url: https://apistage.infocert.digital/certificate/v1
      description: Stage Environment  base url
    - url: https://api.infocert.digital/certificate/v1
      description: Production Environment  base url
