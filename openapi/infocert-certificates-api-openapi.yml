  description: 'Operations tagged certificates across 2 of this provider''s published API definitions: infocert-sign-openapi.yml, infocert-sign-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apitest.infocert.digital/signature/v1
  description: Testing server
- url: https://apistage.infocert.digital/signature/v1
  description: Staging server
- url: https://api.infocert.digital/signature/v1
  description: Production server
- url: https://mtlsapitest.infocert.digital/signature/v1
