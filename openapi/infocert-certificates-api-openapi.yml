basePath: /identification/afm/v1
tags:
- name: Certificates
paths:
  /certificates:
    get:
      tags:
      - Certificates
      summary: Lists certificates associated with a given identity
      parameters:
      - $ref: '#/components/parameters/xSignerId'
      - $ref: '#/components/parameters/infocertCorrelationId'
      - $ref: '#/components/parameters/cscAuth'
      - $ref: '#/components/parameters/cscUrl'
      responses:
        '200':
          description: A list of associated certificates credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Certificate'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/SignatureDisabled'
        '500':
          $ref: '#/components/responses/ServerSideError'
      security:
      - BearerAuth: []
      servers:
      - url: https://apitest.infocert.digital/signature/v1
        description: Testing server
      - url: https://apistage.infocert.digital/signature/v1
        description: Staging server
      - url: https://api.infocert.digital/signature/v1
        description: Production server
      - url: https://mtlsapitest.infocert.digital/signature/v1
        description: mTLS Testing server
      - url: https://mtlsapistage.infocert.digital/signature/v1
        description: mTLS Staging server
      - url: https://mtlsapi.infocert.digital/signature/v1
        description: mTLS Production server
      operationId: getCertificates
      x-operation-id-source: derived
    servers:
    - url: https://apitest.infocert.digital/signature/v1
      description: Testing server
    - url: https://apistage.infocert.digital/signature/v1
      description: Staging server
    - url: https://api.infocert.digital/signature/v1
      description: Production server
    - url: https://mtlsapitest.infocert.digital/signature/v1
      description: mTLS Testing server
    - url: https://mtlsapistage.infocert.digital/signature/v1
      description: mTLS Staging server
    - url: https://mtlsapi.infocert.digital/signature/v1
      description: mTLS Production server
  /certificates/{certificateId}:
    get:
      tags:
      - Certificates
      summary: Get specific certificate associated with a given identity and id
      parameters:
      - $ref: '#/components/parameters/xSignerId'
      - $ref: '#/components/parameters/infocertCorrelationId'
      - $ref: '#/components/parameters/cscAuth'
      - $ref: '#/components/parameters/cscUrl'
      - $ref: '#/components/parameters/certificateId'
      responses:
        '200':
          description: Certificate Data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        '403':
          $ref: '#/components/responses/SignatureDisabled'
        '404':
          $ref: '#/components/responses/CertificateNotFound'
        '500':
          $ref: '#/components/responses/ServerSideError'
      security:
      - BearerAuth: []
      servers:
      - url: https://apitest.infocert.digital/signature/v1
        description: Testing server
      - url: https://apistage.infocert.digital/signature/v1
        description: Staging server
      - url: https://api.infocert.digital/signature/v1
        description: Production server
      - url: https://mtlsapitest.infocert.digital/signature/v1
        description: mTLS Testing server
      - url: https://mtlsapistage.infocert.digital/signature/v1
        description: mTLS Staging server
      - url: https://mtlsapi.infocert.digital/signature/v1
        description: mTLS Production server
      operationId: getCertificatesByCertificateId
      x-operation-id-source: derived
    servers:
    - url: https://apitest.infocert.digital/signature/v1
      description: Testing server
    - url: https://apistage.infocert.digital/signature/v1
      description: Staging server
    - url: https://api.infocert.digital/signature/v1
      description: Production server
    - url: https://mtlsapitest.infocert.digital/signature/v1
      description: mTLS Testing server
    - url: https://mtlsapistage.infocert.digital/signature/v1
      description: mTLS Staging server
    - url: https://mtlsapi.infocert.digital/signature/v1
      description: mTLS Production server
  /certificates/{certificateId}/pin:
    put:
      tags:
      - Certificates
      summary: resource to change pin of the certificate associated with a given identity and…
      description: resource to change pin of the certificate associated with a given identity and id
      parameters:
      - $ref: '#/components/parameters/xSignerId'
      - $ref: '#/components/parameters/infocertCorrelationId'
      - $ref: '#/components/parameters/cscAuth'
      - $ref: '#/components/parameters/cscUrl'
      - $ref: '#/components/parameters/certificateId'
      requestBody:
        description: Change Pin Request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePinRequest'
      responses:
        '204':
          description: The pin was changed
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '403':
          $ref: '#/components/responses/SignatureDisabled'
        '404':
          $ref: '#/components/responses/CertificateNotFound'
        '500':
          $ref: '#/components/responses/ServerSideError'
      security:
