          type: string
      - name: OTP
        in: header
        schema:
          type: string
      - name: identity
        in: header
        schema:
          type: string
      - name: transactionId
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
            examples:
              change-email:
                value:
                  field: EMAIL
                  value: info@infocert.it
              change-mobile:
                value:
                  field: MOBILE
                  value: '+393333333333'
