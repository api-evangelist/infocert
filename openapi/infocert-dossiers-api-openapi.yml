          $ref: '#/components/schemas/RoleExternalId'
    ActionType:
      type: string
      enum:
      - SIGN
      - APPROVE
      - VIEW
      - INITIALS
      - PROTOCOL
      - FREE_TEXT
      - APPROVAL_DATE
      - FIRST_NAME
      - LAST_NAME
      - FULL_NAME
      - OTHER_DETAILS
      - GRAPHOMETRIC
      - CHECKBOX
      - RADIOBUTTON
      - RESTRICTED
      - AUTOMATIC_SIGNATURE
      - SEAL
      description: "Available action types are as follows.\nMain actions:\n  * SIGN - signature\n  * INITIALS - initials\n  * APPROVE - approval\n  * VIEW - acknowledge\n\nAdditional actions:\n  * FIRST_NAME - signer first name\n  * LAST_NAME - signer last name\n  * FULL_NAME - signer full name\n  \n  * FREE_TEXT - affixation of approval date\n  * APPROVAL_DATE - free text area\n  * OTHER_DETAILS - more details of signer\n\nNote that additional actions are available for a task of a process only if it:\n  * is the first task in process\n  * has not any signers in OR\n  * is not in parallel with another task\nMoreover, the document must not have any existing signatures and signature type selected must be \"simple signature\".\nSpecial actions:\n  * GRAPHOMETRIC - graphometric signature\n  * RESTRICTED - restricted visibility\n  * PROTOCOL - protocol number affixation\n"
    PageNumber:
