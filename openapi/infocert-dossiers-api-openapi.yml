    TaskAction:
      type: string
      enum:
      - WORK
      - REGISTRATION
      - EDIT_DOSSIER
      - MODIFY_PROCESS
      - SEND_MAIL
      - AUTOMATIC_SIGNATURE
      description: "Process type definition\n  * WORK - Document processing\n  * REGISTRATION - Document registration\n  * EDIT_DOSSIER - Dossier change\n  * MODIFY_PROCESS - Modify dossier process\n  * SEND_MAIL - Send mail\n  * AUTOMATIC_SIGNATURE - Automatic signature\n"
    DossierExternalId:
