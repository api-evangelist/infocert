      properties:
        id:
          type: integer
          format: int32
          description: Envelope id valued only if DMS have a specific confString
          readOnly: true
        commonMessages:
          $ref: '#/components/schemas/EnvelopeMessages'
        confString:
          type: string
          description: json string to configure Envelope.
        docClass:
          $ref: '#/components/schemas/DocumentClass'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        expireAt:
          description: field date value in milliseconds since 1 January 1970.
          type: integer
          format: int64
          example: 1620134602296
        externalId:
          type: string
          description: Unique envelope identification code within GoSign
        joinDocuments:
          type: string
        procDef:
          $ref: '#/components/schemas/ProcessDef'
        sendingMode:
          $ref: '#/components/schemas/SendingMode'
        starred:
          type: boolean
          description: Urgent flag.
          default: false
        subject:
          type: string
          description: Envelope subject.
        sysGenerator:
          type: string
          description: External system identifying code DMS configured in GoSign.
          default: SB3
        useType:
          $ref: '#/components/schemas/EnvelopeUseType'
        type:
          $ref: '#/components/schemas/EnvelopeType'
        loadedFor:
          type: string
          description: External ID of loader secretary user. Filling in this field you can load an envelope on behalf of another secretary
    NewUserInProcess:
