          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEnvelope422OperationOutcomeCode'
              example:
                code: LOCKED_ENVELOPE
                message: Cannot get a user locked envelope
                timestamp: '2024-01-17T15:26:02.017Z'
                correlationId: 3c9c8ad2-50f6-41de-9d3f-4a61e6efc66b
        '500':
          description: An unexpected server error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicOperationOutcome'
              example:
                message: Unexpected error
                timestamp: '2024-01-17T15:26:02.017Z'
                correlationId: 3c9c8ad2-50f6-41de-9d3f-4a61e6efc66b
      security:
      - oAuth2:
        - openid
      x-operation-id-source: normalized
      x-operation-id-original: cancelEnvelope
    servers:
    - url: https://corporate-be.infocertsign.com:{port}/be/api/v5r1/m2m
      description: Corporate production API server
  /envelopes/{externalId}/resend:
    get:
      tags:
      - Envelopes
      summary: Resend notification
      description: Sends a reminder notification to all pending signers who have not yet completed their signature.
      operationId: resendEnvelope
      parameters:
      - in: path
        name: externalId
        description: External id of the envelope
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Reminder notifications successfully sent to all pending signers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicOperationOutcome'
              example:
                timestamp: '2024-01-14T22:12:43.128Z'
                correlationId: 9d29ba40-f714-4105-8550-a23babf0ca5f
        '401':
          $ref: '#/components/responses/401_oauth_error'
        '404':
          description: Envelope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicOperationOutcome'
              example:
                timestamp: '2024-01-17T15:26:02.017Z'
                correlationId: 26e08b6c-5eda-4769-a068-bdfbd3204237
        '500':
          description: An unexpected server error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicOperationOutcome'
              example:
                message: Unexpected error
                timestamp: '2024-01-17T15:26:02.017Z'
                correlationId: 3c9c8ad2-50f6-41de-9d3f-4a61e6efc66b
      security:
      - oAuth2:
        - openid
    servers:
    - url: https://corporate-be.infocertsign.com:{port}/be/api/v5r1/m2m
      description: Corporate production API server
  /envelopes/{extId}:
    get:
      tags:
      - Envelopes
      summary: Get envelope content, except document content
      operationId: getEnvelopeUsingGET
      parameters:
      - name: extId
        in: path
        description: Identifier of the envelope whose content has to be retrieved
        required: true
        schema:
          type: string
      responses:
        200:
          description: A JSON object containing Envelope or error information
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Envelope_3'
                - $ref: '#/components/schemas/ReturnStatus'
      x-codegen-request-body-name: request
      security:
      - oAuth2:
        - openid
    servers:
    - url: https://corporate-be.infocertsign.com:{port}/be/api/v5r0/m2m
  /envelopes/{extId}/delete:
    post:
      tags:
      - Envelopes
      summary: Delete envelope
      operationId: deleteEnvelopeUsingDELETE
      parameters:
      - name: extId
        in: path
        description: Identifier of the envelope to delete
        required: true
        schema:
          type: string
      responses:
        200:
          description: A JSON object containing delete Envelope result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnStatus'
      security:
      - oAuth2:
        - openid
    servers:
    - url: https://corporate-be.infocertsign.com:{port}/be/api/v5r0/m2m
  /envelopes/{extId}/status:
    get:
      tags:
      - Envelopes
      summary: Get envelope status
      operationId: getEnvelopeStatusUsingGET
      parameters:
      - name: extId
        in: path
        description: Identifier of envelope whose status has to be retrieved
        required: true
        schema:
          type: string
      responses:
        200:
          description: A JSON object containing EnvelopeStatus or error information
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EnvelopeStatus'
                - $ref: '#/components/schemas/ReturnStatus'
      security:
      - oAuth2:
        - openid
    servers:
    - url: https://corporate-be.infocertsign.com:{port}/be/api/v5r0/m2m
  /envelopes/{extId}/withDocuments:
    get:
      tags:
      - Envelopes
      summary: Get full envelope content, including document content
      operationId: getEnvelopeWithDocumentsUsingGET
      parameters:
      - name: extId
        in: path
        description: Identifier of envelope whose content has to be retrieved
        required: true
        schema:
          type: string
      responses:
        200:
          description: A JSON object containing Envelope or error information
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Envelope_3'
                - $ref: '#/components/schemas/ReturnStatus'
      x-codegen-request-body-name: request
      security:
      - oAuth2:
        - openid
    servers:
    - url: https://corporate-be.infocertsign.com:{port}/be/api/v5r0/m2m
components:
  schemas:
    DocumentActionDefType:
      type: string
      enum:
      - SIGN
      - APPROVE
      - VIEW
      - INITIALS
      - PROTOCOL
      - FREE_TEXT
      - APPROVAL_DATE
      - FIRST_NAME
      - LAST_NAME
      - CHECKBOX
      - RADIOBUTTON
      - FULL_NAME
      - OTHER_DETAILS
      - GRAPHOMETRIC
      - AUTOMATIC_SIGNATURE
      - SEAL
      description: Type of affixing - 'SIGN' signature, 'APPROVE' approval, 'VIEW' visa, 'INITIALS' initials, 'GRAPHOMETRIC' graphometric, 'AUTOMATIC_SIGNATURE' automatic signature apposition
    NewUserStrategy:
      type: string
      description: user insert strategy; required only if add new user in envelope process
      enum:
      - REJECT_ALWAYS
      - REJECT_IF_DIFFERENT
      - ACCEPT_ALWAYS
      - EMAIL_BASED
      - USERNAME_BASED
    DocumentActionDef:
      title: DocumentActionDef
      type: object
      properties:
        appearance:
          $ref: '#/components/schemas/DocumentActionAppearance'
        confString:
          type: string
          description: String json containing approved action flags, text and signature visibility configurations.
        docExternalId:
          type: string
          description: External document identifier.
        mandatory:
          type: boolean
          description: Defines mandatory action; always true except graphometric signature (internal use).
          default: true
        type:
          $ref: '#/components/schemas/DocumentActionDefType'
    ProcessTaskDefType:
      type: string
      enum:
      - HUB
      - HUMAN
      - EXTERNAL
      - THIRD_PARTY
      - AUTO
      - SUBPROCESS
      description: Task type - 'HUMAN' is the most common (requires human intervention for a variety of actions, such as sign, initials, approval, read).
    ProtocolRegistry:
      title: ProtocolRegistry
      type: object
      description: Protocol Registry
      properties:
        code:
          type: string
          description: Protocol code
        title:
          type: string
          description: title protocol
    TaskAuthorization:
      title: TaskAuthorization
      description: If this field is filled in you can specify an acces code on this task
      type: object
      properties:
        pin:
          type: string
          description: Authorization pin
          example: '123456'
        email:
          type: string
          description: User email
          example: john@doe.com
        phoneNumber:
          type: string
          description: User telephone number
          example: '+393273333333333'
        authorizationType:
          $ref: '#/components/schemas/TaskAuthorizationType'
    UserMessage:
      title: UserMessage
      type: object
      description: an object describing a user-specific message
      properties:
        text:
          type: string
          description: the user-specific message
        userExtId:
          type: string
          description: the external identifier of the user receiving a tailored message
    SendMailRecipient:
      title: SendMailRecipient
      type: object
      properties:
        typeRecipient:
          type: string
          description: Type recipeint TO or CC
        userExternalId:
          type: string
          description: user external id
        email:
          type: string
          description: email
        user:
          $ref: '#/components/schemas/User'
    SendMailMessage:
      title: SendMailMessage
      type: object
      properties:
        emailTemplateCode:
          type: string
          description: template code
        subject:
          type: string
          description: subject email
        bodyMail:
          type: string
          description: body email
        sendMailDocumentList:
          type: array
          items:
            $ref: '#/components/schemas/SendMailDocument'
        sendMailRecipientList:
          type: array
          items:
            $ref: '#/components/schemas/SendMailRecipient'
    ProcessTaskDef:
      title: ProcessTaskDef
      type: object
      properties:
        action:
          $ref: '#/components/schemas/Action'
        actionDefs:
          type: array
          description: Signature actions definition.
          items:
            $ref: '#/components/schemas/DocumentActionDef'
        actorExpr:
          type: string
          description: Actors that compose the process identified by extId + U and separated by pipe. (Eg. aaa123bbbU|ccc456dddU).
        howMany:
          type: integer
          format: int32
          description: Number of actors needed to close the task, default 1. May be 1, 2, 3, or 4.
        order:
          type: integer
          format: int32
          description: Number that determines the parallelism of the task.
        type:
          $ref: '#/components/schemas/ProcessTaskDefType'
        taskAuth:
          $ref: '#/components/schemas/TaskAuthorization'
        taskAttachements:
          type: array
          description: Task Attachments
          items:
            $ref: '#/components/schemas/TaskAttachement'
        sendMailMessage:
          $ref: '#/components/schemas/SendMailMessage'
        protocolRegistry:
          $ref: '#/components/schemas/ProtocolRegistry'
        confString:
          type: string
          description: json string to configure ProcessTaskDef
        signatureType:
          $ref: '#/components/schemas/TaskActionType'
        visibilityRestrictionDocuments:
          type: array
          description: List of document external ids whose visibility is limited to this task
          items:
            type: string
        forceTimestamp:
          type: boolean
          description: Force the timestamp for the task. If not specified, its value is 'false'
          default: false
    TaskAttachementType:
      type: string
      enum:
      - TASK_ATTACHEMENT_REQUEST
      - TASK_ATTACHEMENT_UPLOAD
      example: TASK_ATTACHEMENT_REQUEST
      description: "Task fields definition\n  * TASK_ATTACHEMENT_REQUEST - Task attachement defined by secretary user\n  * TASK_ATTACHEMENT_UPLOAD  Task attachement used by manager user\n"
    CancelEnvelope422OperationOutcomeCode:
      type: string
      enum:
      - ENVELOPE_ALREADY_CANCELLED
      - LOCKED_ENVELOPE
      - CUSTOMER_NOT_FOUND
      - ENVELOPE_ALREADY_WORKED
      - ILLEGAL_ENVELOPE_STATE_TRANSITION
