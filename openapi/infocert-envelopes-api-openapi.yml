      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          newUserStrategy:
            $ref: '#/components/schemas/NewUserStrategy'
    UserRole:
      type: string
      enum:
      - MANAGER
      - SECRETARY
      - STRANGER
    TaskAttachement:
