      - $ref: '#/components/schemas/BasicOperationOutcome'
      - type: object
        properties:
          code:
            type: string
            enum:
            - MISSING_CANCEL_NOTE
        required:
        - timestamp
        - correlationId
        - message
        - code
    DocumentClass:
      title: DocumentClass
