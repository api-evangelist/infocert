openapi: 3.2.0
info:
  title: Infocert Envelopes API
  version: '1.0'
  description: 'Operations tagged Envelopes across 11 of this provider''s published API definitions: infocert-gosign-ext-5-1-openapi.yml, infocert-gosign-work-notifications-openapi.yml, infocert-infocert-sign-ext-5-1-openapi.yml, infocert-infocert-sign-other-services-openapi.yml, infocert-gosign-ext-5-1-openapi.yml, infocert-gosign-ext-5r1-openapi.yml, infocert-gosign-work-notifications-openapi.yml, infocert-gosign4-work-notifications-openapi.yml, infocert-infocert-sign-ext-5-1-openapi.yml, infocert-infocert-sign-other-services-openapi.yml, infocert-infocert-sign-work-notifications-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://gosign-be.infocert.it/gosign/api/v5r1
  description: Corporate production API server
- url: https://my.example.com/
- url: https://corporate-be.infocertsign.com:{port}/be/api/v5r1/m2m
  description: Corporate production API server
- url: https://corporate-be.infocertsign.com:{port}/be/api/v5r0/m2m
- url: https://gosign.infocert.it/api/v5r1
basePath: /identification/afm/v1
tags:
- name: Envelopes
paths:
  /m2m/envelopes:
    post:
      tags:
      - Envelopes
      summary: Insert a new Envelope in GoSign
      description: Used to create new Envelope
      operationId: insertEnvelope
      requestBody:
        description: request
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body:
                  type: object
                  description: Body is a string containing a json based on Envelope model. You can find the full Envelope model details in the Schema section
                  properties:
                    envelope:
                      $ref: '#/components/schemas/Envelope'
                    responseWithEnvelope:
                      type: boolean
                    usersInCC:
                      type: array
                      items:
                        $ref: '#/components/schemas/UserInCC'
                my_doc_externalId:
                  type: string
                  format: binary
                  description: Unique identification code for the documents within the GoSign envelope. This is a string that contains an array of bytes of the file to be uploaded. Within the body, there is an array of documents, where each document contains an 'externalID' field (if the array is not empty and an externalID is present, its value must match 'my_doc_externalID').
        required: true
      responses:
        '200':
          description: A JSON object containing Envelope or error information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnStatus'
      x-codegen-request-body-name: request
      security:
      - oAuth2:
        - openid
    servers:
    - url: https://gosign-be.infocert.it/gosign/api/v5r1
      description: Corporate production API server
  /m2m/envelopes/{externalId}/cancel:
    put:
      tags:
      - Envelopes
      summary: Cancel an Envelope (i.e. stops the process)
      description: 'Puts the envelope in the stopped state: users can no longer sign the envelope but it is still visible'
      operationId: cancelEnvelope
      parameters:
      - in: path
        name: externalId
        description: External id of the envelope
        required: true
        schema:
          type: string
      requestBody:
        description: request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelEnvelopeNote'
      responses:
        '200':
          description: The envelope is successfully cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicOperationOutcome'
              example:
                timestamp: '2024-01-14T22:12:43.128Z'
                correlationId: 9d29ba40-f714-4105-8550-a23babf0ca5f
        '401':
          $ref: '#/components/responses/401_oauth_error'
        '400':
          description: Malformed parameters or bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEnvelope400OperationOutcome'
              example:
                code: MISSING_CANCEL_NOTE
                message: Cancel note is required
                timestamp: '2024-01-14T22:12:43.128Z'
                correlationId: 9d29ba40-f714-4105-8550-a23babf0ca5f
        '404':
          description: Envelope not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicOperationOutcome'
              example:
                timestamp: '2024-01-17T15:26:02.017Z'
                correlationId: 26e08b6c-5eda-4769-a068-bdfbd3204237
        '422':
          description: An error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEnvelope422OperationOutcomeCode'
              example:
                code: LOCKED_ENVELOPE
                message: Cannot get a user locked envelope
                timestamp: '2024-01-17T15:26:02.017Z'
                correlationId: 3c9c8ad2-50f6-41de-9d3f-4a61e6efc66b
        '500':
          description: An unexpected server error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicOperationOutcome'
              example:
                message: Unexpected error
                timestamp: '2024-01-17T15:26:02.017Z'
                correlationId: 3c9c8ad2-50f6-41de-9d3f-4a61e6efc66b
      security:
      - oAuth2:
        - openid
    servers:
    - url: https://gosign-be.infocert.it/gosign/api/v5r1
      description: Corporate production API server
  /envelopes/{enveExtId}/notify:
    post:
      summary: Request of send notification of working of an envelope
      description: Used to send a working notification for an envelope.
      parameters:
      - name: enveExtId
        in: path
        required: true
        schema:
          type: string
          description: Unique identification code of the envelope within GoSign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendNotificationRequest'
      responses:
        '200':
          description: Notification attempt completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sendNotificationResponse'
        default:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome:
                    type: string
                    description: value is not important
                  message:
                    type: string
                    description: value is not important
      tags:
      - Envelopes
      operationId: postEnvelopesByEnveExtIdNotify
      x-operation-id-source: derived
    servers:
    - url: https://my.example.com/
  /envelopes/{enveExtId}/notifyStatusChanged:
    post:
      summary: Request of send notification of change status of an envelope
      description: Used to send a change status notification for an envelope.
      parameters:
      - name: enveExtId
        in: path
        required: true
        schema:
          type: string
          description: Unique identification code of the envelope within GoSign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendChangeStatusRequest'
      responses:
        '200':
          description: Notification attempt completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sendStoreNotificationResponse'
        default:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: value is not important
      tags:
      - Envelopes
      operationId: postEnvelopesByEnveExtIdNotifyStatusChanged
      x-operation-id-source: derived
    servers:
    - url: https://my.example.com/
  /envelopes/{enveExtId}/managers/{userExtId}/status:
    get:
      summary: Request of envelope workability by an user
      description: Used to know if an envelope is workable by an user
      parameters:
      - name: enveExtId
        in: path
        required: true
        schema:
          type: string
          description: Unique identification code of the envelope within GoSign on which the verification of workability is required.
      - name: userExtId
        in: path
        required: true
        schema:
          type: string
          description: Unique identification code of the user within GoSign for which verification of envelope workability is required
      responses:
        '200':
          description: Request is ok
          content:
            application/json:
              schema:
                type: object
                required:
                - workable
                properties:
                  workable:
                    type: boolean
                    description: Server response. If true the envelope is workable by the user
                  reason:
                    type: string
                    description: A descriptive reason provided if workable is false
                  action:
                    type: string
                    description: Action to be performed on the envelopes indicated in the request when workable is set to false. When NOP no operation will be made, when DELETE envelope will be automatically deleted
                    enum:
                    - NOP
                    - DELETE
        default:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  workable:
                    type: boolean
                    description: value is not important
      tags:
      - Envelopes
      operationId: getEnvelopesByEnveExtIdManagersByUserExtIdStatus
      x-operation-id-source: derived
    servers:
    - url: https://my.example.com/
  /envelopes/{enveExtId}/managers/{userExtId}/for/{originalUserExtId}/status:
    get:
      summary: Request of envelope workability by a user substituted
      description: Used to know if an envelope is workable by an user substituted
      parameters:
      - name: enveExtId
        in: path
        required: true
        schema:
          type: string
          description: Unique identification code of the envelope within GoSign on which the verification of workability is required.
      - name: userExtId
        in: path
        required: true
        schema:
          type: string
          description: Unique identification code of the substitute user within GoSign for which verification of envelope workability is required
      - name: originalUserExtId
        in: path
        required: true
        schema:
          type: string
          description: Unique identification code of the user substituted within GoSign for which verification of envelope workability is required
      responses:
        '200':
          description: Request is ok
          content:
            application/json:
              schema:
                type: object
                required:
                - workable
                properties:
                  workable:
                    type: boolean
                    description: Server response. If true the envelope is workable by the user
        default:
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  workable:
                    type: boolean
                    description: value is not important
      tags:
      - Envelopes
      operationId: getEnvelopesByEnveExtIdManagersByUserExtIdForByOriginalUserExtIdStatus
      x-operation-id-source: derived
    servers:
    - url: https://my.example.com/
  /envelopes:
    post:
      tags:
      - Envelopes
      summary: Insert a new Envelope in Infocert Sign
      description: Used to create new Envelope
      operationId: postEnvelopes
      requestBody:
        description: request
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                body:
                  type: object
                  description: Body is a string containing a json based on Envelope model. You can find the full Envelope model details in the Schema section
                  properties:
                    envelope:
                      $ref: '#/components/schemas/Envelope_2'
                    responseWithEnvelope:
                      type: boolean
                    usersInCC:
                      type: array
                      items:
                        $ref: '#/components/schemas/UserInCC'
                my_doc_externalId:
                  type: string
                  format: binary
                  description: Unique identification code for the documents within the Infocert Sign envelope. This is a string that contains an array of bytes of the file to be uploaded. Within the body, there is an array of documents, where each document contains an 'externalID' field (if the array is not empty and an externalID is present, its value must match 'my_doc_externalID').
        required: true
      responses:
        '200':
          description: A JSON object containing Envelope or error information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnStatus'
      x-codegen-request-body-name: request
      security:
      - oAuth2:
        - openid
      x-operation-id-source: normalized
      x-operation-id-original: insertEnvelope
    servers:
    - url: https://corporate-be.infocertsign.com:{port}/be/api/v5r1/m2m
      description: Corporate production API server
