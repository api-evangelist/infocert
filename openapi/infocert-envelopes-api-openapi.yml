          type: string
          description: Attachement section name setted by envelope sender.
        content:
          $ref: '#/components/schemas/documentContent'
    actionResume:
      type: object
      description: Counter of the worked and not worked actions
      required:
      - actions
      - signActions
      - approveActions
      - viewActions
      - viewedActions
      - approvedActions
      - initialsActions
      - initialedActions
      - signedActions
      - confirmedActions
      - graphometricActions
      - filledGraphometricActions
      properties:
        actions:
          type: integer
          description: Total number of actions presents
        signActions:
          type: integer
          description: total number of sign actions not worked yet
        approveActions:
          type: integer
          description: total number of approve actions not worked yet
        viewActions:
          type: integer
          description: total number of view actions not worked yet
        approvedActions:
          type: integer
          description: total number of worked approve actions
        initialsActions:
          type: integer
          description: total number of initials actions not worked yet
        initialedActions:
          type: integer
          description: total number of worked initials actions
        signedActions:
          type: integer
          description: total number of worked sign actions
        confirmedActions:
          type: integer
          description: total number of worked actions presents
        graphometricActions:
          type: integer
          description: total number of graphometric actions not worked yet
        filledGraphometricActions:
          type: integer
          description: total number of worked graphometric actions
    document:
      type: object
      required:
