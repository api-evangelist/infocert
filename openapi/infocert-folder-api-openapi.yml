openapi: 3.2.0
info:
  title: Infocert Folder API
  version: '1.0'
  description: 'Operations tagged Folder across 4 of this provider''s published API definitions: infocert-legalmail-business-mailboxes-openapi.yml, infocert-legalmail-business-openapi.yml, infocert-legalmail-business-mailboxes-openapi.yml, infocert-legalmail-business-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://mtlsapi.infocert.digital/api/v2/mailboxes
  description: Production
- url: https://mtlsapitest.infocert.digital/api/v2/mailboxes
  description: Development
- url: https://mtlsapistage.infocert.digital/api/v2/mailboxes
  description: Staging
- url: https://mtlsapi.infocert.digital/api/v1
- url: https://mtlsapistage.infocert.digital/api/v1
basePath: /identification/afm/v1
tags:
- name: Folder
paths:
  /{mailboxId}/folders:
    get:
      tags:
      - Folder
      summary: listFolders
      description: 'List folders in a given mailbox.


        ### Concurrent requests

        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,

        requests are queued. The mailbox is indeed locked, when another operation is in progress.


        Concurrent requests are beneficial, when they refer to distinct mailboxes.'
      operationId: listFolders
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/mailboxId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFolderResult'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          $ref: '#/components/responses/MailboxNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        default:
          $ref: '#/components/responses/Error'
      security:
      - busapiv2_mailboxes_oauth2: []
    post:
      tags:
      - Folder
      summary: createFolder
      description: 'Create a new folder.


        Access to this endpoint requires the "busapiv2-mailboxes:org-msg" token scope.


        ### Concurrent requests

        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,

        requests are queued. The mailbox is indeed locked, when another operation is in progress.


        Concurrent requests are beneficial, when they refer to distinct mailboxes.'
      operationId: createFolder
      security:
      - busapiv2_mailboxes_oauth2:
        - busapiv2-mailboxes:org-msg
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/mailboxId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFolder'
      responses:
        '200':
          description: Folder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '422':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FolderNameShouldNotContainSeparatorException:
                  $ref: '#/components/examples/FolderNameShouldNotContainSeparatorException'
                FolderCannotBeCreatedException:
                  $ref: '#/components/examples/FolderCannotBeCreatedException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                ParentFolderNotFoundException:
                  $ref: '#/components/examples/ParentFolderNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://mtlsapi.infocert.digital/api/v2/mailboxes
      description: Production
    - url: https://mtlsapitest.infocert.digital/api/v2/mailboxes
      description: Development
    - url: https://mtlsapistage.infocert.digital/api/v2/mailboxes
      description: Staging
  /{mailboxId}/folders/{folderId}:
    get:
      tags:
      - Folder
      summary: getFolder
      description: 'Show the details of the folder.


        ### Concurrent requests

        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,

        requests are queued. The mailbox is indeed locked, when another operation is in progress.


        Concurrent requests are beneficial, when they refer to distinct mailboxes.'
      operationId: getFolder
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/mailboxId'
      - $ref: '#/components/parameters/folderId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        default:
          $ref: '#/components/responses/Error'
      security:
      - busapiv2_mailboxes_oauth2: []
    delete:
      tags:
      - Folder
      summary: deleteFolder
      description: 'Delete the folder, with any message and subfolder in it.


        Access to this endpoint requires the "busapiv2-mailboxes:org-msg" token scope.


        ### Concurrent requests

        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,

        requests are queued. The mailbox is indeed locked, when another operation is in progress.


        Concurrent requests are beneficial, when they refer to distinct mailboxes.'
      operationId: deleteFolder
      security:
      - busapiv2_mailboxes_oauth2:
        - busapiv2-mailboxes:org-msg
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/mailboxId'
      - $ref: '#/components/parameters/folderId'
      responses:
        '204':
          description: Folder deleted.
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '422':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FolderCannotBeDeletedException:
                  $ref: '#/components/examples/FolderCannotBeDeletedException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Folder
      summary: renameFolder, rename or move the folder
      description: 'Rename or move the folder.


        Access to this endpoint requires the "busapiv2-mailboxes:org-msg" token scope.


        ### Concurrent requests

        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,

        requests are queued. The mailbox is indeed locked, when another operation is in progress.


        Concurrent requests are beneficial, when they refer to distinct mailboxes.'
      operationId: renameFolder
      security:
      - busapiv2_mailboxes_oauth2:
        - busapiv2-mailboxes:org-msg
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/mailboxId'
      - $ref: '#/components/parameters/folderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFolder'
      responses:
        '200':
          description: Folder renamed or moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                ParentFolderNotFoundException:
                  $ref: '#/components/examples/ParentFolderNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '409':
          description: Renaming to an existing folder
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                RenamingToAnExistingFolderException:
                  $ref: '#/components/examples/RenamingToAnExistingFolderException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '422':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                FolderNameShouldNotContainSeparatorException:
                  $ref: '#/components/examples/FolderNameShouldNotContainSeparatorException'
                FolderCannotBeRenamedException:
                  $ref: '#/components/examples/FolderCannotBeRenamedException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        default:
          $ref: '#/components/responses/Error'
    servers:
    - url: https://mtlsapi.infocert.digital/api/v2/mailboxes
      description: Production
    - url: https://mtlsapitest.infocert.digital/api/v2/mailboxes
      description: Development
    - url: https://mtlsapistage.infocert.digital/api/v2/mailboxes
      description: Staging
  /{mailboxId}/folders/{folderId}/messages/{messageUIdValidity}:
    get:
      tags:
      - Folder
      summary: listMessages
      description: 'List messages in a given folder, with REM-ready data.


        You can filter the result to include only messages newer than a specific message by using the fromMessageUId parameter.


        Messages are listed in ascending order, starting from the oldest.


        ### Efficient reconciliation of single-recipient messages


        In case a message is sent *to a single recipient*, reconciliation can be achieved by just listing messages.

        The listMessages endpoint provides all the relevant information, since there''s no ambiguity between the sent message

        and the associated receipts.


        In case of multiple recipients, the number of receipts grows, as, in general, more than one consignment receipt can be

        generated for every recipient. In case of two consignment receipts listed for the same sent message, it is not possible

        to identify the original recipient that originated the receipt by the listMessages endpoint. The caller must then examine

        the single receipts by the getMessage endpoint, to obtain this information.


        ### Concurrent requests

        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,

        requests are queued. The mailbox is indeed locked, when another operation is in progress.


        Concurrent requests are beneficial, when they refer to distinct mailboxes.'
      operationId: listMessages
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/messageIdentifierEquals'
      - $ref: '#/components/parameters/uaMessageIdentifierEquals'
      - $ref: '#/components/parameters/mailboxId'
      - $ref: '#/components/parameters/folderId'
      - $ref: '#/components/parameters/messageUIdValidity'
      - in: query
        name: fromMessageUId
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
        required: false
        description: List messages starting from this uId, excluded.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessageResult'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
                MessageUIDValidityNotFoundException:
                  $ref: '#/components/examples/MessageUIDValidityNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        '470':
          $ref: '#/components/responses/MessageRemovedWhileListingException'
        '520':
          $ref: '#/components/responses/ParsingException'
        default:
          $ref: '#/components/responses/Error'
      security:
      - busapiv2_mailboxes_oauth2: []
    delete:
      tags:
      - Folder
      summary: deleteMessages
      description: 'Delete multiple messages.


        There are two modes of operation, mutually exclusive:

        - LIST mode, that uses messageUIdList: delete messages by listing their uId;

        - RANGE mode, that uses fromMessageUId and toMessageUId: delete messages in the range

        [fromMessageUId, toMessageUId], both included.


        ### Concurrent requests

        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,

        requests are queued. The mailbox is indeed locked, when another operation is in progress.


        Concurrent requests are beneficial, when they refer to distinct mailboxes.'
      operationId: deleteMessages
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/mailboxId'
      - $ref: '#/components/parameters/folderId'
      - $ref: '#/components/parameters/messageUIdValidity'
      - in: query
        name: mode
        description: The mode of operation
        schema:
          type: string
          enum:
          - LIST
          - RANGE
        required: true
      - in: query
        name: messageUIdList
        schema:
          type: string
          example: 1001,1002,1003
          maxLength: 1000
        required: false
        description: messageUIds to delete, comma-separated.
      - in: query
        name: fromMessageUId
        schema:
          type: integer
          format: int64
          minimum: 1
        required: false
        description: Delete messages starting from this UId, included.
      - in: query
        name: toMessageUId
        schema:
          type: integer
          format: int64
          minimum: 1
        required: false
        description: Delete messages up to this UId, included.
      responses:
        '204':
          description: OK
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
                MessageUIDValidityNotFoundException:
                  $ref: '#/components/examples/MessageUIDValidityNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        default:
          $ref: '#/components/responses/Error'
      security:
      - busapiv2_mailboxes_oauth2: []
    servers:
    - url: https://mtlsapi.infocert.digital/api/v2/mailboxes
      description: Production
    - url: https://mtlsapitest.infocert.digital/api/v2/mailboxes
      description: Development
    - url: https://mtlsapistage.infocert.digital/api/v2/mailboxes
      description: Staging
  /{mailboxId}/folders/{folderId}/messages/{messageUIdValidity}/mime:
    get:
      tags:
      - Folder
      summary: listMessagesMIME
      description: 'List messages in a given folder, with MIME data.


        You can filter the result to include only messages newer than a specific message by using the fromMessageUId parameter.


        Messages are listed in ascending order, starting from the oldest.


        ### Efficient reconciliation of single-recipient messages


        In case a message is sent *to a single recipient*, reconciliation can be achieved by just listing messages.

        The listMessagesMIME endpoint provides all the relevant information, since there''s no ambiguity between the sent message

        and the associated receipts.


        In case of multiple recipients, the number of receipts grows, as, in general, more than one consignment receipt can be

        generated for every recipient. In case of two consignment receipts listed for the same sent message, it is not possible

        to identify the original recipient that originated the receipt by the listMessagesMIME endpoint. The caller must then examine

        the single receipts by the getMessageMIME endpoint, to obtain this information.


        ### Concurrent requests

        There is no benefit in sending concurrent requests for the same mailbox: when referring to the same mailbox,

        requests are queued. The mailbox is indeed locked, when another operation is in progress.


        Concurrent requests are beneficial, when they refer to distinct mailboxes.'
      operationId: listMessagesMIME
      parameters:
      - $ref: '#/components/parameters/correlationId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/messageIdentifierEquals'
      - $ref: '#/components/parameters/uaMessageIdentifierEquals'
      - $ref: '#/components/parameters/mailboxId'
      - $ref: '#/components/parameters/folderId'
      - $ref: '#/components/parameters/messageUIdValidity'
      - in: query
        name: fromMessageUId
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
        required: false
        description: List messages starting from this uId, excluded. Use 0 to list all messages.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessageResultMIME'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                MailboxNotFoundException:
                  $ref: '#/components/examples/MailboxNotFoundException'
                FolderNotFoundException:
                  $ref: '#/components/examples/FolderNotFoundException'
                MessageNotFoundException:
                  $ref: '#/components/examples/MessageNotFoundException'
                MessageUIDValidityNotFoundException:
                  $ref: '#/components/examples/MessageUIDValidityNotFoundException'
          headers:
            X-Correlation-ID:
              schema:
                type: string
              required: true
        '429':
          $ref: '#/components/responses/TooManyRequestsException'
        '470':
          $ref: '#/components/responses/MessageRemovedWhileListingException'
        '520':
          $ref: '#/components/responses/ParsingException'
        default:
          $ref: '#/components/responses/Error'
      security:
      - busapiv2_mailboxes_oauth2: []
    servers:
    - url: https://mtlsapi.infocert.digital/api/v2/mailboxes
      description: Production
    - url: https://mtlsapitest.infocert.digital/api/v2/mailboxes
      description: Development
    - url: https://mtlsapistage.infocert.digital/api/v2/mailboxes
      description: Staging
  /mailboxes/{mailboxId}/folders:
    get:
      tags:
      - Folder
      summary: List all folders of a given mailbox
      operationId: getMailboxesByMailboxIdFolders
      parameters:
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/page_2'
      - $ref: '#/components/parameters/pageSize_2'
      - $ref: '#/components/parameters/mailboxId_2'
      responses:
        '200':
          description: List of folders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedFolderResult_2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-operation-id-source: normalized
      x-operation-id-original: listFolders
    servers:
    - url: https://mtlsapi.infocert.digital/api/v1
    - url: https://mtlsapistage.infocert.digital/api/v1
  /mailboxes/{mailboxId}/folders/{folderId}/messages:
    get:
      tags:
      - Folder
      summary: List all messages of a given folder
      operationId: listMessagesInFolder
      parameters:
      - $ref: '#/components/parameters/companyId'
      - $ref: '#/components/parameters/page_2'
      - $ref: '#/components/parameters/pageSize_2'
      - $ref: '#/components/parameters/mailboxId_2'
      - $ref: '#/components/parameters/folderId_2'
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMessageResult_2'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    servers:
    - url: https://mtlsapi.infocert.digital/api/v1
    - url: https://mtlsapistage.infocert.digital/api/v1
components:
  schemas:
    MailboxId:
      type: string
      minLength: 1
      example: U45897
    MessageListItem:
      properties:
        messageUId:
          type: integer
          format: int64
        itemType:
          type: string
          enum:
          - ERDSReceipt
          - ERDSDispatch
          - OtherMessage
        messageIdentifier:
          $ref: '#/components/schemas/MessageIdentifier'
        UAMessageIdentifier:
          $ref: '#/components/schemas/UAMessageIdentifier'
        ERDSEventId:
          $ref: '#/components/schemas/ERDSEventId'
        ERDSType:
          $ref: '#/components/schemas/ERDSType'
        approximateByteSize:
          type: integer
          minimum: 0
        seen:
          type: boolean
        receivedOn:
          $ref: '#/components/schemas/ISO8601Date'
      required:
      - messageUId
      - itemType
      - messageIdentifier
      - UAMessageIdentifier
      - ERDSEventId
      - approximateByteSize
      - seen
    MessageUIdValidity:
      type: integer
      format: int64
      minimum: 0
      example: 35488987
    FolderId:
      type: string
      x-extra-annotation: '@jakarta.validation.constraints.NotBlank'
      maxLength: 254
      example: INBOX
    ERDSType:
      type: string
      enum:
      - PEC
      - REM
    PagedResult:
      properties:
        size:
          description: Size of this page; less or equal to page size.
          type: integer
        totalSize:
          description: Total size of the result set.
          type: integer
        pageSize:
          description: Page size.
          type: integer
          minimum: 1
          maximum: 1000
        page:
          description: Page number.
          type: integer
          minimum: 1
      required:
      - size
      - totalSize
      - pageSize
      - page
    FolderListItem:
      properties:
        folderId:
          $ref: '#/components/schemas/FolderId'
        name:
          type: string
          example: INBOX
        messageUIdValidity:
          $ref: '#/components/schemas/MessageUIdValidity'
        parentId:
          type: string
          example: ''
      required:
      - id
      - name
      - messageUIdValidity
      - parentId
    PagedMessageResultMIME:
      allOf:
      - $ref: '#/components/schemas/PagedResult'
      - type: object
        properties:
          mailboxId:
            $ref: '#/components/schemas/MailboxId'
          folderId:
            $ref: '#/components/schemas/FolderId'
          messageUIdValidity:
            $ref: '#/components/schemas/MessageUIdValidity'
          items:
            type: array
            items:
              $ref: '#/components/schemas/MessageListItemMIME'
        required:
        - mailboxId
        - folderId
        - messageUIdValidity
        - items
    Folder:
      properties:
        mailboxId:
          $ref: '#/components/schemas/MailboxId'
        id:
          type: string
          example: INBOX
          description: The identifier of the folder in this API.
        name:
          type: string
          example: INBOX
        messageUIdValidity:
          $ref: '#/components/schemas/MessageUIdValidity'
        parentId:
          type: string
          example: ''
        childIds:
          type: array
          items:
            type: string
          example:
          - INBOX/Draft
          - INBOX/Sent
      required:
      - mailboxId
      - id
      - name
      - messageUIdValidity
      - parentId
      - childIds
    NewFolder:
      properties:
        name:
          x-extra-annotation: '@jakarta.validation.constraints.NotBlank'
          type: string
          minLength: 1
          maxLength: 63
          example: INBOX
        parentId:
          minLength: 0
          maxLength: 254
          type: string
          example: ''
      required:
      - name
      - parentId
    PagedFolderResult:
      allOf:
      - $ref: '#/components/schemas/PagedResult'
      - type: object
        properties:
          mailboxId:
            $ref: '#/components/schemas/MailboxId'
          items:
            type: array
            items:
              $ref: '#/components/schemas/FolderListItem'
        required:
        - items
    MessageListItemMIME:
      properties:
