openapi: 3.2.0
info:
  title: Infocert Invoice API
  version: 1.0.4
  license:
    name: Infocert
  description: 'Operations tagged invoice across 2 of this provider''s published API definitions: infocert-legalinvoice-openapi.yml, infocert-legalinvoice-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.infocert.digital/einvoicing/sdigate/v1
basePath: /identification/afm/v1
security:
- apiKey: []
tags:
- name: Invoice
paths:
  /documents/invoices:
    post:
      summary: Create a new invoice and start to process it
      tags:
      - Invoice
      parameters:
      - in: query
        name: process
        description: 'When `true` or unspecified, immediately start to process the newly created invoice. When `false` the invoice is created but its processing has to be  explicitly started.

          '
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: 'The resource has been successfully and correctly created.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/requestId'
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri: https://lbhublicoll.infocert.it/lbhublint/rest/documents/invoices
        responses:
          default:
            statusCode: '200'
        requestParameters:
          integration.request.querystring.process: method.request.querystring.process
          integration.request.header.Authorization: '''Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='''
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: http_proxy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestInvoice'
        description: 'The invoice to be created.

          '
        required: true
      operationId: postDocumentsInvoices
      x-operation-id-source: derived
    servers:
    - url: https://api.infocert.digital/einvoicing/sdigate/v1
  /documents/invoices/passive/{invoiceId}/autofattura:
    post:
      summary: Create an autofattura
      description: '"InvoiceId is accepted as identification code."'
      tags:
      - Invoice
      parameters:
      - $ref: '#/components/parameters/invoiceId'
      responses:
        '200':
          description: 'The process was correctly started.

            '
        '400':
          $ref: '#/components/responses/400BadRequestError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '404':
          $ref: '#/components/responses/404NotFoundError'
        '422':
          $ref: '#/components/responses/422UnprocessableEntityError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri: https://lbhublicoll.infocert.it/lbhublint/rest/documents/invoices/passive/{invoiceId}/autofattura
        responses:
          default:
            statusCode: '200'
        requestParameters:
          integration.request.path.invoiceId: method.request.path.invoiceId
          integration.request.header.Authorization: '''Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='''
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: http_proxy
      operationId: postDocumentsInvoicesPassiveByInvoiceIdAutofattura
      x-operation-id-source: derived
    servers:
    - url: https://api.infocert.digital/einvoicing/sdigate/v1
  /documents/longtermArchive:
    post:
      summary: Conserve direct notify/notify list or invoice/invoice list
      tags:
      - Invoice
      responses:
        '200':
          description: 'The resource has been successfully and correctly archived.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseLongTermArchive'
        '400':
          $ref: '#/components/responses/400BadRequestError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri: https://lbhublicoll.infocert.it/lbhublint/rest/documents/longtermArchive
        responses:
          default:
            statusCode: '200'
        requestParameters:
          integration.request.header.Authorization: '''Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='''
        passthroughBehavior: when_no_match
        httpMethod: POST
        type: http_proxy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requestLongTermArchive'
        required: true
      operationId: postDocumentsLongtermArchive
      x-operation-id-source: derived
    servers:
    - url: https://api.infocert.digital/einvoicing/sdigate/v1
  /documents/invoices/active:
    get:
      tags:
      - Invoice
      summary: Get the invoices for the active flow
      parameters:
      - in: query
        name: external_archive
        description: 'A value equals to true filters all active invoices generated with the longtermArchive API

          '
        schema:
          type: boolean
      - in: query
        name: in_elaborazione
        description: 'A value equals to true filters all invoices with ''in progress'' status while false only returns the ''completed'' invoices. > If the parameter is not specified all invoices are retrieved.

          '
        required: false
        schema:
          type: boolean
      - in: query
        name: pa_pr
        description: 'A value equals to ''pa'' filters only the invoices sent to public administration. While a value equals to ''pr'' filters all invoices sent to privates.

          '
        required: false
        schema:
          type: string
          enum:
          - pa
          - pr
      - in: query
        required: false
        name: data_inizio_ricezione
        description: 'Limit the results to the invoices whose reception date (respect to Infocert) is not before the one provided.

          '
        schema:
          type: string
          format: date
      - in: query
        required: false
        name: data_fine_ricezione
        description: 'Limit the results to the invoices whose reception date (respect to Infocert) is not after the one provided.

          '
        schema:
          type: string
          format: date
      - in: query
        required: false
        name: piva_cliente
        description: 'Select invoices according to ''partita-iva destinatario''.

          '
        schema:
          type: string
      - in: query
        name: piva_fornitore
        description: 'Select invoices according to ''partita-iva emittente''.

          '
        required: false
        schema:
          type: string
      - in: query
        required: false
        name: tipo_fattura
        description: 'Select invoices according to ''tipo_fattura'' value (TD01,TD02,...).

          '
        schema:
          type: string
      - in: query
        required: false
        name: starting_id
        description: 'Select all invoices with invoiceId greater or equal than starting_id.

          '
        schema:
          type: string
      - in: query
        required: false
        name: company_id
        description: 'Select all invoices with companyId equal than starting_id.

          '
        schema:
          type: string
      - $ref: '#/components/parameters/companyGroupCode'
      - $ref: '#/components/parameters/paginationIndex'
      - $ref: '#/components/parameters/paginationItemsPerPage'
      responses:
        '200':
          description: 'A list of selected invoices.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/invoiceListaResponse'
        '403':
          $ref: '#/components/responses/403ForbiddenError'
        '400':
          $ref: '#/components/responses/400BadRequestError'
      x-amazon-apigateway-request-validator: Validate body, query string parameters, and headers
      x-amazon-apigateway-integration:
        uri: https://lbhublicoll.infocert.it/lbhublint/rest/documents/invoices/active
        responses:
          default:
            statusCode: '200'
        requestParameters:
          integration.request.querystring.external_archive: method.request.querystring.external_archive
          integration.request.querystring.in_elaborazione: method.request.querystring.in_elaborazione
          integration.request.querystring.pa_pr: method.request.querystring.pa_pr
          integration.request.querystring.data_inizio_ricezione: method.request.querystring.data_inizio_ricezione
          integration.request.querystring.data_fine_ricezione: method.request.querystring.data_fine_ricezione
          integration.request.querystring.piva_cliente: method.request.querystring.piva_cliente
          integration.request.querystring.piva_fornitore: method.request.querystring.piva_fornitore
          integration.request.querystring.tipo_fattura: method.request.querystring.tipo_fattura
          integration.request.querystring.starting_id: method.request.querystring.starting_id
          integration.request.querystring.company_group_code: method.request.querystring.company_group_code
          integration.request.querystring.indice_pagina: method.request.querystring.indice_pagina
          integration.request.querystring.oggetti_per_pagina: method.request.querystring.oggetti_per_pagina
          integration.request.header.Authorization: '''Basic dGVzdHVzZXIwMTphc2RmIWxrQQ=='''
        passthroughBehavior: when_no_match
        httpMethod: GET
        type: http_proxy
      operationId: getDocumentsInvoicesActive
      x-operation-id-source: derived
    servers:
    - url: https://api.infocert.digital/einvoicing/sdigate/v1
