  /documents/invoices/byIdentificativoSdi/{identificativoSdi}/content:
    get:
      tags:
      - Invoice
      summary: The content of a specific invoice is retrieved
      parameters:
      - in: query
        name: contentType
        description: 'The contentType parameter specifies the extension of the required content. The possible values are ''xml'', ''pdf'', ''original'' or ''partial''. When the query-parameter is not specified the content is returned unsigned and in xml format. The value ''original'' returns the signed content (as it was originally sent or recieved from/to SDI). The value ''pdf'' returns the content in pdf format. If the identificativoSdi is associated with a stock of invoices: when the query-parameter is not specified the entire lot is returned unsigned and in xml format. The value ''original'' returns the complete signed stock (as it was originally sent or recieved from/to SDI). The value ''pdf'' returns the pdf of the only invoice of the stock associated with the couple ''identificativoSdi'' and ''position''. The value ''partial'' returns the xml of the only invoice of the stock associated with the couple ''identificativoSdi'' and ''position''.

          '
        required: false
        schema:
          type: string
          enum:
          - xml
          - pdf
          - original
          - partial
      - in: query
        name: pdfTemplate
        description: 'The chosen pdfTemplate. This parameter has to be used only when the contentType parameter is equals to ''pdf''. The ''ADE'' value reurns the PDF in the standard format as defined by the ''Agenzia delle Entrate''. The ''ASSOSW'' value  is the standard for ''Assosoftware''. While the ''CUSTOM'' value is referred to the client customization.

          '
        schema:
          type: string
          enum:
          - ADE
          - ASSOSW
          - CUSTOM
      - in: query
        name: position
