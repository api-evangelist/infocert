    SendingPolicy:
      title: SendingPolicy
      type: object
      description: Controls retry scheduling. If numberOfRetries is greater than 1, frequency must be > 0.
      properties:
        numberOfRetries:
          type: integer
          minimum: 1
          maximum: 5
          description: Number of attempts (including first try)
        frequency:
          type: integer
          minimum: 0
          description: Delay between retries (unit defined by backend; 0 allowed only when numberOfRetries=1)
        timeout:
          type: integer
          minimum: 1
          description: Overall timeout before the dispatch expires (unit defined by backend)
      required:
      - numberOfRetries
      - frequency
      - timeout
      additionalProperties: false
      allOf:
      - if:
          properties:
            numberOfRetries:
              minimum: 2
          required:
          - numberOfRetries
        then:
          properties:
            frequency:
              minimum: 1
      example:
        numberOfRetries: 1
        frequency: 0
        timeout: 10
    ExternalChannelSendingPolicy:
      title: ExternalChannelSendingPolicy
      type: object
      description: 'Sending policy for external channel dispatches. Same validation rule: if numberOfRetries > 1 then frequency must be > 0.'
      properties:
