openapi: 3.2.0
info:
  title: Infocert Process Types API
  version: '1'
  contact:
    name: GoNotice API support
    url: https://www.infocert.it
    email: gonotice@infocert.it
  license:
    name: InfoCert
    url: https://www.infocert.it
  termsOfService: urn:tos
  description: 'Operations tagged Process Types across 2 of this provider''s published API definitions: infocert-gonotice-openapi.yml, infocert-gonotice-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.infocert.digital/edelivery/v1
- url: https://{client-callback-endpoint}
  description: The URL configured by the client to receive the dispatch update callbacks.
basePath: /identification/afm/v1
security:
- oAuth2: []
tags:
- name: Process Types
paths:
  /pt:
    post:
      tags:
      - Process Types
      summary: Creates a new Process Type
      operationId: createProcessType
      description: Create process type JSON body
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcessType'
            examples:
              email_2_attachments:
                $ref: '#/components/examples/CreateProcessType_Email_2Attachments'
              sms_1_attachment:
                $ref: '#/components/examples/CreateProcessType_SMS_1Attachment'
              whatsapp:
                $ref: '#/components/examples/CreateProcessType_WhatsApp'
              external_channel:
                $ref: '#/components/examples/CreateProcessType_ExternalChannel'
              failover_email_to_sms:
                $ref: '#/components/examples/CreateProcessType_Failover_EmailToSMS'
      responses:
        '201':
          description: Returns a ptExternalID generated by server
          content:
            text/plain:
              schema:
                type: string
                example: 3684c06b-411c-44ff-8227-157d149e8e8a
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://api.infocert.digital/edelivery/v1
    - url: https://{client-callback-endpoint}
      description: The URL configured by the client to receive the dispatch update callbacks.
  /pt/{ptExternalID}:
    parameters:
    - $ref: '#/components/parameters/ptExternalID'
    get:
      tags:
      - Process Types
      summary: Get a Process Type detailed information
      operationId: getProcessType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessType'
              examples:
                email_2_attachments:
                  $ref: '#/components/examples/GetProcessType_Failover_EmailToSMS'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      x-codegen-request-body-name: request
    put:
      tags:
      - Process Types
      summary: Update a process type only if there is no campaing associated
      operationId: updateProcessType
      description: Update process type JSON body
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcessType'
            examples:
              email_2_attachments:
                $ref: '#/components/examples/CreateProcessType_Email_2Attachments'
              sms_1_attachment:
                $ref: '#/components/examples/CreateProcessType_SMS_1Attachment'
              whatsapp:
                $ref: '#/components/examples/CreateProcessType_WhatsApp'
              external_channel:
                $ref: '#/components/examples/CreateProcessType_ExternalChannel'
              failover_email_to_sms:
                $ref: '#/components/examples/CreateProcessType_Failover_EmailToSMS'
      responses:
        '200':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
      - Process Types
      summary: Delete a Process Type only if there are no dispatches linked to it
      operationId: deleteProcessType
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://api.infocert.digital/edelivery/v1
    - url: https://{client-callback-endpoint}
      description: The URL configured by the client to receive the dispatch update callbacks.
  /pt/{ptExternalID}/disable:
    parameters:
    - $ref: '#/components/parameters/ptExternalID'
    put:
      tags:
      - Process Types
      summary: When you cannot delete a process type you can disable it to make it unusable
      operationId: disableProcessType
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://api.infocert.digital/edelivery/v1
    - url: https://{client-callback-endpoint}
      description: The URL configured by the client to receive the dispatch update callbacks.
  /pt/{ptExternalID}/enable:
    parameters:
    - $ref: '#/components/parameters/ptExternalID'
    put:
      tags:
      - Process Types
      summary: Enable a Process Type if it is in Draft or Disable state
      operationId: enableProcessType
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://api.infocert.digital/edelivery/v1
    - url: https://{client-callback-endpoint}
      description: The URL configured by the client to receive the dispatch update callbacks.
  /pt/{ptExternalID}/draft:
    parameters:
    - $ref: '#/components/parameters/ptExternalID'
    put:
      tags:
      - Process Types
      summary: Change Process Type's status to DRAFT if it was never used
      operationId: draftProcessType
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://api.infocert.digital/edelivery/v1
    - url: https://{client-callback-endpoint}
      description: The URL configured by the client to receive the dispatch update callbacks.
  /pt/{ptExternalID}/templatePlaceholders:
    parameters:
    - $ref: '#/components/parameters/ptExternalID'
    get:
      tags:
      - Process Types
      summary: Get placeholders found in templates and body message
      operationId: getTemplatePlaceholders
      parameters:
      - in: query
        name: campaignId
        description: Campaign ID
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePlaceholderList'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://api.infocert.digital/edelivery/v1
    - url: https://{client-callback-endpoint}
      description: The URL configured by the client to receive the dispatch update callbacks.
  /pt/{ptExternalID}/report:
    parameters:
    - $ref: '#/components/parameters/ptExternalID'
    post:
      tags:
      - Process Types
      summary: Request to generate a report
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratePtReport'
      operationId: requestGenerateReport
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    get:
      tags:
      - Process Types
      summary: Get report status
      parameters:
      - in: query
        name: reportType
        description: Type of the report requested
        required: true
        schema:
          type: string
          enum:
          - Audit
          - CSV
      operationId: requestGetReport
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportStatus'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://api.infocert.digital/edelivery/v1
    - url: https://{client-callback-endpoint}
      description: The URL configured by the client to receive the dispatch update callbacks.
components:
  responses:
    '201':
      description: Resource created
      content:
        text/plain: {}
    '200':
      description: Confirmation of operation completed
      content:
        text/plain: {}
    '500':
      description: An unexpected server error has occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          example:
            code: UNEXPECTED
            message: Unexpected Server Error
            correlationID: 0a83cbc5-1f88-4166-9880-ae132adf8b54
            timestamp: '2021-12-18T17:07:24.192253Z'
    '401':
      description: Invalid access token or credentials
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/OperationOutcome'
            - $ref: '#/components/schemas/InvalidCredentials'
            - $ref: '#/components/schemas/UnauthorizedOutcome'
          examples:
            invalid_tokens:
              summary: Invalid access token
              value:
                code: INVALID_ACCESS_TOKEN
                sub_code: INVALID_JWT_TOKEN
                message: Invalid JWT token
                correlationID: 0a83cbc5-1f88-4166-9880-ae132adf8b54
                timestamp: '2021-12-18T17:07:24.192253Z'
            invalid_credentials:
              summary: Invalid client secret
              value:
                error: unauthorized_client
                error_description: Invalid client secret
            unauthorized_outcome:
              summary: Unauthorized
              value:
                message: Unauthorized
    '400':
      description: Malformed parameters or bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          example:
            code: BAD_REQUEST
            sub_code: INVALID_COST_CENTER
            message: Bad request
            correlationID: 0a83cbc5-1f88-4166-9880-ae132adf8b54
            timestamp: '2021-12-18T17:07:24.192253Z'
    '422':
      description: One or more request field are wrong or illegal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          example:
            code: ILLEGAL_ARGUMENT
            message: Illegal or wrong request field
            correlationID: 0a83cbc5-1f88-4166-9880-ae132adf8b54
            timestamp: '2021-12-18T17:07:24.192253Z'
  examples:
    GetProcessType_Failover_EmailToSMS:
      summary: Get Process Type with email channel and SMS failover
      value:
        processTypeName: Process Type Name
        externalID: ce731399-7470-48b2-9f8f-145df14fa0d3
        status: ENABLED
        creationDateTime: '1767797628'
        sendingPolicy:
          timeout: 10
          numberOfRetries: 1
          frequency: 0
        certificationLevels:
        - communication_sent
        - explicit_acceptance
        emailChannel:
          subject: This is the subject
          body: '<p><span style="font-family: Arial;">Hello</span></p>'
        smsChannel: {}
        whatsappChannel: {}
        externalChannel: {}
        failoverChannels:
        - channelPriority: 0
          channelName: smsChannel
          channelDetails:
            body: Hello, we weren't able to contact you by email
        rejectReasons: []
        attachments:
          additionalAttachmentCount: 0
          certificationLevel: None
          content: []
        reminderConfiguration: {}
    CreateProcessType_WhatsApp:
      summary: WhatsApp channel
      value:
        processTypeName: PT - WhatsApp
        sendingPolicy:
          numberOfRetries: 1
          frequency: 0
          timeout: 10
        certificationLevels:
        - communication_sent
        - explicit_acceptance
        attachments:
          content: []
          certificationLevel: None
          additionalAttachmentCount: 0
        rejectReasons:
        - defaultReason: Reason number one
          ita: Ragione numero uno
        - defaultReason: Reason number two
          ita: Ragione numero due
        whatsappChannel:
          body: Ciao ${recipient.firstName}, hai una nuova comunicazione. Accedi per visualizzarla.
        failoverChannels: []
    CreateProcessType_Failover_EmailToSMS:
      summary: Failover from Email to SMS
      value:
        processTypeName: PT - Failover Email to SMS
        sendingPolicy:
          numberOfRetries: 2
          frequency: 12
          timeout: 10
        certificationLevels:
        - communication_sent
        - explicit_acceptance
        - communication_received
        attachments:
          content: []
          certificationLevel: None
          additionalAttachmentCount: 0
        rejectReasons: []
        emailChannel:
          subject: Important message for ${recipient.firstName}
          body: <p>Hello ${recipient.firstName}, please read the communication as soon as possible.</p>
        failoverChannels:
        - channelPriority: 0
          channelName: smsChannel
          channelDetails:
            body: Hi ${recipient.firstName}, we couldn't reach you by email. Please check your communications.
    CreateProcessType_Email_2Attachments:
      summary: Email channel with 2 attachments
      value:
        processTypeName: PT - Email with 2 attachments
        sendingPolicy:
          numberOfRetries: 2
          frequency: 12
          timeout: 10
        certificationLevels:
        - communication_sent
        - explicit_acceptance
        - communication_received
        attachments:
          content:
          - name: Main document
            filename: document.pdf
            mimeType: application/pdf
            size: 245
            url: uploads/pt/document.pdf
            template: false
            placeholders: []
          - name: Terms and conditions
            filename: terms.pdf
            mimeType: application/pdf
            size: 98
            url: uploads/pt/terms.pdf
            template: false
            placeholders: []
          certificationLevel: None
          additionalAttachmentCount: 0
        rejectReasons:
        - defaultReason: Reason number one
          ita: Ragione numero uno
        - defaultReason: Reason number two
          ita: Ragione numero due
        emailChannel:
          subject: Welcome ${recipient.firstName}
          body: <p>Hello <b>${recipient.firstName}</b>, please find the attached documents.</p>
        failoverChannels: []
    CreateProcessType_SMS_1Attachment:
      summary: SMS channel with 1 attachment
      value:
        processTypeName: PT - SMS with 1 attachment
        sendingPolicy:
          numberOfRetries: 1
          frequency: 0
          timeout: 10
        certificationLevels:
        - communication_sent
        - communication_received
        attachments:
          content:
          - name: Notification PDF
            filename: notice.pdf
            mimeType: application/pdf
            size: 120
            url: uploads/pt/notice.pdf
            template: false
            placeholders: []
          certificationLevel: None
          additionalAttachmentCount: 0
        rejectReasons: []
        smsChannel:
          body: Hi ${recipient.firstName}, you have a new communication. Please check your inbox.
        failoverChannels: []
    CreateProcessType_ExternalChannel:
      summary: External channel (subject + body)
      value:
        processTypeName: PT - External Channel
        sendingPolicy:
          timeout: 10
        certificationLevels:
        - communication_sent
        - communication_received
        attachments:
          content: []
          certificationLevel: None
          additionalAttachmentCount: 0
        rejectReasons: []
        externalChannel:
          subject: External delivery for ${recipient.firstName}
          body: '<p>External channel message for ${recipient.firstName}. Reference: ${dispatch.externalId}</p>'
        failoverChannels: []
  schemas:
    GeneratePtReport:
      title: GenerateReport
      description: Request to generate a report
      type: object
      properties:
        reportType:
          type: string
          description: Type of the report to generate
          enum:
          - Audit
          - CSV
        campaignIDs:
          type: array
          items:
            type: string
          example:
          - 08f0b377-96f7-4754-846a-58c7b1aa369b
          - 11f0b311-11f7-1154-116a-58c7b1aa3611
        unselectedCampaignIDs:
          type: array
          items:
            type: string
          example:
          - 77f0b377-96f7-7754-776a-58c7b1aa369b
          - 1188b311-88f7-8854-116a-58c7b1aa3611
        allCampaigns:
          type: Boolean
          description: Set to true if the report has to cover all campaigns
          default: false
      required:
      - reportType
      - campaignExternalIDs
      - allCampaigns
    FailoverChannel:
      title: FailoverChannel
      type: object
      description: Fallback channel configuration used when the primary channel cannot be delivered.
      properties:
        channelPriority:
          type: integer
          minimum: 0
          description: 0 is the first failover to try, then 1, ...
        channelName:
          type: string
          enum:
          - emailChannel
          - smsChannel
          - whatsappChannel
          description: Target channel
        channelDetails:
          type: object
          oneOf:
          - $ref: '#/components/schemas/emailChannel'
          - $ref: '#/components/schemas/smsChannel'
          description: Payload for the failover channel (email-like or sms-like).
      required:
      - channelPriority
      - channelName
      - channelDetails
      additionalProperties: false
    whatsappChannel:
      title: whatsappChannel
      type: object
      properties:
        body:
          type: string
          description: Message body
      required:
      - body
      additionalProperties: false
    OperationOutcome:
      title: operationOutcome
      type: object
      properties:
        code:
          description: Error response code
          $ref: '#/components/schemas/ErrorResponseCode'
        message:
          description: Outcome message
          type: string
        successful:
          description: Successful if true
          type: boolean
        url:
          description: Outcome URL
          type: string
          format: uri
        timestamp:
          description: Outcome timestamp
          type: string
          format: date-time
        correlationID:
          description: Correlation ID
          type: string
        details:
          description: Details information
          type: object
      required:
      - code
      - timestamp
      - correlationID
    RejectReason:
      title: rejectReason
      type: object
      description: Reject reason
      properties:
        defaultReason:
          type: string
          description: Default reason
      additionalProperties:
        description: 'Key-value pairs for reason localization: keys are languages in ISO 639-2 Code (alpha-3) format, like ''ita'', ''eng'''
        type: string
      example:
        defaultReason: I'm not interested
        ita: Non mi interessa
        fra: Je ne suis pas intéressé
      required:
      - defaultReason
    CreateProcessType:
      title: CreateProcessType
      description: Creation of a Process Type.
      type: object
      properties:
        externalID:
          type: string
          description: Optional external identifier provided by the caller
        processTypeName:
          type: string
          description: Process type name
        sendingPolicy:
          description: Sending policy (validated based on selected channel)
        certificationLevels:
          $ref: '#/components/schemas/ProcessTypeCertificationLevels'
          description: Certification levels to generate
        smsChannel:
          $ref: '#/components/schemas/smsChannel'
          description: SMS Channel
        emailChannel:
          $ref: '#/components/schemas/emailChannel'
          description: Email Channel
        whatsappChannel:
          $ref: '#/components/schemas/whatsappChannel'
          description: WhatsApp Channel
        externalChannel:
          $ref: '#/components/schemas/externalChannel'
          description: External Channel
        attachments:
          description: Zero or more common attachments
          type: object
          properties:
            content:
              description: Array of attachments
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            certificationLevel:
              description: Certification level
              type: string
              enum:
              - None
              - AttachmentOpened
            additionalAttachmentCount:
              type: integer
              minimum: 0
              maximum: 9
              description: Zero or more attachments to be added in the single dispatches
        rejectReasons:
          type: array
          items:
            $ref: '#/components/schemas/RejectReason'
          description: Reject reasons
          default: []
        failoverChannels:
          type: array
          items:
            $ref: '#/components/schemas/FailoverChannel'
          description: Failover channels
          default: []
        reminderConfiguration:
          $ref: '#/components/schemas/ReminderConfiguration'
          description: Optional reminder configuration
      oneOf:
      - required:
        - processTypeName
        - smsChannel
      - required:
        - processTypeName
        - emailChannel
      - required:
        - processTypeName
        - whatsappChannel
      - required:
        - processTypeName
        - externalChannel
      allOf:
      - if:
          properties:
            externalChannel:
              type: object
          required:
          - externalChannel
        then:
          properties:
            sendingPolicy:
              $ref: '#/components/schemas/ExternalChannelSendingPolicy'
          required:
          - sendingPolicy
        else:
          properties:
            sendingPolicy:
              $ref: '#/components/schemas/SendingPolicy'
          required:
          - sendingPolicy
      additionalProperties: false
    ReportStatus:
      title: ReportStatus
      description: Request to generate a report
      type: object
      properties:
        status:
          type: string
          enum:
          - COMPLETED
          - IN_PROGRESS
          - ERROR
          - NOT_REQUESTED
          description: The current status of the report.
        progress:
          type: object
          properties:
            processed:
              type: integer
              description: Number of files processed.
              example: 5
            total:
              type: integer
              description: Total number of files to process.
              example: 17
          description: Progress of the report creation.
        completedAt:
          type: integer
          description: Timestamp when the report was completed
          example: 1686900700
        presignedUrl:
          type: string
          description: A presigned URL to access the report.
        errorMessage:
          type: string
          description: The reported error if occured.
    ReminderConfiguration:
      title: ReminderConfiguration
      type: object
      properties:
        daysUntilReminder:
          type: integer
          minimum: 1
          description: Number of days after which a reminder is sent
        channelName:
          type: string
          enum:
          - email
          - sms
          - whatsapp
          description: Reminder channel
      required:
      - daysUntilReminder
      - channelName
      additionalProperties: false
    ProcessType:
      title: processType
      type: object
      properties:
        processTypeName:
          type: string
          description: Process type name
        sendingPolicy:
          description: Sending policy
          $ref: '#/components/schemas/SendingPolicy'
        certificationLevels:
          description: Certification levels
          $ref: '#/components/schemas/ProcessTypeCertificationLevels'
        smsChannel:
          description: SMS channel
          $ref: '#/components/schemas/smsChannel'
        emailChannel:
          $ref: '#/components/schemas/emailChannel'
          description: Email Channel
        whatsappChannel:
          $ref: '#/components/schemas/whatsappChannel'
          description: WhatsApp Channel
        externalChannel:
          $ref: '#/components/schemas/externalChannel'
          description: External Channel
        reminderConfiguration:
          $ref: '#/components/schemas/ReminderConfiguration'
          description: Optional reminder configuration
        failoverChannels:
          description: List of failover channels
          type: array
          items:
            type: object
            properties:
              channelName:
                type: string
                description: Channel failover name
                enum:
                - emailChannel
                - smsChannel
                - whatsappChannel
              channelPriority:
                type: integer
                description: channel priority for next hop
              channelDetails:
                oneOf:
                - $ref: '#/components/schemas/emailChannel'
                - $ref: '#/components/schemas/smsChannel'
                - $ref: '#/components/schemas/whatsappChannel'
        attachments:
          description: Zero or more common attachments
          type: object
          properties:
            content:
              type: array
              description: Array of attachments
              items:
                $ref: '#/components/schemas/Attachment'
              example:
              - name: Document to be approved
                filename: document.pdf
                size: 30
                mimeType: application/pdf
                url: uploads/pt////document.pdf
              - name: Template name
                template: true
                filename: template_name.docx
                size: 121
                mimeType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
                url: uploads/pt////template_name.docx
                placeholders:
                - ${recipient.details.role}
                - ${recipient.firstName}
                - ${recipient.details.azienda}
            certificationLevel:
