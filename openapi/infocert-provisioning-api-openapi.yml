components:
  schemas:
    provisioningPecInbound:
      type: object
      required:
      - pecInboundUsername
      - pecInboundPassword
      properties:
        pecInboundUsername:
          type: string
          example: ABC123XYZ
        pecInboundPassword:
          type: string
          example: 123abc456
    provisioningPecOutbound:
      type: object
      required:
      - pecOutboundUsername
      - pecOutboundPassword
      - pecOutboundFrom
      properties:
        pecOutboundUsername:
          type: string
          example: ABC123XYZ
        pecOutboundPassword:
          type: string
          example: 123abc456
        pecOutboundFrom:
          type: string
          example: infocert_b2b_test@legalmail.it
    provisioningObj:
      description: 'One provisioning object among provisioningPec, provisioningLegalArchiving and provisioningFirma

        '
      type: object
      required:
      - type
      properties:
        type:
          type: string
    error:
      description: 'This error object isused across the API to report all the type  of errors. It adheres to the guidelines specified [here](https://github.com/Microsoft/api-guidelines/blob/vNext/Guidelines.md#7102-error-condition-responses).

        '
      type: object
      properties:
        code:
          description: "The value for the \"code\" name/value pair is a language-independent string.  Its value is a human-readable service-defined error code.  This code serves as a more specific indicator of the error than the HTTP error code specified in the response.  A relatively small number of possible values for \"code\" are defined and all clients  MUST be capable of handling all of them.  Most services will require a much larger number of more specific error codes,  which are not interesting to all clients.  These error codes are be exposed in the \"innererror\" name/value pair. \n"
          type: string
        message:
          description: "The value for the \"message\" name/value pair is a human-readable representation of the error.  It is intended as an aid to developers and is not suitable for exposure to end users. \n"
          type: string
    provisioningLegalArchiving:
      type: object
      required:
      - processType
      - documentType
      properties:
        processType:
          description: A value between 'ca' or 'cp'.
          type: string
          example: ca
        documentType:
          description: A value among 'fea', 'fep', 'noa' or 'nop'.
          type: string
          example: fea
        ndocConfiguration:
          type: object
          required:
          - ndocUsername
          - ndocPassword
          - ndocBucket
          - ndocPolicy
          properties:
            ndocInfocertServiceURL:
              type: string
              example: http://conservazionecl.infocert.it/ws/
            ndocUsername:
              type: string
              example: K79ND201
            ndocPassword:
              type: string
              example: infocert1
            ndocBucket:
              type: string
              example: B806
            ndocPolicy:
              type: string
              example: P864
            ndocProfile:
              type: string
              example: lbhub
            ndocClasseDocumentale:
              type: string
              example: fata_el
            ndocCheckBulkData:
              type: string
              example: 'true'
            ndocPath:
              type: string
              example: /Fatturazione Elettronica
            ndocAttributes:
              type: string
              example: anno-fiscale,data-documento
    provisioningFirma:
      type: object
      required:
      - signDomain
      - signUser
      - signPassword
      - signServerUrl
      - signAlias
      - signPin
      properties:
        signDomain:
          type: string
          example: TESTVALUE
        signUser:
          type: string
          example: ABC1234
        signPassword:
          type: string
          example: 123456789123abcde
        signServerUrl:
          type: string
          example: https://ncfr.infocert.it/ncfr-webservice/ServerMaRe
        signAlias:
          type: string
          example: xxxxxxxxxxx
        signPin:
          type: string
          example: yyyyyyyyyyyy
  responses:
    403ForbiddenError:
      description: 'The authentication credentials are insufficient or incorrect to grant access.

        '
  parameters:
    companyId:
      name: companyId
      in: path
      description: 'The ID of the company on which the operation will be executed.

        '
      required: true
      schema:
        type: string
  securitySchemes:
    apiKey:
      type: apiKey
      description: 'The API Key provided to you by Infocert.

        '
      name: x-api-key
      in: header
