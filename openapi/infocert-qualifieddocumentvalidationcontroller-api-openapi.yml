    ValidateDocumentRequestCustom:
      required:
      - signedDocument
      type: object
      properties:
        signedDocument:
          $ref: '#/components/schemas/Document'
        originalDocuments:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        originalDocumentsContentType:
          type: string
          enum:
          - FULL_CONTENT
          - DIGEST_SHA1
          - DIGEST_SHA224
          - DIGEST_SHA256
          - DIGEST_SHA512
        validationOptions:
          $ref: '#/components/schemas/ValidateDocumentOptionsCustom'
      description: The request object to pass as json body. Cannot be null or empty.
    QsvsDocumentValidationReport:
      type: object
      properties:
        signatureValidationPolicyName:
          type: string
        signatureValidationPolicyDescription:
          type: string
        signatureValidationPolicyOid:
          type: string
        qsvsPolicyOid:
          type: string
        validationTime:
