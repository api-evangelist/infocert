        signerName:
          type: string
        status:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/SignatureReportMessage'
        signingCertificateId:
          type: string
        certificateChain:
          type: array
          items:
            type: string
        timestampIds:
          type: array
          items:
            type: string
        signedAttributes:
          type: object
          additionalProperties:
            type: string
    QsvsValidateDocumentResponseCustom:
      type: object
      properties:
        valid:
