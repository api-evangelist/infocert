openapi: 3.2.0
info:
  title: Infocert Qualified Document Validation Controller API
  version: '4.0'
  description: 'Operations tagged QualifiedDocumentValidationController across 2 of this provider''s published API definitions: infocert-signature-validation-openapi.yml, infocert-signature-validation-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://apitest.infocert.digital/validation/signature
  description: Test Environment
- url: https://apistage.infocert.digital/validation/signature
  description: Stage Environment
- url: https://api.infocert.digital/validation/signature
  description: Production Environment
basePath: /identification/afm/v1
tags:
- name: QualifiedDocumentValidationController
  description: Set of Endpoints to perform a qualified validation of a signed document
paths:
  /v4/qsvs/document:
    post:
      security:
      - bearerAuth: []
      tags:
      - QualifiedDocumentValidationController
      summary: Validate single document operation
      description: Validate single document operation, consumes = application/json, produces = application/json,application/json+problem
      operationId: validateDocumentCustom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDocumentRequestCustom'
        required: true
      responses:
        '200':
          description: VALIDATION SUCCESSFULLY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QsvsValidateDocumentResponseCustom'
            application/json+problem:
              schema:
                $ref: '#/components/schemas/QsvsValidateDocumentResponseCustom'
        '400':
          description: BAD REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbstractThrowableProblem'
            application/json+problem:
              schema:
                $ref: '#/components/schemas/AbstractThrowableProblem'
        '401':
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: NOT FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbstractThrowableProblem'
            application/json+problem:
              schema:
                $ref: '#/components/schemas/AbstractThrowableProblem'
    servers:
    - url: https://apitest.infocert.digital/validation/signature
      description: Test Environment
    - url: https://apistage.infocert.digital/validation/signature
      description: Stage Environment
    - url: https://api.infocert.digital/validation/signature
      description: Production Environment
