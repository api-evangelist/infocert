openapi: 3.2.0
info:
  title: Infocert Statistics API
  version: '1.0'
  description: 'Operations tagged Statistics across 4 of this provider''s published API definitions: infocert-gonotice-openapi.yml, infocert-legalmail-business-provisioning-openapi.yml, infocert-gonotice-openapi.yml, infocert-legalmail-business-provisioning-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.infocert.digital/edelivery/v1
- url: https://{client-callback-endpoint}
  description: The URL configured by the client to receive the dispatch update callbacks.
- url: https://mtlsapi.infocert.digital/api/v1
- url: https://mtlsapistage.infocert.digital/api/v1
- url: https://mtlsapitest.infocert.digital/api/v1
basePath: /identification/afm/v1
tags:
- name: Statistics
  description: GoNotice APIs for Statistics
paths:
  /communicationStats:
    get:
      tags:
      - Statistics
      summary: Get communications statistics
      operationId: getCommunicationStats
      parameters:
      - in: query
        name: byProcessTypeExternalID
        description: By process type external id
        schema:
          type: string
      - in: query
        name: byCampaignExternalID
        description: By campaign external id
        schema:
          type: string
      - in: query
        name: creationDateInterval
        required: true
        description: 'Date interval in JSON format such as {"from": "2023-01-01", "to": "2023-01-31"}'
        schema:
          type: object
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
          required:
          - from
          - to
      - in: query
        name: channel
        description: Channel
        schema:
          type: string
          enum:
          - sms
          - email
      - in: query
        description: By cost center
        name: byCostCenter
        schema:
          type: string
      responses:
        '200':
          description: Returns the statistic details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunicationStats'
              example:
                stats:
                  successfulCommunications: 19
                  totalSentMessages: 32
                  avgAttemptsUser: 1
                  totalCommunications: 32
                  avgOpeningTime: 329
                  totalFailover: 0
                commStatus:
                  expired: 0
                  completed: 19
                  accepted_by_remote: 5
                  failed: 7
                  scheduled: 1
                commDetailsChannel:
                  byChannel:
                  - label: '2026-01-31'
                    values:
                      email: 0
                      sms: 0
                  - label: '2026-02-01'
                    values:
                      email: 0
                      sms: 0
                  - label: '2026-02-02'
                    values:
                      email: 1
                      sms: 0
                  - label: '2026-02-03'
