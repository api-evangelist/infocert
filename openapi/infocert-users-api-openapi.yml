    UserAccessibilitySettings:
      title: UserAccessibilitySettings
      description: A definition of user accessibility settings
      type: object
      properties:
        highContrast:
          description: Enable high contrast UI
          type: boolean
          default: false
    AdminAuthority:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
    ProcessingDelayNotification:
      type: object
      description: Represents the configuration value for Processing Delay Notification
      properties:
        enabled:
          type: boolean
          description: Indicates if notifications for late processing are enabled
          default: false
        firstNotificationAfterDays:
          type: integer
          description: Days numbers before sending the first notification
          example: 6
        nextNotificationEveryDays:
          type: integer
          description: Represents after how many days repeat the notification
          example: 1
    Generic400ErrorResponse:
      description: A 400 error response
      allOf:
      - type: object
        properties:
          code:
            type: string
            enum:
            - INVALID_FIELD
            - INVALID_REQUEST
        required:
        - code
      - $ref: '#/components/schemas/GenericErrorResponse'
    UpdateManagerAuthority:
      type: object
      description: Settings of a manager. All users are managers, so this authority is always enabled
      allOf:
      - $ref: '#/components/schemas/CreateManagerAuthority'
      - type: object
        properties:
          addRoleMemberships:
            type: array
            description: Manager roles in which the user is a member, specified by role external id
            items:
              type: string
            example:
            - manager_external_id_role_01
            - manager_external_id_role_02
          removeRoleMemberships:
            type: array
            description: Manager roles in which the user is a member, specified by role external id
            items:
              type: string
            example:
            - manager_external_id_role_01
            - manager_external_id_role_02
          addRoleVisibilities:
            type: array
            description: Secretary roles that have visibility on the manager
            items:
              $ref: '#/components/schemas/SecretaryRoleVisibility'
          removeRoleVisibility:
            type: array
            description: Manager roles in which the user is a member, specified by role external id
            items:
              type: string
            example:
            - secretary_external_id_role_01
    Useri18nSettings:
      type: object
      description: User internationalization settings
      properties:
        countryCode:
          type: string
          description: Country code of user in ISO 3166-1 alpha-2 format
          maxLength: 2
          example: it
        language:
          type: string
          description: User language (it|en|es|pt|fr|de)
          maxLength: 2
          example: it
        emailLanguage:
          type: string
          description: Language for email communications (it|en|es|pt|fr|de). Equal to language if it's not specified
          example: en
        timezone:
          type: string
          description: The user time-zone (Eg. 'Europe/Rome'|'America/Los_Angeles')
          default: Europe/Rome
          example: Europe/London
    CertificateConfiguration:
      description: Configuration of a user certificate
      type: object
      properties:
        enabled:
          type: boolean
          default: false
      required:
      - enabled
    GenericErrorResponse:
      title: ErrorResponse
      description: A generic error response
      type: object
      properties:
        message:
          type: string
          description: The error message
        url:
          type: string
          format: uri
          description: Help url (when available)
        timestamp:
          type: string
          format: date-time
          description: When the error is occurred
        details:
          type: object
          description: Generic object with error details. Refer to the endpoint documentation to know how is built and when is available.
      required:
      - timestamp
    SuccessOperationResponse:
      title: SuccessOperationResponse
      description: A successful response
      type: object
      properties:
        operationId:
          type: string
          format: uuid
          description: An operation identifier generated from the service
        message:
          type: string
          description: Detail message
        timestamp:
          type: string
          format: date-time
          description: When the request is occurred
      required:
      - operationId
      - timestamp
    ManagerEmailNotificationSettings:
      title: UserNotificationSettings
      description: A definition of settings for email notification to user
      type: object
      properties:
        notifyEnvelopeToSignAsRecipient:
          description: Enable sending email when the user has to sign an envelope
          type: boolean
          default: false
        notifyEnvelopeToApproveAsRecipient:
          description: Enable sending email when the user has to approve an envelope
          type: boolean
          default: false
        notifyEnvelopeRejectedAsRecipient:
          description: Enable sending email when an envelope, of which I am recipient, is rejected
          type: boolean
          default: false
        notifyEnvelopeRemovedAsRecipient:
          description: Enable sending email when an envelope, of which I am recipient, is removed
          type: boolean
          default: false
        notifyDelayReminder:
