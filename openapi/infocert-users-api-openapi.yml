openapi: 3.2.0
info:
  title: Infocert Users API
  version: '1.0'
  description: 'Operations tagged Users across 7 of this provider''s published API definitions: infocert-gosign-ext-5-1-openapi.yml, infocert-infocert-sign-ext-5-1-openapi.yml, infocert-infocert-sign-provisioning-inbound-openapi.yml, infocert-gosign-ext-5-1-openapi.yml, infocert-gosign-ext-5r1-openapi.yml, infocert-infocert-sign-ext-5-1-openapi.yml, infocert-infocert-sign-provisioning-inbound-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://gosign-be.infocert.it/gosign/api/v5r1
  description: Corporate production API server
- url: https://corporate-be.infocertsign.com:{port}/be/api/v5r1/m2m
  description: Corporate production API server
- url: https://corporate-be.infocertsign.com/provisioning/inbound/api/v1
  description: Infocert Sign Provisioning Inbound API production server
- url: https://corporate-st-be.infocertsign.com/provisioning/inbound/api/v1
  description: Infocert Sign Provisioning Inbound API stage server
- url: https://gosign.infocert.it/api/v5r1
basePath: /identification/afm/v1
security:
- oAuth2:
  - openid
tags:
- name: Users
  description: GoSign OAuth2-accessed APIs for Users
paths:
  /users/current/tasks/{action}/types:
    parameters:
    - in: path
      name: action
      description: User available action type by specified action
      required: true
      schema:
        $ref: '#/components/schemas/TaskAction'
    get:
      tags:
      - Users
      summary: For the connected user, gets the available action types for the action specified
      operationId: getCurrentUserAvailableTaskActionTypes
      responses:
        '200':
          description: Returns the list of task action types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskActionType'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401_actionType'
        '422':
          $ref: '#/components/responses/422_actionType'
        '500':
          $ref: '#/components/responses/500_actionType'
    servers:
    - url: https://gosign-be.infocert.it/gosign/api/v5r1
      description: Corporate production API server
  /{customerPublicId}/admin/users:
    post:
      tags:
      - Users
      summary: Creates a new user
      description: Creates a new user with everything needed in one single operation
      operationId: createUser
      parameters:
      - name: X-Correlation-ID
        description: Unique identifier associated with request
        in: header
        required: false
        schema:
          type: string
          format: uuid
        example: 6282ea34-2c50-4b58-8c90-ad57219ce371
      - name: customerPublicId
        in: path
        description: The public unique identifier of the customer
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: The user is successfully created
          headers:
            X-Correlation-ID:
              description: The same identifier provided in the request header (if available) or a generated one from the service
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOperationResponse'
        '400':
          $ref: '#/components/responses/400_2'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422_CreateUser'
        '500':
          $ref: '#/components/responses/500'
    patch:
      tags:
      - Users
      summary: Updates an existing user
      description: Updates basic information of a user, together with email notifications, role membership, etc. See https://www.rfc-editor.org/rfc/rfc7396
      operationId: updateUser
      parameters:
      - name: X-Correlation-ID
        description: Unique identifier associated with request
        in: header
        required: false
        schema:
          type: string
          format: uuid
        example: 6282ea34-2c50-4b58-8c90-ad57219ce371
      - name: customerPublicId
        in: path
        description: The public unique identifier of the customer
        required: true
        schema:
          type: string
          format: uuid
      - name: searchBy
        description: How to identify the user to be updated
        in: query
        required: true
        schema:
          type: string
          enum:
          - externalId
          - globalId
          - username
      - name: searchFor
        description: The user to search, using the 'searchBy' type of searching
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: The user is successfully updated
          headers:
            X-Correlation-ID:
              description: The same identifier provided in the request header (if available) or a generated one from the service
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessOperationResponse'
        '400':
          $ref: '#/components/responses/400_2'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '422':
          $ref: '#/components/responses/422_CreateUser'
        '500':
          $ref: '#/components/responses/500'
    servers:
    - url: https://corporate-be.infocertsign.com/provisioning/inbound/api/v1
      description: Infocert Sign Provisioning Inbound API production server
    - url: https://corporate-st-be.infocertsign.com/provisioning/inbound/api/v1
      description: Infocert Sign Provisioning Inbound API stage server
components:
  responses:
    422_actionType:
      description: One or more request field are wrong or illegal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          example:
            taskActionNotFound:
              $ref: '#/components/examples/taskActionNotFound'
    500_actionType:
      description: An unexpected server error has occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
          example:
            descriptorError:
              $ref: '#/components/examples/descriptorError'
            unexpectedException:
              $ref: '#/components/examples/unexpectedException'
    401_actionType:
      description: Requestor not found
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/OperationOutcome'
            - $ref: '#/components/schemas/OauthTokenError'
          example:
            requestorNotFound:
              $ref: '#/components/examples/requestorNotFound'
            tokenError:
              $ref: '#/components/examples/tokenError'
    '400':
      description: Malformed parameters or bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationOutcome'
            example:
              code: BAD_REQUEST
              message: Bad request
    '500':
      description: An unexpected server error has occurred
      headers:
        X-Correlation-ID:
          description: The same identifier provided in the request header (if available) or a generated one from the service
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericErrorResponse'
          example:
            message: Unexpected Server Error
            timestamp: '2010-01-23T02:30:28Z'
    422_CreateUser:
      description: The request was syntactically correct, but one or more fields are wrong or illegal (e.g. duplicated username, nonexistent role, ...)
      headers:
        X-Correlation-ID:
          description: The same identifier provided in the request header (if available) or a generated one from the service
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateUserErrorResponse'
          example:
            code: INVALID_FIELD
            message: Illegal or wrong request field
            timestamp: '2007-09-07T11:22:50Z'
    '401':
      description: Token authentication error (e.g. missing token, bad token syntax, expired token, ...)
      headers:
        X-Correlation-ID:
          description: The same identifier provided in the request header (if available) or a generated one from the service
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedErrorResponse'
          examples:
            no_access_token:
              value:
                error: unauthorized
                error_description: You are unauthorized to access this resource
            bad_access_token:
              value:
                error: invalid_token
                error_description: 'Invalid access token: 9f64875f-6a38-4059-9a0f-f73833efda92'
    '403':
      description: Access denied. The user does not have the necessary permissions to access this resource
      headers:
        X-Correlation-ID:
          description: The same identifier provided in the request header (if available) or a generated one from the service
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessDeniedErrorResponse'
          examples:
            access_denied:
              value:
                error: access_denied
                error_description: You do not have the necessary permissions to access this resource
    '400_2':
      description: The request is syntactically not correct (e.g. missing required fields, bad field syntax, wrong content-type, ...)
      headers:
        X-Correlation-ID:
          description: The same identifier provided in the request header (if available) or a generated one from the service
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Generic400ErrorResponse'
            example:
              code: BAD_REQUEST
              message: Bad request
              timestamp: '2020-06-03T15:44:20Z'
    '400_3':
      description: The request is syntactically not correct (e.g. missing required fields, bad field syntax, wrong content-type, ...)
      headers:
        X-Correlation-ID:
          description: The same identifier provided in the request header (if available) or a generated one from the service
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Generic400ErrorResponse'
            example:
              code: BAD_REQUEST
              message: Bad request
              timestamp: '2020-06-03T15:44:20Z'
  examples:
    tokenError:
      value:
        code: invalid_token
        error_description: Invalid access token
    unexpectedException:
      value:
        code: ERROR
        message: Unexpected Server Error
    taskActionNotFound:
      value:
        code: ILLEGAL_ARGUMENT
        message: Illegal or wrong request field
    descriptorError:
      value:
        code: ERROR
        message: Error to get Descriptor
    requestorNotFound:
      value:
        code: USER_NOT_ALLOWED
        message: Error during retrive requestor info
